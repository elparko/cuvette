name: build index

# Runs after a merge to main. It builds index.json from the folders in adapters/ and commits it.
# An adapter that fails the lint or a known-answer test stays out of the index.

on:
  push:
    branches: [main]
    paths: ["adapters/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CUVETTE_REPO: elparko/cuvette
  CUVETTE_REF: main

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CUVETTE_REPO }}
          ref: ${{ env.CUVETTE_REF }}
          path: cuvette
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: cuvette
      - name: Build index.json
        run: >-
          node cuvette/scripts/build-registry-index.mjs adapters
          --out index.json
          --repo-root .
          --git "${{ github.server_url }}/${{ github.repository }}.git"
          --commit "${{ github.sha }}"
          --registry "https://raw.githubusercontent.com/${{ github.repository }}/main/index.json"
          --run-tests
      - name: Commit index.json
        run: |
          git config user.name "cuvette-registry"
          git config user.email "cuvette-registry@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "Update index.json"
          git push
