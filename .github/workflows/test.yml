name: tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pandoc
      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Text lint (warning only)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run lint:text
      - run: npx vitest run
        env:
          CI: "false"

  imagej-live:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Download ImageJ 1.53v
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/imagej"
          curl -sSfL -o "$RUNNER_TEMP/imagej/ij.jar" https://wsr.imagej.net/jars/ij153v.jar
          echo "IMAGEJ_JAR=$RUNNER_TEMP/imagej/ij.jar" >> "$GITHUB_ENV"
      - name: ImageJ live tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a npx vitest run tests/imagej.test.ts tests/macro.test.ts
          xvfb-run -a node bin/cuvette.js adapter check imagej --run-tests --gui
        env:
          CUVETTE_LIVE: "1"
          CI: "false"
      - name: ImageJ live tests (Windows)
        if: runner.os == 'Windows'
        run: |
          npx vitest run tests/imagej.test.ts tests/macro.test.ts
          node bin/cuvette.js adapter check imagej --run-tests --gui
        env:
          CUVETTE_LIVE: "1"
          CI: "false"
