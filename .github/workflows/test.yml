name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pandoc
      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          CI: "false"
