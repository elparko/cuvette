name: tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pandoc
      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run ui:build
        if: runner.os == 'Linux'
      - run: npm run build
        if: runner.os == 'Linux'
      - run: node dist/cli.js --version
        if: runner.os == 'Linux'
      - run: npm pack --dry-run
        if: runner.os == 'Linux'
      - name: Text lint (warning only)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run lint:text
      - run: npx vitest run
        env:
          CI: "false"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          CI: "false"
      - name: Create the files that the Tauri build script needs
        run: |
          mkdir -p desktop/build/core desktop/build/bin
          touch desktop/build/bin/node-aarch64-apple-darwin
          chmod +x desktop/build/bin/node-aarch64-apple-darwin
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  imagej-live:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Download ImageJ 1.53v
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/imagej"
          curl -sSfL -o "$RUNNER_TEMP/imagej/ij.jar" https://wsr.imagej.net/jars/ij153v.jar
          echo "IMAGEJ_JAR=$RUNNER_TEMP/imagej/ij.jar" >> "$GITHUB_ENV"
      - name: ImageJ live tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a npx vitest run tests/imagej.test.ts tests/macro.test.ts
          xvfb-run -a node bin/cuvette.js adapter check imagej --run-tests --gui
        env:
          CUVETTE_LIVE: "1"
          CI: "false"
      - name: ImageJ live tests (Windows)
        if: runner.os == 'Windows'
        run: |
          npx vitest run tests/imagej.test.ts tests/macro.test.ts
          node bin/cuvette.js adapter check imagej --run-tests --gui
        env:
          CUVETTE_LIVE: "1"
          CI: "false"
