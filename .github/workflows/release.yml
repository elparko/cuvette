name: release

# The secret NPM_TOKEN must exist in the repository settings.
# The jobs run in this order: check, desktop, publish. The publish job does not start if the desktop build fails.
# The desktop build is unsigned until a signing certificate exists.
# A tag that starts with v starts this workflow. Example: v0.1.0.

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check that the tag matches the versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in package.json desktop/src-tauri/tauri.conf.json; do
            version=$(node -p "require('./$file').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME but $file has version $version. Make them equal."
              exit 1
            fi
          done

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run ui:build
      - run: npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: disk-image
          path: desktop-image
      - name: Check the test data index
        run: node scripts/check-data-index.mjs
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the release
        run: |
          tarball=$(npm pack --silent)
          gh release create "$GITHUB_REF_NAME" "$tarball" desktop-image/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: check
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: 1.90.0
      - name: Read the Node version for the cache key
        id: node-version
        run: echo "version=$(sed -n 's/^const NODE_VERSION = \"\(.*\)\";/\1/p' desktop/scripts/build.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cuvette/node-v${{ steps.node-version.outputs.version }}-small
          key: cuvette-node-${{ steps.node-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disk-image
          path: desktop/build/*.dmg
          if-no-files-found: error
