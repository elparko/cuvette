name: CLA

# Each contributor must accept CLA.md once. The contributor writes the sign comment on a pull
# request. The action stores the signature in signatures/version1/cla.json on the
# cla-signatures branch. That branch must exist and must not be protected.
#
# pull_request_target runs this workflow from the base branch. It never checks out the code of
# the pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/elparko/cuvette/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: elparko,dependabot[bot],github-actions[bot]
