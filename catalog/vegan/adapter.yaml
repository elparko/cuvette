            doi     = {10.1016/0022-5193(66)90013-0}
          }

  - name: rarefy_richness
    title: Rarefy the species richness
    description: >
      Compute the expected number of species at a fixed number of individuals for each site. Sites
      with fewer individuals drop out. The table must hold whole-number counts.
    params:
      community: { type: string, description: Path of the community table (CSV). }
      sample_size: { type: integer, minimum: 1, maximum: 1000000, description: "Leave out. The harness sets it from the decision record. Number of individuals. If missing, the tool uses the smallest site total." }
    required: [community]
    read_only: true
    outputs:
      table: { kind: table, ext: .csv, description: One row for each site with observed and rarefied richness. }
      plot: { kind: image, ext: .png, description: Rarefaction curves. }
    script: scripts/rarefy_richness.R
    parse: json
    citations:
      - text: "Hurlbert, S. H. (1971). The Nonconcept of Species Diversity: A Critique and Alternative Parameters. Ecology, 52(4), 577–586. https://doi.org/10.2307/1934145"
        doi: 10.2307/1934145
        bibtex: |
          @article{hurlbert1971nonconcept,
            author  = {Hurlbert, Stuart H.},
            title   = {The Nonconcept of Species Diversity: A Critique and Alternative Parameters},
            journal = {Ecology},
            year    = {1971},
            volume  = {52},
            number  = {4},
            pages   = {577--586},
            doi     = {10.2307/1934145}
          }

  - name: run_nmds
    title: Non-metric multidimensional scaling
    description: >
      Transform the table, compute the distance, and run NMDS with random starts. Returns the
      stress, the site scores and a plot. With environment and color_by, the plot colors the
      sites by a column.
    params:
      community: { type: string, description: Path of the community table (CSV). }
      environment: { type: string, description: "Optional. Path of the site table, for the colors of the plot." }
      color_by: { type: string, description: "Optional. Column of the site table for the colors." }
      distance: { type: string, enum: [bray, jaccard, euclidean, manhattan, gower, horn, canberra, chord], description: "Leave out. The harness sets it from the decision record. Distance measure." }
      transform: { type: string, enum: [none, sqrt, log1p, hellinger, wisconsin, presence], description: "Leave out. The harness sets it from the decision record. Transformation before the distance." }
      k: { type: integer, minimum: 1, maximum: 10, description: "Leave out. The harness sets it from the decision record. Number of dimensions." }
      trymax: { type: integer, minimum: 1, maximum: 500, description: "Leave out. The harness sets it from the decision record. Maximum number of random starts." }
      seed: { type: integer, minimum: 0, maximum: 1000000, description: "Leave out. The harness sets it from the decision record. Random seed." }
    required: [community]
    outputs:
      scores: { kind: table, ext: .csv, description: Site scores. }
      plot: { kind: image, ext: .png, description: NMDS plot of the sites. }
    script: scripts/run_nmds.R
    parse: json
    citations:
      - text: Kruskal, J. B. (1964). Multidimensional Scaling by Optimizing Goodness of Fit to a Nonmetric Hypothesis. Psychometrika, 29(1), 1–27. https://doi.org/10.1007/BF02289565
        doi: 10.1007/BF02289565
        bibtex: |
          @article{kruskal1964multidimensional,
            author  = {Kruskal, J. B.},
            title   = {Multidimensional Scaling by Optimizing Goodness of Fit to a Nonmetric Hypothesis},
            journal = {Psychometrika},
            year    = {1964},
            volume  = {29},
            number  = {1},
            pages   = {1--27},
            doi     = {10.1007/BF02289565}
          }
      - text: Legendre, P., & Gallagher, E. D. (2001). Ecologically meaningful transformations for ordination of species data. Oecologia, 129(2), 271–280. https://doi.org/10.1007/s004420100716
        doi: 10.1007/s004420100716
        when:
          transform: hellinger
        bibtex: |
          @article{legendre2001ecologically,
            author  = {Legendre, Pierre and Gallagher, Eugene D.},
            title   = {Ecologically meaningful transformations for ordination of species data},
            journal = {Oecologia},
            year    = {2001},
            volume  = {129},
            number  = {2},
            pages   = {271--280},
            doi     = {10.1007/s004420100716}
          }

  - name: run_permanova
    title: PERMANOVA
    description: >
      Test if the centres of groups differ, with a permutation test on a distance matrix
      (adonis2). Returns R2, F and p for each term. Run test_dispersion for the same grouping
      variable.
    params:
      community: { type: string, description: Path of the community table (CSV). }
      environment: { type: string, description: Path of the site table (CSV). }
      formula: { type: string, description: "Leave out. The harness sets it from the decision record. Terms of the model, such as Management or Management + A1." }
      distance: { type: string, enum: [bray, jaccard, euclidean, manhattan, gower, horn, canberra, chord], description: "Leave out. The harness sets it from the decision record. Distance measure." }
      transform: { type: string, enum: [none, sqrt, log1p, hellinger, wisconsin, presence], description: "Leave out. The harness sets it from the decision record. Transformation before the distance." }
      by: { type: string, enum: [terms, margin], description: "Leave out. The harness sets it from the decision record. Sequential or marginal test of the terms." }
      permutations: { type: integer, minimum: 99, maximum: 99999, description: "Leave out. The harness sets it from the decision record. Number of permutations." }
      seed: { type: integer, minimum: 0, maximum: 1000000, description: "Leave out. The harness sets it from the decision record. Random seed." }
      strata: { type: string, description: "Leave out. The harness sets it from the decision record. Column of the site table that defines the blocks. none means free permutation." }
    required: [community, environment]
    outputs:
      table: { kind: table, ext: .csv, description: The PERMANOVA table. }
    script: scripts/run_permanova.R
    parse: json
    citations:
      - text: Anderson, M. J. (2001). A new method for non-parametric multivariate analysis of variance. Austral Ecology, 26(1), 32–46. https://doi.org/10.1111/j.1442-9993.2001.01070.pp.x
        doi: 10.1111/j.1442-9993.2001.01070.pp.x
        bibtex: |
          @article{anderson2001new,
            author  = {Anderson, Marti J.},
            title   = {A new method for non-parametric multivariate analysis of variance},
            journal = {Austral Ecology},
            year    = {2001},
            volume  = {26},
            number  = {1},
            pages   = {32--46},
            doi     = {10.1111/j.1442-9993.2001.01070.pp.x}
          }
      - text: Legendre, P., & Gallagher, E. D. (2001). Ecologically meaningful transformations for ordination of species data. Oecologia, 129(2), 271–280. https://doi.org/10.1007/s004420100716
        doi: 10.1007/s004420100716
        when:
          transform: hellinger
        bibtex: |
          @article{legendre2001ecologically,
            author  = {Legendre, Pierre and Gallagher, Eugene D.},
            title   = {Ecologically meaningful transformations for ordination of species data},
            journal = {Oecologia},
            year    = {2001},
            volume  = {129},
            number  = {2},
            pages   = {271--280},
            doi     = {10.1007/s004420100716}
          }

  - name: test_dispersion
    title: Test the dispersion of groups
    description: >
      Test if the groups have the same spread (betadisper and permutest). The spread is the
      distance of each site to the spatial median of its group, or to the centroid if type is
      centroid. A difference in spread can make PERMANOVA significant without a difference in
      centre. Returns F, p, the mean distance of each group, and a plot.
    params:
      community: { type: string, description: Path of the community table (CSV). }
      environment: { type: string, description: Path of the site table (CSV). }
      variable: { type: string, description: "Leave out. The harness sets it from the decision record. Grouping column of the site table." }
      distance: { type: string, enum: [bray, jaccard, euclidean, manhattan, gower, horn, canberra, chord], description: "Leave out. The harness sets it from the decision record. Distance measure." }
      transform: { type: string, enum: [none, sqrt, log1p, hellinger, wisconsin, presence], description: "Leave out. The harness sets it from the decision record. Transformation before the distance." }
      permutations: { type: integer, minimum: 99, maximum: 99999, description: "Leave out. The harness sets it from the decision record. Number of permutations." }
      seed: { type: integer, minimum: 0, maximum: 1000000, description: "Leave out. The harness sets it from the decision record. Random seed." }
      strata: { type: string, description: "Leave out. The harness sets it from the decision record. Column of the site table that defines the blocks." }
      type: { type: string, enum: [median, centroid], default: median, description: "Point that the distances run to. median is the spatial median (the vegan default). centroid is the mean that Anderson (2006) describes." }
    required: [community, environment]
    read_only: true
    outputs:
      plot: { kind: image, ext: .png, description: Sites and group centres in the principal coordinate space. }
    script: scripts/test_dispersion.R
    parse: json
    citations:
      - text: Anderson, M. J. (2006). Distance-Based Tests for Homogeneity of Multivariate Dispersions. Biometrics, 62(1), 245–253. https://doi.org/10.1111/j.1541-0420.2005.00440.x
        doi: 10.1111/j.1541-0420.2005.00440.x
        bibtex: |
          @article{anderson2006distance,
            author  = {Anderson, Marti J.},
            title   = {Distance-Based Tests for Homogeneity of Multivariate Dispersions},
            journal = {Biometrics},
            year    = {2006},
            volume  = {62},
            number  = {1},
            pages   = {245--253},
            doi     = {10.1111/j.1541-0420.2005.00440.x}
          }
      - text: Legendre, P., & Gallagher, E. D. (2001). Ecologically meaningful transformations for ordination of species data. Oecologia, 129(2), 271–280. https://doi.org/10.1007/s004420100716
        doi: 10.1007/s004420100716
        when:
          transform: hellinger
        bibtex: |
          @article{legendre2001ecologically,
            author  = {Legendre, Pierre and Gallagher, Eugene D.},
            title   = {Ecologically meaningful transformations for ordination of species data},
            journal = {Oecologia},
            year    = {2001},
            volume  = {129},
            number  = {2},
            pages   = {271--280},
            doi     = {10.1007/s004420100716}
          }

  - name: run_rda
    title: Redundancy analysis
    description: >
      Fit a constrained ordination (rda) of the transformed table on explanatory variables, and
      test the model and each term with permutations. Returns the fraction of variance that the
      model holds, the adjusted R2, F and p, and a plot.
    params:
      community: { type: string, description: Path of the community table (CSV). }
      environment: { type: string, description: Path of the site table (CSV). }
      formula: { type: string, description: "Leave out. The harness sets it from the decision record. Terms of the model, such as Management + A1." }
      transform: { type: string, enum: [none, sqrt, log1p, hellinger, wisconsin, presence], description: "Leave out. The harness sets it from the decision record. Transformation of the table." }
      scale: { type: boolean, description: "Leave out. The harness sets it from the decision record. Scale the species to unit variance." }
      permutations: { type: integer, minimum: 99, maximum: 99999, description: "Leave out. The harness sets it from the decision record. Number of permutations." }
      seed: { type: integer, minimum: 0, maximum: 1000000, description: "Leave out. The harness sets it from the decision record. Random seed." }
      strata: { type: string, description: "Leave out. The harness sets it from the decision record. Column of the site table that defines the blocks." }
    required: [community, environment]
    outputs:
      table: { kind: table, ext: .csv, description: The test of each term. }
      plot: { kind: image, ext: .png, description: RDA triplot. }
    script: scripts/run_rda.R
    parse: json
    citations:
      - text: Legendre, P., & Gallagher, E. D. (2001). Ecologically meaningful transformations for ordination of species data. Oecologia, 129(2), 271–280. https://doi.org/10.1007/s004420100716
        doi: 10.1007/s004420100716
