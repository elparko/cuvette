  - name: power_anova
    title: Power of a one-way ANOVA
    description: >
      Compute the sample size per group, the power or the detectable effect size (Cohen's f) of a one-way ANOVA with k
      groups. Give f, or the expected group means and the SD inside the groups.
    params:
      solve_for: { type: string, enum: [n, power, f], description: "The value that the tool computes." }
      k: { type: integer, minimum: 2, description: "Number of groups (a count)." }
      f: { type: number, minimum: 0, description: "Cohen's f (unitless): the SD of the group means divided by the SD inside the groups." }
      group_means: { type: array, items: { type: number }, description: "Expected mean of each group, in the unit of the outcome. Use with sd in place of f." }
      sd: { type: number, minimum: 0, description: "Common SD inside the groups, in the unit of the outcome." }
      n: { type: number, minimum: 2, description: "Number of subjects per group (a count)." }
      alpha: { type: number, minimum: 0.0001, maximum: 0.4, description: "Leave out. The harness sets it from the decision record. Significance level." }
      power: { type: number, minimum: 0.05, maximum: 0.999, description: "Leave out. The harness sets it from the decision record. Power (a fraction)." }
      dropout: { type: number, minimum: 0, maximum: 0.9, description: "Leave out. The harness sets it from the decision record. Expected dropout (a fraction)." }
      effect_source: { type: string, description: "Leave out. The harness sets it from the decision record. Source of the effect size." }
    required: [solve_for]
    read_only: true
    outputs:
      curve: { kind: image, ext: .png, description: Power by sample size. }
    script: scripts/power_anova.R
    parse: json
