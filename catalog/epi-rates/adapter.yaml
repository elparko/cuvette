adapter:
  name: epi-rates
  field: epidemiology
  file_types: [".csv"]
  title: epitools (rates, rate ratios, standardization, attributable risk)
  version: 0.1.0
  spec: "1"
  description: >
    Computes incidence rates and proportions with exact confidence intervals, rate ratios, risk ratios, risk differences,
    attributable fractions and the number needed to treat. It standardizes rates by age, directly and indirectly. It uses the R
    package epitools. The scientist decides the interval method, the standard population and the rate multiplier.
  authors: [Parker Smith]
  status: draft

program:
  name: epitools
  version: "0.5.10.1"
  tested_versions: []
  homepage: https://cran.r-project.org/package=epitools
  docs:
    - https://cran.r-project.org/web/packages/epitools/epitools.pdf
    - https://www.medepi.com/epitools/
  install: >
    Install R (brew install r on macOS). Then install the R packages epitools and jsonlite into a library folder that the adapter
    reads: CUVETTE_R_LIBS, R_LIBS_USER, /Volumes/T7/guided-analysis/tools/R-library or ~/.cuvette/R-library.
    mkdir -p ~/.cuvette/R-library && R_LIBS_USER=$HOME/.cuvette/R-library Rscript -e 'install.packages(c("epitools", "jsonlite"), repos = "https://cloud.r-project.org")'
  citation:
    - text: "Aragon, T. J. (2020). epitools: Epidemiology Tools. R package version 0.5-10.1. https://doi.org/10.32614/CRAN.package.epitools"
      doi: 10.32614/CRAN.package.epitools

connection:
  kind: script
  interpreter: ["{program_path}"]
  startup_timeout_s: 120
  call_timeout_s: 300

locate:
  env: RSCRIPT_PATH
  paths:
    - /opt/homebrew/bin/Rscript
    - /usr/local/bin/Rscript
    - /usr/bin/Rscript
    - /Library/Frameworks/R.framework/Resources/bin/Rscript
    - C:\Program Files\R\R-*\bin\Rscript.exe
  which: [Rscript]
  version_command: ["{program_path}", "--version"]
  version_pattern: "version (\\d+\\.\\d+\\.\\d+)"
  identity: 'Rscript \(R\) version'

standards: >
  Every script puts the R package library in front of the library path. The library is the first folder that exists of these:
  CUVETTE_R_LIBS, R_LIBS_USER, /Volumes/T7/guided-analysis/tools/R-library, ~/.cuvette/R-library. The program version in this
  adapter is the version of the R package epitools, not of R. The tools read counts and person-time. They read no data of persons.

data_rules:
  cloud_visibility: all
  note: The tools read counts, person-time and rates of groups. They read no data of persons.

decisions:
  - key: per
    label: Rate multiplier
    kind: int
    default: 100000
    lo: 1
    hi: 100000000
    group: Scale
    help: >
      The tools give each rate per this number of persons or person-time units. Use 100000 for a rate per 100,000. Use 1000 for a
      rate per 1,000.
    essential: true
    owner: human
    stage: setup
    links:
      - { tool: estimate_rate, arg: per }
      - { tool: compare_rates, arg: per }
      - { tool: standardize_rates, arg: per }

  - key: alpha
    label: Significance level of the intervals
    kind: float
    default: 0.05
    lo: 0.001
    hi: 0.5
    group: Scale
    help: The intervals have the confidence level one minus this value. The unit is a fraction. 0.05 gives 95% intervals.
    owner: human
    stage: setup
    links:
      - { tool: estimate_rate, arg: alpha }
      - { tool: compare_rates, arg: alpha }
      - { tool: standardize_rates, arg: alpha }

  - key: ci_method
    label: Interval of a rate or a proportion
    kind: choice
    choices: [exact, wilson]
    default: exact
    group: Interval
    help: >
      exact gives the exact Poisson interval for a rate and the Clopper-Pearson interval for a proportion. It never falls below the
      stated level. wilson gives the Wilson score interval for a proportion. It is shorter and works only for a proportion.
    essential: true
    owner: human
    stage: when_needed
    links:
      - { tool: estimate_rate, arg: ci_method }
    sensitivity:
      options: [exact, wilson]
      tool: estimate_rate
      args: { measure: proportion }
      compare: [metrics.lower, metrics.upper]
      max_runs: 2

  - key: rate_ratio_method
    label: Interval of the rate ratio
    kind: choice
    choices: [midp, exact, wald]
    default: midp
    group: Interval
    help: >
      midp is the mid-p exact interval. It is the default of epitools and OpenEpi. exact is the conditional exact interval. It is
      wider and never falls below the stated level. wald is the normal approximation on the log scale. It is poor for few events.
    essential: true
    owner: human
    stage: when_needed
    links:
      - { tool: compare_rates, arg: rate_ratio_method }
    sensitivity:
      options: [midp, exact, wald]
      tool: compare_rates
      compare: [metrics.rate_ratio_low, metrics.rate_ratio_high]
      max_runs: 3

  - key: wording
    label: Exposure or treatment wording
    kind: choice
    choices: [exposure, treatment]
    default: exposure
    group: Comparison
    help: >
      exposure reads group A as the exposed group. treatment reads group A as the treated group and adds the relative risk
      reduction. The numbers do not change. The words in the summary do.
    owner: human
    stage: when_needed
    changes_conclusion: false
    links:
      - { tool: compare_rates, arg: wording }

  - key: time_horizon
    label: Time horizon of the risks
    kind: text
    default: not stated
    group: Comparison
    help: >
      A number needed to treat holds only for one follow-up time. Name the time, such as 5 years or 30 days. The tool puts the text
      next to the number.
    owner: human
    stage: when_needed
    changes_conclusion: false
    links:
      - { tool: compare_rates, arg: time_horizon }

  - key: exposure_prevalence
    label: Exposure prevalence for the population attributable fraction
    kind: text
    default: sample
    group: Comparison
    help: >
      The population attributable fraction needs the fraction of the target population that has the exposure. sample takes the share
      of group A in the data. Use it only if the sample represents the population. Otherwise give a fraction such as 0.2.
    owner: human
    stage: when_needed
    links:
      - { tool: compare_rates, arg: exposure_prevalence }

  - key: standardization_method
    label: Direct or indirect standardization
    kind: choice
    choices: [direct, indirect]
    default: direct
    group: Standardization
    help: >
      direct applies the age-specific rates of each group to one standard population. Use it when the age-specific rates are stable.
      indirect applies reference rates to the age structure of the group. It gives the ratio of observed to expected counts.
      Use it for small groups.
    essential: true
    owner: human
    stage: when_needed
    links:
      - { tool: standardize_rates, arg: method }

  - key: standard_population
    label: Standard population for direct standardization
    kind: choice
    choices: [us2000_11, custom]
    default: us2000_11
    group: Standardization
    help: >
      us2000_11 is the year 2000 United States standard population. It has 11 age groups. The groups are under 1, 1-4, 5-14, 10-year
      groups to 75-84, and 85 and over. custom reads the weights from a column of the table. Use it for the WHO or Segi weights.
      The age groups of the table must match the standard.
    essential: true
    owner: human
    stage: when_needed
    links:
      - { tool: standardize_rates, arg: standard }

  - key: sir_ci
    label: Interval of the standardized ratio
    kind: choice
    choices: [exact, log]
    default: exact
    group: Standardization
    help: >
      exact divides the exact Poisson interval of the observed count by the expected count. log is the normal approximation on the
      log scale. The epitools function uses it. exact is better when the observed count is below 100.
    owner: human
    stage: when_needed
    links:
      - { tool: standardize_rates, arg: sir_ci }

  - key: reference_rates
    label: Source of the reference rates
    kind: text
    default: not stated
    group: Standardization
    help: >
      Indirect standardization needs reference rates for each age group. Name the source, the place and the year. The tool puts the
      text in the summary.
    owner: human
    stage: when_needed
    changes_conclusion: false
    links:
      - { tool: standardize_rates, arg: reference_source }

checks:
  - id: crude_rates_compared
    description: The answer compares crude rates of groups that have different age structure.
    severity: warning
    text: >
      Report the answer if it calls a crude rate difference or ratio between two populations a real difference in risk, and the
      populations can have different age structures, and the answer does not give a standardized rate.
  - id: standard_not_named
    description: The answer gives a standardized rate and does not name the standard population.
    severity: warning
    text: >
      Report the answer if it gives an age-adjusted or standardized rate and does not name the standard population or the reference rates.
  - id: number_needed_without_time
    description: The answer gives a number needed to treat with no follow-up time.
    severity: warning
    text: >
      Report the answer if it gives a number needed to treat or to harm and does not name the follow-up time of the risks.
  - id: infinite_interval_hidden
    description: The answer gives a finite interval of the number needed to treat when the risk difference interval includes 0.
    severity: warning
    text: >
      Report the answer if the result says that the interval of the risk difference includes 0 and the answer gives the interval of the
      number needed to treat as two finite numbers.
  - id: attributable_fraction_causal
    description: The answer says that the attributable fraction is the share of cases that the exposure caused.
    severity: warning
    text: >
      Report the answer if it says that the exposure caused the attributable fraction of the cases, with no mention that the reading
      needs a causal effect and no bias from confounding.
  - id: rate_ratio_called_risk_ratio
    description: The answer calls an odds ratio or a rate ratio a risk ratio.
    severity: warning
    text: >
      Report the answer if it reports an odds ratio or a rate ratio as a risk ratio, or says that an odds ratio of a common outcome
      equals the risk ratio.

map:
  - tool: estimate_rate
    route: "R: epitools::pois.exact(x, pt, conf.level) for a rate; epitools::binom.exact(x, n) or binom.wilson(x, n) for a proportion. Multiply by the multiplier."
    steps:
      - "R: pois.exact(x = events, pt = person_time, conf.level = 0.95) gives the rate, the lower limit and the upper limit. Multiply each by the rate multiplier."
      - "R: binom.exact(x = events, n = population) gives the proportion with the Clopper-Pearson interval. binom.wilson gives the Wilson interval."
      - "Stata: cii proportions n x for a proportion with the exact interval. cii means n x, poisson for a rate (n is the person-time, x the events)."
      - "OpenEpi: Counts > Person-Time > Single rate for a rate (the Mid-P exact interval and the Fisher exact interval). Counts > Proportion for a proportion."
    params:
      - { arg: events, label: "Number of cases (x) in the function" }
      - { arg: person_time, label: "Person-time (pt) in pois.exact" }
      - { arg: population, label: "Number at risk (n) in binom.exact" }
      - { arg: ci_method, label: "binom.exact or binom.wilson", ui_default: exact }
      - { arg: per, label: "Multiplier of the rate" }
      - { arg: alpha, label: "One minus conf.level", ui_default: 0.05 }
    fidelity: exact
    evidence:
      source: docs
      test: poisson-exact-scipy
      note: The tool calls pois.exact and binom.exact. A SciPy calculation gives the same intervals (checks/check_epi_scipy.py).

  - tool: compare_rates
    route: "R: epitools::rateratio(c(x0, x1, t0, t1)), riskratio(m), oddsratio(m). Risk difference and number needed to treat by hand."
    steps:
      - "R: rateratio(c(cases_ref, cases_exposed, pt_ref, pt_exposed), method = 'midp') gives the rate ratio with the mid-p interval. method = 'wald' gives the Wald interval."
      - "R: riskratio(matrix) and oddsratio(matrix) give the Wald ratios of a 2 by 2 table. The risk difference is the difference of the two proportions."
      - "Stata: ir cases_exposed cases_ref pt_exposed pt_ref for a rate ratio with the rate difference. cs cases_exposed cases_ref noncases_exposed noncases_ref for the risk difference, risk ratio, attributable fraction and population attributable fraction."
      - "OpenEpi: Counts > Two by Two Table for the risk ratio, odds ratio and risk difference with the attributable fractions. Counts > Person-Time > Two rates for the rate ratio."
      - "SAS: PROC FREQ with the option RELRISK RISKDIFF on a 2 by 2 table."
    params:
      - { arg: events_a, label: "Cases in the exposed group" }
      - { arg: events_b, label: "Cases in the reference group" }
      - { arg: person_time_a, label: "Person-time of the exposed group" }
      - { arg: person_time_b, label: "Person-time of the reference group" }
      - { arg: population_a, label: "Number at risk in the exposed group" }
      - { arg: population_b, label: "Number at risk in the reference group" }
      - { arg: rate_ratio_method, label: "method of rateratio()", ui_default: midp }
      - { arg: exposure_prevalence, label: "Prevalence of exposure for the population attributable fraction (Stata cs uses the controls or the sample)" }
      - { arg: alpha, label: "One minus conf.level", ui_default: 0.05 }
    fidelity: close
    difference: >
      Epitools reports the median-unbiased estimate with the mid-p interval. The tool reports the crude rate ratio with the mid-p
      interval of epitools. Stata ir uses the exact conditional interval. OpenEpi and epitools give the same mid-p interval. The Stata,
      OpenEpi and SAS routes were not run.
    evidence:
      source: docs
      test: rothman-rate-ratio-midp
      note: The mid-p interval of epitools matches an independent SciPy root search to 0.0005 (checks/check_epi_scipy.py).

  - tool: standardize_rates
    route: "R: epitools::ageadjust.direct(count, pop, stdpop) and epitools::ageadjust.indirect(count, pop, stdcount, stdpop)"
    steps:
      - "R: ageadjust.direct(count = deaths, pop = person_years, stdpop = standard) gives the crude rate, the adjusted rate and the gamma interval of Fay and Feuer."
      - "R: ageadjust.indirect(count, pop, stdcount, stdpop) gives the observed count, the expected count and the ratio. The tool uses the exact Poisson interval of the observed count."
      - "Stata: dstdize deaths pop agegroup, by(group) using standard_file for the direct method. istdize deaths pop agegroup using reference_file, by(group) for the indirect method."
      - "SAS: PROC STDRATE DATA=t REFDATA=ref METHOD=DIRECT STAT=RATE. METHOD=INDIRECT gives the standardized ratio."
      - "OpenEpi: Counts > Standardized Rates and Ratios is not available. Use the Open Source Epidemiologic Statistics page for age-standardization of two groups."
    params:
      - { arg: method, label: "direct or indirect function" }
      - { arg: standard, label: "stdpop (the standard population)" }
      - { arg: sir_ci, label: "Interval of the ratio", ui_default: log }
      - { arg: per, label: "Multiplier of the rate" }
      - { arg: alpha, label: "One minus conf.level", ui_default: 0.05 }
    fidelity: close
    difference: >
      The direct method gives the same numbers as ageadjust.direct. The indirect method uses the exact Poisson interval by default,
      and epitools uses a log-normal interval. The choice sir_ci log gives the epitools interval. The ratio of two standardized rates
      has an interval on the log scale, which epitools does not give. The Stata, SAS and OpenEpi routes were not run.
    evidence:
      source: docs
      test: fay-feuer-table-1
      note: The gamma intervals equal the values in Table 1 of Fay and Feuer 1997 and a SciPy calculation (checks/check_epi_scipy.py).

tests:
  - id: poisson-exact-scipy
    description: >
      An exact Poisson interval for 15 events in 19017 person-years, per 1000. A SciPy calculation with the gamma quantiles gives the
      values (checks/check_epi_scipy.py and check_epi_scipy.out).
    calls:
      - tool: estimate_rate
        args: { measure: incidence_rate, events: 15, person_time: 19017, ci_method: exact, per: 1000, alpha: 0.05 }
    expect:
      - { path: metrics.estimate, approx: 0.788768, abs: 0.000001 }
      - { path: metrics.lower, approx: 0.441467, abs: 0.000001 }
      - { path: metrics.upper, approx: 1.300953, abs: 0.000001 }

  - id: poisson-zero-events
    description: Zero events in 500 person-years give an upper limit of 7.377759 per 1000, which is the gamma quantile 3.688879 divided by 500 (SciPy).
    calls:
      - tool: estimate_rate
        args: { measure: incidence_rate, events: 0, person_time: 500, ci_method: exact, per: 1000 }
    expect:
      - { path: metrics.lower, equals: 0 }
      - { path: metrics.upper, approx: 7.377759, abs: 0.000001 }

  - id: binomial-exact
    description: The Clopper-Pearson interval for 12 of 18 (SciPy beta quantiles, checks/check_epi_scipy.out).
    calls:
      - tool: estimate_rate
        args: { measure: proportion, events: 12, population: 18, ci_method: exact, per: 1 }
    expect:
      - { path: metrics.estimate, approx: 0.666667, abs: 0.000001 }
      - { path: metrics.lower, approx: 0.409925, abs: 0.000001 }
      - { path: metrics.upper, approx: 0.866573, abs: 0.000001 }

  - id: binomial-wilson-groups
    description: >
      The Wilson interval of three groups from a table, as percent. The tap water table of the epitools example gives 12 of 18 in
      the highest group (SciPy, checks/check_epi_scipy.out).
    data: [data/tap_water.csv]
    calls:
      - tool: estimate_rate
        args: { measure: proportion, data: "{adapter_dir}/data/tap_water.csv", events_col: cases, population_col: total, group_col: group, ci_method: wilson, per: 100 }
    expect:
      - { path: metrics.n_groups, equals: 3 }
      - { path: metrics.estimate_highest, approx: 66.666667, abs: 0.00001 }
      - { path: metrics.lower_highest, approx: 43.7495, abs: 0.0001 }
      - { path: metrics.upper_highest, approx: 83.7212, abs: 0.0001 }

  - id: rothman-rate-ratio-midp
    description: >
      The breast cancer example of Rothman 1998, page 238 (epitools example): 41 cases in 28010 person-years of the exposed group
      and 15 in 19017 of the reference group. The mid-p interval of epitools is 1.041036 to 3.449052. A SciPy root search gives
      1.041075 to 3.449423. The rate difference is per 1000 person-years.
    data: [data/rothman_breast_cancer.csv]
    calls:
      - tool: compare_rates
        args: { data: "{adapter_dir}/data/rothman_breast_cancer.csv", group_col: group, group_a: exposed, group_b: unexposed, events_col: events, person_time_col: person_years, wording: exposure, rate_ratio_method: midp, per: 1000 }
    expect:
      - { path: metrics.rate_ratio, approx: 1.855759, abs: 0.000001 }
      - { path: metrics.rate_ratio_low, approx: 1.041036, abs: 0.0005 }
      - { path: metrics.rate_ratio_high, approx: 3.449052, abs: 0.0005 }
      - { path: metrics.rate_ratio_p, approx: 0.0354574, abs: 0.00001 }
      - { path: metrics.rate_difference, approx: 0.674995, abs: 0.000001 }
      - { path: metrics.rate_difference_low, approx: 0.074927, abs: 0.000001 }
      - { path: metrics.rate_difference_high, approx: 1.275063, abs: 0.000001 }

  - id: rate-ratio-exact-and-wald
    description: >
      The same data with the conditional exact interval (SciPy beta quantiles, 1.005684 to 3.6093) and the Wald interval
      (1.027226 to 3.352563). The two calls use the same rate ratio.
    calls:
      - tool: compare_rates
        args: { events_a: 41, events_b: 15, person_time_a: 28010, person_time_b: 19017, wording: exposure, rate_ratio_method: exact, per: 1000 }
        save_as: exact
      - tool: compare_rates
        args: { events_a: 41, events_b: 15, person_time_a: 28010, person_time_b: 19017, wording: exposure, rate_ratio_method: wald, per: 1000 }
    expect:
      - { path: saved.exact.metrics.rate_ratio_low, approx: 1.005684, abs: 0.00001 }
      - { path: saved.exact.metrics.rate_ratio_high, approx: 3.6093, abs: 0.0001 }
      - { path: metrics.rate_ratio_low, approx: 1.027226, abs: 0.00001 }
      - { path: metrics.rate_ratio_high, approx: 3.352563, abs: 0.00001 }

  - id: tap-water-risk-measures
    description: >
      The highest and lowest tap water groups of the epitools example for riskratio(): 12 of 18 against 2 of 31. The package prints
      the risk ratio 10.333333 (2.600475 to 41.06087). SciPy gives the risk difference, the odds ratio, the number needed to harm and
      the attributable fractions (checks/check_epi_scipy.out). The population attributable fraction uses the sample share 18 of 49.
    calls:
      - tool: compare_rates
        args: { events_a: 12, events_b: 2, population_a: 18, population_b: 31, wording: exposure, rate_ratio_method: midp, per: 1000, time_horizon: study period, exposure_prevalence: sample }
    expect:
      - { path: metrics.risk_ratio, approx: 10.333333, abs: 0.000001 }
      - { path: metrics.risk_ratio_low, approx: 2.600475, abs: 0.000001 }
      - { path: metrics.risk_ratio_high, approx: 41.060867, abs: 0.000001 }
      - { path: metrics.risk_difference, approx: 0.602151, abs: 0.000001 }
      - { path: metrics.risk_difference_low, approx: 0.367834, abs: 0.000001 }
      - { path: metrics.risk_difference_high, approx: 0.836467, abs: 0.000001 }
      - { path: metrics.odds_ratio, approx: 29, abs: 0.000001 }
      - { path: metrics.odds_ratio_low, approx: 5.110696, abs: 0.000001 }
      - { path: metrics.odds_ratio_high, approx: 164.556857, abs: 0.000001 }
      - { path: metrics.nnt, approx: 1.660714, abs: 0.000001 }
      - { path: metrics.nnt_low, approx: 1.195504, abs: 0.000001 }
      - { path: metrics.nnt_high, approx: 2.718619, abs: 0.000001 }
      - { path: metrics.nnt_harm, equals: 1 }
      - { path: metrics.attributable_fraction, approx: 0.903226, abs: 0.000001 }
      - { path: metrics.population_attributable_fraction, approx: 0.774194, abs: 0.000001 }

  - id: nnt-interval-includes-infinity
    description: >
      10 events of 100 treated against 13 of 100 controls. The risk difference is -0.03 with the Wald interval -0.118329 to 0.058329
      (hand calculation in checks/check_epi_scipy.out). The interval includes 0, so the number needed to treat is 33.333333 and its
      interval includes infinity.
    calls:
      - tool: compare_rates
        args: { events_a: 10, events_b: 13, population_a: 100, population_b: 100, wording: treatment, rate_ratio_method: midp, per: 1000, time_horizon: 1 year }
    expect:
      - { path: metrics.risk_difference, approx: -0.03, abs: 0.000001 }
      - { path: metrics.risk_difference_low, approx: -0.118329, abs: 0.000001 }
      - { path: metrics.risk_difference_high, approx: 0.058329, abs: 0.000001 }
      - { path: metrics.nnt, approx: 33.333333, abs: 0.00001 }
      - { path: metrics.nnt_ci_includes_infinity, equals: 1 }
      - { path: metrics.nnt_harm, equals: 0 }
      - { path: summary, contains: "through infinity" }
      - { path: metrics.relative_risk_reduction, approx: 0.230769, abs: 0.000001 }

  - id: fay-feuer-table-1
    description: >
      Fay and Feuer 1997, Table 1: births by birth order, standardized to the average age distribution (epitools example data, Fleiss
      1981). Per 100,000. Published for order 1: crude 56.3, adjusted 92.3 (80.4 to 105.8). For 5 or more: adjusted 75.5 (67.7 to
      188.3). The pinned values are the SciPy gamma calculation (checks/check_epi_scipy.out), which rounds to the published numbers.
    data: [data/fay_feuer_births.csv]
    calls:
      - tool: standardize_rates
        args: { data: "{adapter_dir}/data/fay_feuer_births.csv", group_col: birth_order, count_col: count, population_col: population, method: direct, standard: custom, standard_col: standard, per: 100000 }
    expect:
      - { path: metrics.crude_rate_1, approx: 56.3475, abs: 0.0001 }
      - { path: metrics.adjusted_rate_1, approx: 92.3045, abs: 0.0001 }
      - { path: metrics.adjusted_lower_1, approx: 80.4417, abs: 0.0001 }
      - { path: metrics.adjusted_upper_1, approx: 105.7633, abs: 0.0001 }
      - { path: metrics.adjusted_rate_4, approx: 92.7179, abs: 0.0001 }
      - { path: metrics.adjusted_lower_4, approx: 80.01, abs: 0.0001 }
      - { path: metrics.adjusted_upper_4, approx: 114.6694, abs: 0.0001 }
      - { path: metrics.adjusted_rate_5_or_more, approx: 75.529, abs: 0.0001 }
      - { path: metrics.adjusted_lower_5_or_more, approx: 67.7021, abs: 0.0001 }
      - { path: metrics.adjusted_upper_5_or_more, approx: 188.3002, abs: 0.0001 }

  - id: selvin-direct
    description: >
      Selvin 2004, deaths of 1940 standardized to the population of 1960 (epitools example data). The package prints crude 119.53,
      adjusted 139.25 (138.21 to 140.29) per 100,000. SciPy gives 139.2505 (138.2141 to 140.2938).
    data: [data/selvin_us_deaths.csv]
    calls:
      - tool: standardize_rates
        args: { data: "{adapter_dir}/data/selvin_us_deaths.csv", count_col: deaths_1940, population_col: population_1940, method: direct, standard: custom, standard_col: population_1960, per: 100000 }
    expect:
      - { path: metrics.crude_rate, approx: 119.5286, abs: 0.0001 }
      - { path: metrics.adjusted_rate, approx: 139.2505, abs: 0.0001 }
      - { path: metrics.adjusted_lower, approx: 138.2141, abs: 0.0001 }
      - { path: metrics.adjusted_upper, approx: 140.2938, abs: 0.0001 }

  - id: selvin-indirect
    description: >
      The same data with the rates of 1960 as the reference. The package prints observed 71058, expected 85556.89, ratio 0.83 (0.82
      to 0.84) with the log-normal interval, and an indirect rate 137.9 per 100,000. SciPy gives the log-normal interval 0.824451 to
      0.836664 and the exact Poisson interval 0.82444 to 0.836665.
    data: [data/selvin_us_deaths.csv]
    calls:
      - tool: standardize_rates
        args: { data: "{adapter_dir}/data/selvin_us_deaths.csv", count_col: deaths_1940, population_col: population_1940, reference_count_col: deaths_1960, reference_population_col: population_1960, method: indirect, sir_ci: log, per: 100000, reference_source: United States 1960 }
        save_as: log
      - tool: standardize_rates
        args: { data: "{adapter_dir}/data/selvin_us_deaths.csv", count_col: deaths_1940, population_col: population_1940, reference_count_col: deaths_1960, reference_population_col: population_1960, method: indirect, sir_ci: exact, per: 100000 }
    expect:
      - { path: saved.log.metrics.observed, equals: 71058 }
      - { path: saved.log.metrics.expected, approx: 85556.8888, abs: 0.001 }
      - { path: saved.log.metrics.sir, approx: 0.830535, abs: 0.000001 }
      - { path: saved.log.metrics.sir_low, approx: 0.824451, abs: 0.000001 }
      - { path: saved.log.metrics.sir_high, approx: 0.836664, abs: 0.000001 }
      - { path: saved.log.metrics.indirect_rate, approx: 137.9415, abs: 0.0001 }
      - { path: metrics.sir_low, approx: 0.82444, abs: 0.00001 }
      - { path: metrics.sir_high, approx: 0.836665, abs: 0.00001 }

  - id: nchs-deaths-2020
    description: >
      National Vital Statistics Reports 72(10), Deaths: Final Data for 2020 (Kochanek et al. 2023, public domain), Table 2 and Table 5.
      The age-specific death rates of 11 age groups are standardized to the year 2000 United States standard population. The report
      prints these age-adjusted rates: all causes 2020 835.4, all causes 2019 715.2, heart disease 2020 168.2, males 998.3 and females
      695.1. The unrounded values are the SciPy values in checks/check_epi_scipy.out. The table has rates and no counts, so the tool
      gives no interval.
    data: [data/nchs_2020_age_rates.csv]
    calls:
      - tool: standardize_rates
        args: { data: "{adapter_dir}/data/nchs_2020_age_rates.csv", group_col: group, rate_col: rate_per_100000, method: direct, standard: us2000_11, per: 100000, group_a: all_2020, group_b: all_2019 }
    expect:
      - { path: metrics.adjusted_rate_all_2020, approx: 835.4, abs: 0.05 }
      - { path: metrics.adjusted_rate_all_2019, approx: 715.2, abs: 0.05 }
      - { path: metrics.adjusted_rate_heart_2020, approx: 168.2, abs: 0.05 }
      - { path: metrics.adjusted_rate_male_2020, approx: 998.3, abs: 0.05 }
      - { path: metrics.adjusted_rate_female_2020, approx: 695.1, abs: 0.05 }
      - { path: metrics.adjusted_rate_all_2020, approx: 835.42, abs: 0.0001 }
      - { path: metrics.rate_ratio, approx: 1.16802, abs: 0.00001 }

  - id: wald-rate-ratio-from-table
    description: A table with the Wald interval gives the rate ratio 1.855759 and the Wald lower limit 1.027226 (SciPy, checks/check_epi_scipy.out).
    data: [data/rothman_breast_cancer.csv]
    calls:
      - tool: compare_rates
        args: { data: "{adapter_dir}/data/rothman_breast_cancer.csv", group_col: group, group_a: exposed, group_b: unexposed, events_col: events, person_time_col: person_years, wording: treatment, rate_ratio_method: wald, per: 100000 }
    expect:
      - { path: metrics.rate_ratio, approx: 1.855759, abs: 0.000001 }
      - { path: metrics.rate_ratio_low, approx: 1.027226, abs: 0.00001 }

  - id: wilson-for-rate-fails
    description: A Wilson interval for an incidence rate fails, and the error names the choice.
    calls:
      - tool: estimate_rate
        args: { measure: incidence_rate, events: 5, person_time: 100, ci_method: wilson, per: 1000 }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "ci_method 'wilson' works only for measure 'proportion'" }

  - id: estimate-missing-denominator
    description: A table without the population column fails, and the error names the argument and the columns.
    data: [data/tap_water.csv]
    calls:
      - tool: estimate_rate
        args: { measure: proportion, data: "{adapter_dir}/data/tap_water.csv", events_col: cases, population_col: size, ci_method: exact, per: 100 }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "population_col 'size' is not a column" }
      - { path: error, contains: "Columns: group, cases, total" }

  - id: compare-unknown-group
    description: A group that the table does not have fails, and the error lists the groups.
    data: [data/rothman_breast_cancer.csv]
    calls:
      - tool: compare_rates
        args: { data: "{adapter_dir}/data/rothman_breast_cancer.csv", group_col: group, group_a: smokers, group_b: unexposed, events_col: events, person_time_col: person_years, wording: exposure, rate_ratio_method: midp, per: 1000 }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "group 'smokers' is not in column 'group'. Groups: unexposed, exposed" }

  - id: compare-events-above-population
    description: More events than persons at risk fails, and the error says that a risk cannot be above 1.
    calls:
      - tool: compare_rates
        args: { events_a: 30, events_b: 2, population_a: 18, population_b: 31, wording: exposure, rate_ratio_method: midp, per: 1000 }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "A risk cannot be above 1" }

  - id: standard-length-mismatch
    description: A table with 6 age groups and the 11-group standard fails, and the error names both counts.
    data: [data/fay_feuer_births.csv]
    calls:
      - tool: standardize_rates
        args: { data: "{adapter_dir}/data/fay_feuer_births.csv", group_col: birth_order, count_col: count, population_col: population, method: direct, standard: us2000_11, per: 100000 }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "has 6 rows but the standard population 'us2000_11' has 11 age groups" }

  - id: rate-multiplier-missing
    description: A call without the rate multiplier fails, and the error names the decision.
    calls:
      - tool: estimate_rate
        args: { measure: incidence_rate, events: 5, person_time: 100, ci_method: exact }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "decision 'Rate multiplier'" }

tools:
  - name: estimate_rate
    title: Estimate a rate or a proportion with an interval
    description: >
      Estimate an incidence rate from events and person-time, or a proportion (prevalence or cumulative incidence) from events and
      the number at risk. It gives the estimate with an exact interval. Give numbers for one group, or a CSV file with one row for
      each group. It does not compare groups. Use compare_rates for that.
    params:
      measure: { type: string, enum: [incidence_rate, proportion], description: "incidence_rate divides events by person_time. proportion divides events by population." }
      events: { type: number, minimum: 0, description: "Number of events (count) for one group. Leave out if you give data." }
      person_time: { type: number, exclusiveMinimum: 0, description: "Person-time at risk for one group, in one unit such as person-years. Needed for incidence_rate." }
      population: { type: number, exclusiveMinimum: 0, description: "Number of persons at risk for one group (count). Needed for proportion." }
      label: { type: string, description: "Name of the group, for the output only." }
      data: { type: string, description: "Path of a CSV file with a header row and one row for each group. Use it instead of events and the denominator." }
      group_col: { type: string, description: "Column with the group name. Default: the tool numbers the groups." }
      events_col: { type: string, description: "Column with the number of events (count)." }
      person_time_col: { type: string, description: "Column with the person-time, for incidence_rate." }
      population_col: { type: string, description: "Column with the number at risk (count), for proportion." }
      ci_method: { type: string, enum: [exact, wilson], description: "Leave out. The harness sets it from the decision record." }
      per: { type: number, exclusiveMinimum: 0, description: "Leave out. The harness sets it from the decision record. Multiplier of the rate or proportion, such as 100000." }
      alpha: { type: number, minimum: 0.001, maximum: 0.5, description: "Leave out. The harness sets it from the decision record. Significance level as a fraction." }
    required: [measure]
    read_only: true
    batch: false
    outputs:
      rates: { kind: table, ext: .csv, description: "One row for each group with the estimate and the interval." }
    script: scripts/estimate_rate.R
    parse: json
    citations:
      - text: "Clopper, C. J., & Pearson, E. S. (1934). The use of confidence or fiducial limits illustrated in the case of the binomial. Biometrika, 26(4), 404-413. https://doi.org/10.1093/biomet/26.4.404"
        doi: 10.1093/biomet/26.4.404
        when: { ci_method: exact }
      - text: "Wilson, E. B. (1927). Probable inference, the law of succession, and statistical inference. Journal of the American Statistical Association, 22(158), 209-212. https://doi.org/10.1080/01621459.1927.10502953"
        doi: 10.1080/01621459.1927.10502953
        when: { ci_method: wilson }

  - name: compare_rates
    title: Compare two groups (ratios, differences, attributable fractions, number needed to treat)
    description: >
      Compare group A, the exposed or treated group, with group B, the reference. Person-time gives the rate ratio and the rate
      difference. Numbers at risk give the risk ratio, risk difference, odds ratio, attributable fractions and the number needed to
      treat with its interval. Give numbers for both groups, or a CSV file with one row for each group.
    params:
      events_a: { type: number, minimum: 0, description: "Number of events (count) in group A." }
      events_b: { type: number, minimum: 0, description: "Number of events (count) in group B." }
      person_time_a: { type: number, exclusiveMinimum: 0, description: "Person-time of group A, in the same unit as group B." }
      person_time_b: { type: number, exclusiveMinimum: 0, description: "Person-time of group B." }
      population_a: { type: number, exclusiveMinimum: 0, description: "Number of persons at risk in group A (count), for the risk measures." }
      population_b: { type: number, exclusiveMinimum: 0, description: "Number of persons at risk in group B (count)." }
      label_a: { type: string, description: "Name of group A, for the output only." }
      label_b: { type: string, description: "Name of group B, for the output only." }
      data: { type: string, description: "Path of a CSV file with a header row and one row for each group. Use it instead of the numbers." }
      group_col: { type: string, description: "Column with the group name. Needed with data." }
      group_a: { type: string, description: "Name of group A in group_col, the exposed or treated group. Needed with data." }
      group_b: { type: string, description: "Name of group B in group_col, the reference group. Needed with data." }
      events_col: { type: string, description: "Column with the number of events (count)." }
      person_time_col: { type: string, description: "Column with the person-time." }
      population_col: { type: string, description: "Column with the number at risk (count)." }
      wording: { type: string, enum: [exposure, treatment], description: "Leave out. The harness sets it from the decision record." }
      rate_ratio_method: { type: string, enum: [midp, exact, wald], description: "Leave out. The harness sets it from the decision record." }
      time_horizon: { type: string, description: "Leave out. The harness sets it from the decision record. Follow-up time of the risks, as text." }
      exposure_prevalence: { type: [string, number], description: "Leave out. The harness sets it from the decision record. sample, or a fraction between 0 and 1." }
      per: { type: number, exclusiveMinimum: 0, description: "Leave out. The harness sets it from the decision record. Multiplier of the rates." }
      alpha: { type: number, minimum: 0.001, maximum: 0.5, description: "Leave out. The harness sets it from the decision record. Significance level as a fraction." }
    required: []
    read_only: true
    batch: false
    outputs:
      comparison: { kind: table, ext: .csv, description: "One row for each measure with the estimate and the interval." }
    script: scripts/compare_rates.R
    parse: json
    citations:
      - text: "Berry, G., & Armitage, P. (1995). Mid-P confidence intervals: a brief review. The Statistician, 44(4), 417-423. https://doi.org/10.2307/2348891"
        doi: 10.2307/2348891
        when: { rate_ratio_method: midp }
      - text: "Altman, D. G. (1998). Confidence intervals for the number needed to treat. BMJ, 317(7168), 1309-1312. https://doi.org/10.1136/bmj.317.7168.1309"
        doi: 10.1136/bmj.317.7168.1309
      - text: "Levin, M. L. (1953). The occurrence of lung cancer in man. Acta Unio Internationalis Contra Cancrum, 9(3), 531-541. https://pubmed.ncbi.nlm.nih.gov/13124110/"
        url: https://pubmed.ncbi.nlm.nih.gov/13124110/

  - name: standardize_rates
    title: Standardize rates by age (direct and indirect)
    description: >
      Standardize rates by age. Direct standardization applies the age-specific rates of each group to a standard population. It gives
      the adjusted rate with a gamma interval, and the ratio of two adjusted rates. Indirect standardization gives observed and expected
      counts and the standardized ratio (SIR or SMR) with an exact interval. Give a CSV file with one row for each age group.
    params:
      data: { type: string, description: "Path of a CSV file with a header row and one row for each age group, from the youngest to the oldest. One block of rows for each group." }
      group_col: { type: string, description: "Column with the group name, such as the year or the sex. Leave out for one group." }
      count_col: { type: string, description: "Column with the number of events (count) in each age group. Needed for intervals and for the indirect method." }
      population_col: { type: string, description: "Column with the person-years or the persons in each age group." }
      rate_col: { type: string, description: "Column with the age-specific rate, already per the rate multiplier. Direct method only. The tool gives no interval for it." }
      standard_col: { type: string, description: "Column with the standard weights, one for each age group. Needed if standard is custom." }
      reference_rate_col: { type: string, description: "Column with the reference rate in each age group, in events per population unit. Indirect method." }
      reference_count_col: { type: string, description: "Column with the reference events in each age group. Indirect method. Give it with reference_population_col." }
      reference_population_col: { type: string, description: "Column with the reference population in each age group. Indirect method." }
      group_a: { type: string, description: "Group for the numerator of the ratio of standardized rates. Default: the first of two groups." }
      group_b: { type: string, description: "Group for the denominator of the ratio of standardized rates. Default: the second of two groups." }
      method: { type: string, enum: [direct, indirect], description: "Leave out. The harness sets it from the decision record." }
      standard: { type: string, enum: [us2000_11, custom], description: "Leave out. The harness sets it from the decision record." }
      sir_ci: { type: string, enum: [exact, log], description: "Leave out. The harness sets it from the decision record." }
      reference_source: { type: string, description: "Leave out. The harness sets it from the decision record. Source of the reference rates, as text." }
      per: { type: number, exclusiveMinimum: 0, description: "Leave out. The harness sets it from the decision record. Multiplier of the rates." }
      alpha: { type: number, minimum: 0.001, maximum: 0.5, description: "Leave out. The harness sets it from the decision record. Significance level as a fraction." }
    required: [data]
    read_only: true
    batch: false
    outputs:
      standardized: { kind: table, ext: .csv, description: "One row for each group with the crude and standardized values." }
    script: scripts/standardize_rates.R
    parse: json
    citations:
      - text: "Fay, M. P., & Feuer, E. J. (1997). Confidence intervals for directly standardized rates: a method based on the gamma distribution. Statistics in Medicine, 16(7), 791-801. https://doi.org/10.1002/(sici)1097-0258(19970415)16:7<791::aid-sim500>3.0.co;2-#"
        doi: "10.1002/(sici)1097-0258(19970415)16:7<791::aid-sim500>3.0.co;2-#"
        when: { method: direct }
      - text: "Clopper, C. J., & Pearson, E. S. (1934). The use of confidence or fiducial limits illustrated in the case of the binomial. Biometrika, 26(4), 404-413. https://doi.org/10.1093/biomet/26.4.404"
        doi: 10.1093/biomet/26.4.404
        when: { sir_ci: exact }
