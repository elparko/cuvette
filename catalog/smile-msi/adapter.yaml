checks:
  - id: pixel_replication
    severity: error
    description: A test over pixels is presented as a test over replicates.
  - id: failed_result_ignored
    severity: error
    description: A tool failed and the text after it never mentions the failure.
  - id: putative_identity_stated_as_fact
    severity: warning
    description: A lipid is named without the words putative, sum composition or MS/MS.
  - id: p_value_without_effect_size
    severity: warning
    description: The text gives a p-value or q-value with no effect size next to it.
  - id: artefacts_not_addressed
    severity: warning
    description: The results show isotopes or off-tissue background and the answer does not mention them.
  - id: no_question
    severity: info
    description: The setup has no study question.
tests:
  - id: demo-opens
    description: The demo slide opens with two groups of 792 pixels.
    calls:
      - tool: open_slide
        args:
          ref: demo
    expect:
      - { path: metrics.n_pixels, equals: 1584 }
      - { path: data.groups.Group A, equals: 792 }
      - { path: data.settings.ppm, approx: 20 }
      - { path: summary, contains: Opened demo }
  - id: settings-apply
    description: apply_settings changes the slide and reports was and now.
    calls:
      - tool: open_slide
        args:
          ref: demo
      - tool: apply_settings
        args:
          ppm: 10
          norm: rms
    expect:
      - { path: data.was.ppm, approx: 20 }
      - { path: data.now.ppm, approx: 10 }
      - { path: data.now.norm, equals: rms }
      - { path: data.changed, contains: norm }
  - id: demo-planted-lipids
    description: The picker finds the planted peaks. Annotation names the planted lipids.
    calls:
      - &a1
        tool: open_slide
        args:
          ref: demo
      - &a2
        tool: run_script
        args:
          code: |
            rows, cols = ds._pixel_rows_cols()
            h, w = ds.height, ds.width
            e = ((cols - w / 2) / (w * 0.45)) ** 2 + ((rows - h / 2) / (h * 0.45)) ** 2
            add_region("core", e <= 0.405)
            add_region("rim", (e <= 1.0) & (e > 0.495))
      - &a3
        tool: find_peaks
        args:
          max_peaks: 40
        save_as: peaks
      - tool: annotate
        args:
          mz:
            - 766.5388
            - 904.6187
            - 744.5577
            - 885.5488
            - 834.5287
            - 890.6388
            - 281.2486
            - 824.6593
            - 905.6192
            - 767.5395
            - 886.5494
            - 327.2322
          match_ppm: 5
    expect:
      - { path: saved.peaks.metrics.n_features, equals: 40 }
      - { path: saved.peaks.metrics.n_detected, equals: 11432 }
      - { path: metrics.n_matched, equals: 9 }
      - { path: table.rows, contains: PE 38:4 }
      - { path: table.rows, contains: Sulfatide 42:2;O3 }
      - { path: table.rows, contains: FA 22:6 }
  - id: demo-rim-vs-core
    description: The rim differs from the core for 30 of the 40 strongest peaks.
    calls:
      - *a1
      - *a2
      - *a3
      - tool: run_analysis
        args:
          step_id: roi_comparison
          a: rim
          b: core
          params:
            norm: tic
        save_as: cmp
      - tool: run_analysis
        args:
          step_id: discriminating_features
          groups:
            - rim
            - core
          params:
            norm: tic
    expect:
      - { path: saved.cmp.metrics.n_q_pass, equals: 30 }
      - { path: saved.cmp.metrics.n_rows, equals: 40 }
      - { path: saved.cmp.summary, contains: Found 30 features different between rim and core }
      - { path: metrics.n_rows, equals: 30 }
  - id: demo-norm-none
    description: Without normalization 29 features pass. This is the check for the norm decision.
    calls:
      - *a1
      - *a2
      - *a3
      - tool: run_analysis
        args:
          step_id: roi_comparison
          a: rim
          b: core
          params:
            norm: none
    expect:
      - { path: metrics.n_q_pass, equals: 29 }
  - id: demo-make-regions
    description: make_regions builds tissue, rim, core and lesion on the demo slide. The rim differs from the core.
    calls:
      - tool: open_slide
        args:
          ref: demo
      - tool: make_regions
        save_as: made
      - tool: find_peaks
        args:
          max_peaks: 40
      - tool: run_analysis
        args:
          step_id: roi_comparison
          a: rim
          b: core
          params:
            norm: tic
    expect:
      - { path: saved.made.data.lesion_found, equals: true }
      - { path: saved.made.summary, contains: "tissue (1007 px)" }
      - { path: saved.made.data.regions.2.n_pixels, equals: 255 }
      - { path: saved.made.data.regions.3.n_pixels, equals: 41 }
      - { path: metrics.n_q_pass, equals: 31 }
data_rules:
  cloud_visibility: all
  note: The tools return summaries and tables of at most 12 rows. Full tables stay in the work folder.

# Tools that run code: the scientist approves each call.
tools:
  - { name: run_script, description: "Run Python code in the SMILE MSI engine. Read scripting_guide first.", approval: true }
  - { name: create_tool, description: "Save a new user tool in SMILE MSI.", approval: true }
  - { name: edit_tool, description: "Change a user tool in SMILE MSI.", approval: true }
  - { name: delete_tool, description: "Delete a user tool in SMILE MSI.", approval: true }
  - { name: run_user_tool, description: "Run a saved user tool.", approval: true }
