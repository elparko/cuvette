adapter:
  name: smile-msi
  title: SMILE MSI
  version: 0.1.0
  description: MALDI mass spectrometry imaging of lipids. The agent uses the SMILE MSI engine through its MCP server. Each
    step has a route in the SMILE MSI program.
program:
  name: SMILE MSI
  version: 2.0.0
  tested_versions:
    - 2.0.0
connection:
  kind: mcp
  transport: stdio
  command:
    - "{program_path}"
    - "{adapter_dir}/wrapper.py"
  state_tool: state
  history_tool: history
  startup_timeout_s: 120
  call_timeout_s: 1800
locate:
  env: SMILE_MSI_PYTHON
  paths:
    - ~/Code/SMILE-MSI/.venv/bin/python
    - ~/code/SMILE-MSI/.venv/bin/python
    - ~/Code/SMILE-MSI/.venv/Scripts/python.exe
  version_command:
    - "{program_path}"
    - -c
    - import smile_msi; print(smile_msi.__version__)
module: adapter.ts
decisions:
  - key: replicate
    label: Unit of replication
    kind: choice
    default: pixels (exploratory)
    choices: [ pixels (exploratory), regions / sections, animals / patients ]
    owner: human
    group: Study
    essential: true
    stage: setup
    help: One independent observation. If you choose pixels, the p-values describe pixels and not biology. Treat the results
      as exploratory.
  - key: max_q
    label: False-discovery threshold (q)
    kind: float
    default: 0.05
    lo: 0.001
    hi: 0.25
    owner: human
    group: Study
    essential: true
    stage: setup
    links: [ { tool: run_analysis, arg: params.max_q } ]
    help: The Benjamini-Hochberg q that a feature must pass to count as significant.
  - key: min_auc
    label: Minimum effect (AUC)
    kind: float
    default: 0.7
    lo: 0.5
    hi: 1
    owner: human
    group: Study
    essential: true
    stage: setup
    links: [ { tool: run_analysis, arg: params.min_auc } ]
    help: The smallest separation to report. 0.5 means no separation. 1 means perfect separation.
  - key: mode
    label: Polarity
    kind: choice
    default: negative
    choices: [ negative, positive ]
    group: Acquisition
    owner: human
    essential: true
    stage: setup
    links: [ { tool: annotate, arg: mode } ]
    help: The ionization polarity of the instrument. It sets the adduct set for lipid identification.
  - key: ppm
    label: Extraction tolerance (ppm)
    kind: float
    default: 10
    lo: 1
    hi: 200
    group: Acquisition
    owner: human
    essential: true
    stage: setup
    links: [ { tool: run_analysis, arg: params.tol_ppm }, { tool: open_slide, arg: ppm }, { tool: apply_settings, arg: ppm } ]
    help: The m/z window that extracts ion images, the feature matrix and the spatial statistics.
  - key: id_ppm
    label: Identification tolerance (ppm)
    kind: float
    default: 5
    lo: 1
    hi: 30
    group: Acquisition
    owner: human
    essential: true
    stage: setup
    links: [ { tool: annotate, arg: match_ppm } ]
    help: The mass-accuracy window for lipid identification. Use a window that is tighter than the extraction window.
  - key: norm
    label: Normalization
    kind: choice
    default: tic
    choices: [ tic, none, rms ]
    group: Ion image
    owner: human
    essential: true
    stage: setup
    links: [ { tool: run_analysis, arg: params.norm }, { tool: open_slide, arg: norm }, { tool: apply_settings, arg: norm } ]
    help: The per-pixel normalization for ion images and analyses. This choice can create or remove a difference between
      groups.
    sensitivity:
      tool: run_analysis
      args:
        step_id: discriminating_features
      options: [ tic, rms, none ]
      compare: [ n_rows, n_q_pass, n_q_auc_pass ]
      max_runs: 3
  - key: reduce
    label: Reduce (m/z window)
    kind: choice
    default: sum
    choices: [ sum, max, mean ]
    group: Ion image
    owner: agent
    essential: false
    stage: setup
    links: [ { tool: open_slide, arg: reduce }, { tool: apply_settings, arg: reduce } ]
    help: How the intensities inside the m/z window become one value.
  - key: tic_max_amp
    label: TIC amplification cap (×)
    kind: float
    default: 3
    lo: 1
    hi: 50
    group: Ion image
    owner: agent
    essential: false
    stage: setup
    links: [ { tool: open_slide, arg: tic_max_amp }, { tool: apply_settings, arg: tic_max_amp } ]
    help: The limit on the per-pixel TIC amplification. It stops faint pixels from making false hotspots.
  - key: snr
    label: Min S/N
    kind: float
    default: 3
    lo: 1
    hi: 50
    group: Peak picking
    owner: agent
    essential: true
    stage: setup
    links: [ { tool: find_peaks, arg: snr } ]
    help: The signal-to-noise ratio that a peak must reach.
  - key: prominence
    label: Min prominence (S/N)
    kind: float
    default: 1
    lo: 0
    hi: 20
    group: Peak picking
    owner: agent
    essential: false
    stage: setup
    help: The height that a peak must rise above the saddle next to it. 0 keeps every local maximum. The find_peaks tool
      uses 1.0 and does not take this argument.
  - key: max_peaks
    label: Max peaks (0 = no limit)
    kind: int
    default: 0
    lo: 0
    hi: 200000
    group: Peak picking
    owner: agent
    essential: false
    stage: setup
    links: [ { tool: find_peaks, arg: max_peaks } ]
    help: The most peaks to keep, strongest first. 0 keeps all peaks. A cap makes two regions show the same count.
  - key: segment_default_count
    label: Default segment count
    kind: int
    default: 8
    lo: 2
    hi: 64
    group: Segmentation
    owner: agent
    essential: false
    stage: setup
    changes_conclusion: false
    help: The number of segments for the first segmentation of a slide.
  - key: spatial_min_morans
    label: Min Moran's I
    kind: float
    default: 0.05
    lo: -1
    hi: 1
    group: Spatial finder
    owner: agent
    essential: false
    stage: setup
    links: [ { tool: find_peaks, arg: min_morans } ]
    help: The Moran's I floor for the spatial feature finder. It removes spatially random noise.
  - key: spatial_max_candidates
    label: Max candidates (0 = no limit)
    kind: int
    default: 2000
    lo: 0
    hi: 200000
    group: Spatial finder
    owner: agent
    essential: false
    stage: setup
    changes_conclusion: false
    links: [ { tool: find_peaks, arg: max_candidates } ]
    help: The number of peaks that enter the spatial gates, strongest first. Each peak costs one Moran's I run.
map:
  - tool: list_slides
    route: File > Open analysis... shows the saved slides.
    fidelity: code_only
    difference: The tool only reads information. No result to repeat.
    evidence:
      source: program_definitions
      test: ""
      note: Read-only tool.
    summary: Listed {n_rows} slides.
  - tool: history
    route: File > Analyses... > History lists the runs on a slide. Data > Acquisition & matching... shows the extraction settings.
    fidelity: code_only
    difference: The tool only reads information. No result to repeat.
    evidence:
      source: program_definitions
      test: ""
      note: Read-only tool. It reads the saved session and the run store of the slide.
    summary: "Read {data.n_runs} runs from the saved session."
  - tool: slide_state
    route: No step. The Analyses... tab (File menu) shows the runs on a slide.
    fidelity: code_only
    difference: The tool only reads information. No result to repeat.
    evidence:
      source: program_definitions
      test: ""
      note: Read-only tool.
  - tool: analysis_catalog
    route: No step. The Analyze tab shows the same list of analyses.
    fidelity: code_only
    difference: The tool only reads information. No result to repeat.
    evidence:
      source: program_definitions
      test: ""
      note: Read-only tool.
  - tool: scripting_guide
    route: No step. Data > Analysis script... shows the same reference.
    fidelity: code_only
    difference: The tool only reads information. No result to repeat.
    evidence:
      source: program_definitions
      test: ""
      note: Read-only tool.
  - tool: run_result
    route: File > Analyses... > History > open the run.
    fidelity: code_only
    difference: The tool only reads information. No result to repeat.
    evidence:
      source: program_definitions
      test: ""
      note: Read-only tool.
  - tool: state
    route: Read the right panel (Display, Regions, Features) and Data > Acquisition & matching...
    fidelity: close
    difference: The tool returns one summary. The program shows the same values in several places.
    evidence:
      source: program_definitions
      test: ""
      note: Reads the same slide object that the program uses.
    summary: Read the state of the open slide.
  - tool: open_slide
    match: { ref: demo }
    route: File > Load demo dataset
    steps:
      - Open the File menu.
      - Click Load demo dataset.
    fidelity: exact
    difference: The program also finds peaks at once after it loads the demo. The tool does not.
    evidence:
      source: program_definitions
      test: demo-opens
      note: headless.open_demo and the demo loader use demo.make_synthetic.
    summary: "Opened the demo slide: {metrics.n_pixels} pixels."
    params:
      - {
          arg: ppm,
          label: Extraction tolerance (ppm),
          ui_default: 10,
          note: The demo session sets 20. Data > Acquisition & matching...
        }
      - { arg: norm, label: Normalization, ui_default: tic, note: Display panel. }
      - { arg: reduce, label: Reduce (m/z window), ui_default: sum }
  - tool: open_slide
    route: File > Open imzML... and choose the file
    steps:
      - Open the File menu.
      - Click Open imzML... and choose the file.
      - Or click Open analysis... and choose a session file.
    fidelity: close
    difference: The tool restores the saved preprocessing and regions from the session, like the program does.
    evidence:
      source: program_definitions
      test: ""
      note: Not tested with real data.
    summary: "Opened {ref}: {metrics.n_pixels} pixels."
    params:
      - { arg: stride, label: Subsample, ui_default: 1 }
  - tool: apply_settings
    route: Data > Acquisition & matching... and the Display panel
    steps:
      - Open Data > Acquisition & matching... and set Extraction tolerance (ppm) and Reduce (m/z window).
      - In the Display panel, set Normalization.
      - "For the TIC amplification cap: Data > Analysis profiles..., edit TIC amplification cap (x), then press Apply to
        current sample."
    fidelity: exact
    difference: ""
    evidence:
      source: program_definitions
      test: settings-apply
      note: Ports setup.apply_to_slide. The program sets the same slide fields.
    summary: "Changed settings: {data.changed}."
    params:
      - { arg: ppm, label: Extraction tolerance (ppm), ui_default: 10 }
      - { arg: norm, label: Normalization, ui_default: tic }
      - { arg: reduce, label: Reduce (m/z window), ui_default: sum }
      - { arg: tic_max_amp, label: TIC amplification cap (x), ui_default: 3 }
  - tool: find_peaks
    match: { spatial: true }
    route: Analyze > This slide > Peaks > Find spatial features
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Peaks, click Find spatial features.
      - Open Settings and set the fields.
      - Press Run.
    fidelity: exact
    difference: The tool sets Min rel. intensity and Min pixel frequency to 0. The dialog defaults are 0.002 and 0.01. Set
      both fields to 0 to get the same peaks.
    evidence:
      source: program_definitions
      test: ""
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
    summary: Found {metrics.n_features} spatial features.
    params:
      - { arg: snr, label: Signal-to-noise, ui_default: 3 }
      - { arg: min_rel_intensity, label: Min rel. intensity, ui_default: 0.002, note: Not a tool argument. The tool uses 0. }
      - { arg: min_frequency, label: Min pixel frequency, ui_default: 0.01, note: Not a tool argument. The tool uses 0. }
      - { arg: min_morans, label: Min Moran's I, ui_default: 0.05 }
      - { arg: max_candidates, label: Max candidates (0 = no limit), ui_default: 2000 }
  - tool: find_peaks
    route: Analyze > This slide > Peaks > Find peaks
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Peaks, click Find peaks.
      - Open Settings and set the fields.
      - Press Run.
    fidelity: exact
    difference: The tool sets Min rel. intensity to 0. The dialog default is 0.002. Set the field to 0 to get the same peaks.
    evidence:
      source: program_definitions
      test: demo-planted-lipids
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
    summary: Found {metrics.n_features} peaks.
    params:
      - { arg: snr, label: Signal-to-noise, ui_default: 3 }
      - { arg: min_rel_intensity, label: Min rel. intensity, ui_default: 0.002, note: Not a tool argument. The tool uses 0. }
      - { arg: prominence, label: Prominence, ui_default: 1, note: Not a tool argument. The tool uses 1.0. }
      - { arg: max_peaks, label: Max peaks (0 = no limit), ui_default: 0 }
  - tool: annotate
    route: Analyze > This slide > Annotation > Annotate lipids
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Annotation, click Annotate lipids.
      - Open Settings and set Adduct mode and Match tol (ppm).
      - Press Run.
    fidelity: exact
    difference: The tool default for Match tol (ppm) is 5. The dialog default is 10.
    evidence:
      source: program_definitions
      test: demo-planted-lipids
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
    summary: Matched {metrics.n_matched} of {metrics.n_rows} features to a lipid.
    params:
      - { arg: mode, label: Adduct mode, ui_default: negative }
      - { arg: match_ppm, label: Match tol (ppm), ui_default: 10, note: The tool default is 5.0. }
  - tool: run_script
    route: Data > Analysis script...
    steps:
      - Open Data > Analysis script...
      - Paste the code.
      - Press Run.
    fidelity: exact
    difference: ""
    evidence:
      source: program_definitions
      test: ""
      note: The tool and the console both call scripting.run_script.
    summary: Ran a script.
    params:
      - { arg: code, label: Script editor }
  - tool: make_regions
    route: Regions panel. Draw the tissue outline, the rim band, the core and the lesion. Set a name for each.
    fidelity: close
    difference: The tool finds the regions by rule. The tissue is the pixels above the midpoint between background and
      tissue signal. The rim is the outer 30 percent of the tissue depth. The core is the tissue deeper than 50 percent. The
      lesion is the smallest compact k-means cluster. In the program you draw the shapes by hand.
    evidence:
      source: program_definitions
      test: demo-make-regions
      note: Uses the same slide masks and segmentation as the program. The wrapper adds the rule.
    summary: "Made regions from the tissue signal."
  - tool: send_regions
    route: Draw each region in the Regions panel and set its group
    fidelity: close
    difference: The tool puts the regions in an inbox. The program adds them within a few seconds.
    evidence:
      source: program_definitions
      test: ""
      note: regioninbox.post_regions.
  - tool: ion_image
    route: "Ion image tab: click the m/z in the peak table"
    steps:
      - Open the Ion image tab.
      - Click the m/z in the peak table, or enter it.
      - Set the colormap on the toolbar and Normalization in the Display panel.
    fidelity: close
    difference: The tool also saves a PNG and reports the statistics over all pixels, including the background.
    evidence:
      source: program_definitions
      test: ""
      note: ""
    summary: Made the ion image of m/z {mz}.
  - tool: mean_spectrum
    route: "Ion image tab: the spectrum plot"
    fidelity: close
    difference: The tool lists the strongest local maxima. The plot shows the whole spectrum.
    evidence:
      source: program_definitions
      test: ""
      note: ""
  - tool: export_feature_table
    route: File > Export... (Export hub) > feature table
    fidelity: close
    difference: The tool joins the saved runs to the feature list by m/z.
    evidence:
      source: program_definitions
      test: ""
      note: ""
  - tool: close_slide
    route: Open another slide
    fidelity: code_only
    difference: No result to repeat.
    evidence:
      source: program_definitions
      test: ""
      note: Read-only tool.
  - tool: list_user_tools
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: run_user_tool
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: get_tool_code
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: save_flow
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: list_flows
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: run_flow
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: create_tool
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: edit_tool
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: delete_tool
    route: No manual route. User tools and flows exist only in the agent and the MCP interface.
    fidelity: code_only
    difference: The code of a user tool runs in Data > Analysis script... if you paste it.
    evidence:
      source: code
      test: ""
      note: ""
  - tool: run_analysis
    match: { step_id: find_peaks }
    route: Analyze > This slide > Peaks > Find peaks
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Peaks, click Find peaks.
      - Open Settings and set the fields.
      - Press Run.
    params:
      - { arg: mask, label: Run on ROIs..., note: Empty means the whole slide. }
      - { arg: params.snr, label: Signal-to-noise, ui_default: 3 }
      - { arg: params.min_rel_intensity, label: Min rel. intensity, ui_default: 0.002 }
      - { arg: params.prominence, label: Prominence, ui_default: 1 }
      - { arg: params.max_peaks, label: Max peaks (0 = no limit), ui_default: 0 }
    fidelity: exact
    difference: ""
    evidence:
      source: program_definitions
      test: ""
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
  - tool: run_analysis
    match: { step_id: find_spatial_features }
    route: Analyze > This slide > Peaks > Find spatial features
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Peaks, click Find spatial features.
      - Open Settings and set the fields.
      - Press Run.
    params:
      - { arg: mask, label: Run on ROIs..., note: Empty means the whole slide. }
      - { arg: params.snr, label: Signal-to-noise, ui_default: 3 }
      - { arg: params.min_rel_intensity, label: Min rel. intensity, ui_default: 0.002 }
      - { arg: params.min_frequency, label: Min pixel frequency, ui_default: 0.01 }
      - { arg: params.min_morans, label: Min Moran's I, ui_default: 0.05 }
      - { arg: params.max_candidates, label: Max candidates (0 = no limit), ui_default: 2000 }
      - {
          arg: params.tol_ppm,
          label: Extraction tol (ppm),
          ui_default: 10,
          note: The tool uses the ppm setting of the slide. The dialog starts at this value.
        }
      - {
          arg: params.norm,
          label: Normalization,
          ui_default: tic,
          note: The tool uses the normalization setting of the slide. The dialog starts at this value.
        }
    fidelity: exact
    difference: ""
    evidence:
      source: program_definitions
      test: ""
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
  - tool: run_analysis
    match: { step_id: roi_comparison }
    route: Analyze > This slide > Statistics > Region comparison (A vs B)
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Statistics, click Region comparison (A vs B).
      - Set Compare A and vs B.
      - Open Settings and set the fields.
      - Press Run.
    params:
      - { arg: a, label: Compare A, note: The default is the first group. }
      - { arg: b, label: vs B, note: The default is the second group. }
      - { arg: params.method, label: Statistical test, ui_default: mwu }
      - { arg: params.save_lists, label: Save distinguishing ions as ★ lists, ui_default: true }
      - { arg: params.max_q, label: Max q-value (for saved lists), ui_default: 0.05 }
      - {
          arg: params.tol_ppm,
          label: Extraction tol (ppm),
          ui_default: 10,
          note: The tool uses the ppm setting of the slide. The dialog starts at this value.
        }
      - {
          arg: params.norm,
          label: Normalization,
          ui_default: tic,
          note: The tool uses the normalization setting of the slide. The dialog starts at this value.
        }
    fidelity: exact
    difference: ""
    evidence:
      source: program_definitions
      test: demo-rim-vs-core
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
    summary: Found {metrics.n_q_pass} features different between {a} and {b}.
  - tool: run_analysis
    match: { step_id: region_comparison }
    route: Analyze > This slide > Statistics > Region spectra (A vs B overlay)
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Statistics, click Region spectra (A vs B overlay).
      - Set Compare A and vs B.
      - Open Settings and set the fields.
      - Press Run.
    params:
      - { arg: a, label: Compare A, note: The default is the first group. }
      - { arg: b, label: vs B, note: The default is the second group. }
      - {
          arg: params.norm,
          label: Normalization,
          ui_default: tic,
          note: The tool uses the normalization setting of the slide. The dialog starts at this value.
        }
    fidelity: exact
    difference: ""
    evidence:
      source: program_definitions
      test: ""
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
  - tool: run_analysis
    match: { step_id: discriminating_features }
    route: Analyze > This slide > Statistics > Discriminating features (per group)
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Statistics, click Discriminating features (per group).
      - Open Settings and set the fields.
      - Press Run.
    params:
      - { arg: groups, label: Choose groups..., note: The default is every group. }
      - { arg: params.enriched_only, label: Enriched markers only, ui_default: true }
      - { arg: params.min_auc, label: Min AUC, ui_default: 0.5 }
      - { arg: params.max_q, label: Max q-value, ui_default: 0.05 }
      - { arg: params.top_n, label: Candidates / group, ui_default: 50 }
      - { arg: params.save_lists, label: Save per-group ★ marker lists, ui_default: false }
      - {
          arg: params.tol_ppm,
          label: Extraction tol (ppm),
          ui_default: 50,
          note: The tool uses the ppm setting of the slide. The dialog starts at this value.
        }
      - {
          arg: params.norm,
          label: Normalization,
          ui_default: tic,
          note: The tool uses the normalization setting of the slide. The dialog starts at this value.
        }
    fidelity: exact
    difference: ""
    evidence:
      source: program_definitions
      test: demo-rim-vs-core
      note: The dialog and the tool both call StepDef.run. Not yet compared by running the dialog.
    summary: Kept {metrics.n_rows} marker features.
  - tool: run_analysis
    match: { step_id: multigroup_features }
    route: Analyze > This slide > Statistics > Multi-group features
    steps:
      - Open the Analyze tab and choose This slide.
      - Under Statistics, click Multi-group features.
      - Open Settings and set the fields.
      - Press Run.
    params:
      - { arg: groups, label: Choose groups..., note: The default is every group. }
      - { arg: params.method, label: Statistical test, ui_default: kruskal }
      - {
