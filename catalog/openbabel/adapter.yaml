adapter:
  name: openbabel
  field: chemistry
  file_types: [".smi", ".sdf", ".mol", ".mol2"]
  title: Open Babel format conversion and descriptors
  version: 0.1.1
  description: Converts molecule files between formats and writes descriptor values with Open Babel.
  authors: [onboarding agent]
  status: draft
program:
  name: Open Babel
  version: "3.2.1"
  homepage: https://openbabel.org
  docs:
    - https://open-babel.readthedocs.io/en/latest/Command-line_tools/babel.html
    - https://open-babel.readthedocs.io/en/latest/Descriptors/descriptors.html
  install: >
    Install Open Babel with Homebrew. The adapter reads the CUVETTE_OBABEL variable, then obabel on the PATH,
    /opt/homebrew/bin, /usr/local/bin and /usr/bin.
    brew install open-babel
  citation:
    - text: "O'Boyle, N. M., Banck, M., James, C. A., Morley, C., Vandermeersch, T., & Hutchison, G. R. (2011). Open Babel: An open chemical toolbox. Journal of Cheminformatics, 3, 33. https://doi.org/10.1186/1758-2946-3-33"
      doi: 10.1186/1758-2946-3-33
      bibtex: |
        @article{oboyle2011open,
          author  = {O'Boyle, Noel M. and Banck, Michael and James, Craig A. and Morley, Chris and Vandermeersch, Tim and Hutchison, Geoffrey R.},
          title   = {Open {Babel}: An open chemical toolbox},
          journal = {Journal of Cheminformatics},
          year    = {2011},
          volume  = {3},
          pages   = {33},
          doi     = {10.1186/1758-2946-3-33}
        }
connection:
  kind: cli
locate:
  env: CUVETTE_OBABEL
  which: [obabel]
  paths: ["/opt/homebrew/bin/obabel", "/usr/local/bin/obabel", "/usr/bin/obabel"]
  version_command: ["{program_path}", "-V"]
  version_pattern: "Open Babel (\\S+)"
  identity: 'Open Babel \d'
decisions:
  - key: descriptor_set
    label: Descriptors to append
    kind: text
    default: "MW logP TPSA HBD HBA1 rotors"
    owner: human
    group: Descriptors
    help: Names from obabel -L descriptors, separated by spaces. MW is molecular weight, logP is octanol and water, TPSA is polar surface area, HBD and HBA1 count hydrogen bond donors and acceptors, rotors counts rotatable bonds.
    essential: true
    links:
      - { tool: append_descriptors, arg: descriptors }
  - key: salt_handling
    label: Salts and multi-fragment molecules
    kind: choice
    choices: [keep, largest_fragment]
    default: keep
    owner: human
    group: Molecules
    help: keep leaves each molecule as given. largest_fragment removes all but the largest piece. Use the tool convert_largest_fragment for largest_fragment.
    essential: true
tools:
  - name: convert_molecules
    title: Convert molecules to another format
    description: "Convert a molecule file to another format, for example smi, can (canonical SMILES), inchi, inchikey, sdf or mol2. Keeps every fragment. Writes one output text. Open Babel with -e continues after an invalid molecule and drops it."
    read_only: true
    params:
      path: { type: string, minLength: 1, description: Absolute path of the input file. The extension gives the input format. }
      to: { type: string, enum: [smi, can, inchi, inchikey, sdf, mol2], default: can }
    required: [path]
    outputs:
      result: { kind: text, ext: .txt, description: The converted molecules. }
    command: ["/bin/sh", "{adapter_dir}/scripts/obabel.sh", "{program_path}", "{path}", "-o{to}", "-e", "-O{output.result}"]
    returns: text
  - name: convert_largest_fragment
    title: Convert and keep the largest fragment
    description: Convert a molecule file to another format and remove all but the largest fragment of each molecule. This removes salt counter-ions.
    read_only: true
    params:
      path: { type: string, minLength: 1, description: Absolute path of the input file. }
      to: { type: string, enum: [smi, can, inchi, inchikey, sdf, mol2], default: can }
    required: [path]
    outputs:
      result: { kind: text, ext: .txt, description: The converted molecules. }
    command: ["/bin/sh", "{adapter_dir}/scripts/obabel.sh", "{program_path}", "{path}", "-o{to}", "-e", "-r", "-O{output.result}"]
    returns: text
  - name: append_descriptors
    title: Append descriptors to SMILES
    description: "Write each molecule as SMILES and name, followed by the values of the descriptors in the order of the list. The output has one line for each molecule."
    read_only: true
    params:
      path: { type: string, minLength: 1, description: Absolute path of the input file. }
      descriptors: { type: string, description: "Descriptor names separated by spaces, such as MW logP TPSA." }
    required: [path, descriptors]
    outputs:
      result: { kind: text, ext: .smi, description: "Lines of SMILES, name and descriptor values." }
    command: ["/bin/sh", "{adapter_dir}/scripts/obabel.sh", "{program_path}", "{path}", "-osmi", "-e", "-O{output.result}", "--append", "{descriptors}"]
    returns: text
map:
  - tool: convert_molecules
    route: "Run: obabel <file> -o<format> -e -O<output file>"
    params:
      - { arg: path, label: input file, ui_default: "" }
      - { arg: to, label: output format, ui_default: can }
    fidelity: exact
    evidence: { source: docs, test: mini-convert, note: "The route is the command line. A person has not run it by hand." }
    summary: "Converted {path} to {to}."
  - tool: convert_largest_fragment
    route: "Run: obabel <file> -o<format> -e -r -O<output file>"
    params:
      - { arg: path, label: input file, ui_default: "" }
      - { arg: to, label: output format, ui_default: can }
    fidelity: exact
    evidence: { source: docs, test: mini-largest-fragment }
    summary: "Converted {path} to {to} with the largest fragment only."
  - tool: append_descriptors
    route: "Run: obabel <file> -osmi -e -O<output file> --append \"<descriptor names>\""
    params:
      - { arg: path, label: input file, ui_default: "" }
      - { arg: descriptors, label: --append names, ui_default: "" }
    fidelity: exact
    evidence: { source: docs, test: mini-descriptors }
    summary: "Descriptors {descriptors} written for {path}."
checks:
  - id: molecules_lost_silently
    description: Open Babel dropped molecules and the answer does not give the counts.
    severity: error
    text: "Open Babel prints an error on the error stream for an invalid molecule and still exits with success. Without -e it also drops every molecule after the first invalid one. The answer must compare the number of input molecules with the number of output lines and report each difference."
  - id: logp_not_comparable
    description: Open Babel logP is compared with another program logP with no note.
    severity: warning
    text: "The answer must say which program computed logP. Values from Open Babel and from RDKit can differ in the last digits."
  - id: salts_not_reported
    description: Molecules with more than one fragment were kept and the answer does not say so.
    severity: info
    text: "If the output has SMILES with a dot, the answer must say how salts were handled."
tests:
  - id: mini-convert
    self_test: true
    source: "PubChem and IUPAC: the InChIKey of aspirin is BSYNRYMUTXBXSQ-UHFFFAOYSA-N."
    description: "Four lines. One SMILES is invalid. With -e the three valid molecules stay. Aspirin InChIKey BSYNRYMUTXBXSQ-UHFFFAOYSA-N is the published key."
    data: [data/mini.smi]
    calls:
      - tool: convert_molecules
        args: { path: "{adapter_dir}/data/mini.smi", to: inchikey }
    expect:
      - { path: text, contains: "BSYNRYMUTXBXSQ-UHFFFAOYSA-N" }
  - id: mini-largest-fragment
    description: Sodium acetate becomes the acetate ion [O-]C(=O)C when the largest fragment is kept. RDKit gives the same ion (checks/aspirin_descriptors.txt).
    data: [data/mini.smi]
    calls:
      - tool: convert_molecules
        args: { path: "{adapter_dir}/data/mini.smi", to: can }
        save_as: kept
      - tool: convert_largest_fragment
        args: { path: "{adapter_dir}/data/mini.smi", to: can }
    expect:
      - { path: saved.kept.text, contains: "[Na+]" }
      - { path: text, contains: "[O-]C(=O)C" }
  - id: mini-descriptors
    description: "Aspirin C9H8O4. The molecular weight 180.157 is a hand sum with the IUPAC 2005 atomic weights. logP 1.3101 (Crippen), TPSA 63.6 and 1 donor come from RDKit 2026.03.6, an independent program. The script and its output are in checks/aspirin_descriptors.*."
    data: [data/mini.smi]
    calls:
      - tool: append_descriptors
        args: { path: "{adapter_dir}/data/mini.smi", descriptors: "MW logP TPSA HBD" }
    expect:
      - { path: text, contains: "aspirin 180.157 1.3101 63.6 1" }
  - id: missing-file
    description: An input file that does not exist fails, and the error names the file. obabel exits with 0 here, so scripts/obabel.sh reads its message.
    calls:
      - { tool: convert_molecules, args: { path: "{adapter_dir}/data/no_such_file.smi" } }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "Cannot open" }
      - { path: error, contains: "no_such_file.smi" }
