adapter:
  name: astropy
  field: astronomy
  file_types: [".fits", ".fit", ".fts"]
  file_magic: ["53494d504c45"]
  file_label: astronomy files
  title: Astropy and photutils
  version: 0.1.2
  spec: "1"
  description: >
    Reads a FITS image, measures the background, finds sources and measures aperture fluxes with
    astropy and photutils. Each tool does one step on a FITS file. The scientist can repeat each
    step with the code line in the map.
  authors: [Parker Smith]
  status: draft

program:
  name: astropy and photutils
  version: "astropy 8.0.1, photutils 3.0.0, numpy 2.5.3, scipy 1.18.1"
  tested_versions: ["8.0.1"]
  homepage: https://www.astropy.org
  docs:
    - https://photutils.readthedocs.io/en/stable/user_guide/background.html
    - https://photutils.readthedocs.io/en/stable/user_guide/segmentation.html
    - https://photutils.readthedocs.io/en/stable/user_guide/aperture.html
    - https://docs.astropy.org/en/stable/stats/robust.html
    - https://docs.astropy.org/en/stable/wcs/index.html
  install: >
    The adapter uses its own Python environment at ~/.cuvette/envs/astropy, or the Python in CUVETTE_ASTROPY_PYTHON.
    Make the environment and install astropy, photutils and the libraries that the adapter imports:
    uv venv ~/.cuvette/envs/astropy && uv pip install --python ~/.cuvette/envs/astropy/bin/python astropy photutils scipy pandas matplotlib
  citation:
    - text: "Astropy Collaboration, Price-Whelan, A. M., Lim, P. L., Earl, N., Starkman, N., Bradley, L., Shupe, D. L., Patil, A. A., et al. (2022). The Astropy Project: Sustaining and Growing a Community-oriented Open-source Project and the Latest Major Release (v5.0) of the Core Package. The Astrophysical Journal, 935(2), 167. https://doi.org/10.3847/1538-4357/ac7c74"
      doi: 10.3847/1538-4357/ac7c74
      bibtex: |
        @article{astropy2022astropy,
          author  = {{Astropy Collaboration} and Price-Whelan, Adrian M. and Lim, Pey Lian and Earl, Nicholas and Starkman, Nathaniel and Bradley, Larry and Shupe, David L. and Patil, Aarya A. and others},
          title   = {The {Astropy} Project: Sustaining and Growing a Community-oriented Open-source Project and the Latest Major Release (v5.0) of the Core Package},
          journal = {The Astrophysical Journal},
          year    = {2022},
          volume  = {935},
          number  = {2},
          pages   = {167},
          doi     = {10.3847/1538-4357/ac7c74}
        }
    - text: "Astropy Collaboration, Price-Whelan, A. M., Sipőcz, B. M., Günther, H. M., Lim, P. L., Crawford, S. M., Conseil, S., Shupe, D. L., et al. (2018). The Astropy Project: Building an Open-science Project and Status of the v2.0 Core Package. The Astronomical Journal, 156(3), 123. https://doi.org/10.3847/1538-3881/aabc4f"
      doi: 10.3847/1538-3881/aabc4f
      bibtex: |
        @article{astropy2018astropy,
          author  = {{Astropy Collaboration} and Price-Whelan, Adrian M. and Sip{\H{o}}cz, Brigitta M. and G{\"u}nther, Hans M. and Lim, P. L. and Crawford, Steven M. and Conseil, Simon and Shupe, David L. and others},
          title   = {The {Astropy} Project: Building an Open-science Project and Status of the v2.0 Core Package},
          journal = {The Astronomical Journal},
          year    = {2018},
          volume  = {156},
          number  = {3},
          pages   = {123},
          doi     = {10.3847/1538-3881/aabc4f}
        }
    - text: "Astropy Collaboration, Robitaille, T. P., Tollerud, E. J., Greenfield, P., Droettboom, M., Bray, E., Aldcroft, T., Davis, M., et al. (2013). Astropy: A community Python package for astronomy. Astronomy & Astrophysics, 558, A33. https://doi.org/10.1051/0004-6361/201322068"
