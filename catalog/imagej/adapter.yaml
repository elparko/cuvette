  - name: watershed
    title: Split touching objects
    description: Split objects that touch in a binary mask. Use it when open_image or the preview shows merged objects.
    params:
      mask: { type: string, description: Path of the binary mask from threshold. }
    required: [mask]
    outputs:
      mask: { kind: file, ext: .tif, description: Binary mask with split objects. }
      preview: { kind: image, ext: .png, description: PNG preview of the mask. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{mask}");
      needMask();
      setOption("BlackBackground", false);
      run("Watershed");
      savePair("{output.mask}", "{output.preview}");

  - name: analyze_particles
    title: Count and measure particles
    description: >
      Count the objects in a binary mask and measure each one. Sizes use the image scale. Gives
      count, mean area, median area, total area and area fraction. Saves a table with one row for
      each object and a PNG with the outlines.
    params:
      mask: { type: string, description: Path of the binary mask from threshold or watershed. }
      min_size: { type: number, minimum: 0, default: 0, description: "Smallest area to count, in calibrated units." }
      max_size: { type: number, minimum: 0, default: 0, description: Largest area to count. 0 means no limit. }
      min_circularity: { type: number, minimum: 0, maximum: 1, default: 0, description: Smallest circularity to count. }
      exclude_edges: { type: boolean, default: false, description: True to leave out objects that touch the image edge. }
      measure_image: { type: string, default: "", description: "Optional path of a gray image. Mean, minimum and maximum then come from this image." }
    required: [mask]
    outputs:
      particles: { kind: table, ext: .csv, description: One row for each object. }
      outlines: { kind: image, ext: .png, description: PNG with the outline of each object. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      redirect = "None";
      if ("{measure_image}" != "") {
        openImage("{measure_image}");
        redirect = "[" + getTitle() + "]";
      }
      openImage("{mask}");
      needMask();
      analyze({min_size}, {max_size}, {min_circularity}, {exclude_edges}, redirect, "{output.outlines}", "{output.particles}");
      printCounts();

  - name: measure
    title: Measure the intensity
    description: >
      Measure the area, mean, standard deviation, minimum, maximum and integrated density of the
      whole image or of one rectangle.
    params:
      input: { type: string, description: Path of the input image. }
      roi:
        type: string
        default: ""
        pattern: '^(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*\d+\s*)?$'
        description: "Optional rectangle as x,y,width,height in pixels. Empty means the whole image."
    required: [input]
    outputs:
      measurements: { kind: table, ext: .csv, description: The measurement row. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{input}");
      roi = "{roi}";
      if (roi != "") {
        p = split(roi, ",");
        makeRectangle(parseInt(p[0]), parseInt(p[1]), parseInt(p[2]), parseInt(p[3]));
      }
      run("Set Measurements...", "area mean standard min integrated redirect=None decimal=3");
      run("Measure");
      print("area=" + getResult("Area", 0));
      print("mean=" + getResult("Mean", 0));
      print("std=" + getResult("StdDev", 0));
      print("min=" + getResult("Min", 0));
      print("max=" + getResult("Max", 0));
      print("integrated_density=" + getResult("IntDen", 0));
      saveAs("Results", "{output.measurements}");

  - name: threshold_and_count
    title: Threshold and count in one step
    description: >
      Run the whole count on one image: optional background subtraction, optional blur, threshold,
      optional watershed, then count. Use it to compare settings. Saves the mask, a table and an
      outline PNG.
    params:
      input: { type: string, description: Path of the input image. }
      method:
        type: string
        enum: [Default, Otsu, Triangle, Huang, Li, IsoData, Mean, MaxEntropy]
        default: Default
        description: Automatic threshold method.
      dark_background: { type: boolean, default: false, description: True if the objects are bright on a dark background. }
      rolling_radius: { type: number, minimum: 0, default: 0, description: Rolling ball radius in pixels. 0 means no background subtraction. }
      light_background: { type: boolean, default: false, description: True for the rolling ball if the background is light. }
      sigma: { type: number, minimum: 0, default: 0, description: Gaussian blur sigma in pixels. 0 means no blur. }
      watershed: { type: boolean, default: false, description: True to split touching objects. }
      min_size: { type: number, minimum: 0, default: 0, description: "Smallest area to count, in calibrated units." }
      max_size: { type: number, minimum: 0, default: 0, description: Largest area to count. 0 means no limit. }
      min_circularity: { type: number, minimum: 0, maximum: 1, default: 0, description: Smallest circularity to count. }
      exclude_edges: { type: boolean, default: false, description: True to leave out objects that touch the image edge. }
    required: [input]
    outputs:
      mask: { kind: file, ext: .tif, description: Binary mask. }
      particles: { kind: table, ext: .csv, description: One row for each object. }
      outlines: { kind: image, ext: .png, description: PNG with the outline of each object. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{input}");
      pipeline({rolling_radius}, {light_background}, {sigma}, "{method}", {dark_background}, {watershed});
      saveAs("Tiff", "{output.mask}");
      analyze({min_size}, {max_size}, {min_circularity}, {exclude_edges}, "None", "{output.outlines}", "{output.particles}");
      printCounts();
