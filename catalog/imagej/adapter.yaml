  - name: count_folder
    title: Count in all images of a folder
    description: >
      Repeat the same count for each image in a folder. Gives a table with one row for each image.
      Use the same settings for all images. Compare images or animals, not single cells.
    params:
      folder: { type: string, description: Full path of the folder. }
      pattern: { type: string, default: "*.tif", description: "File name pattern with * and ? wildcards, such as *.tif." }
      method:
        type: string
        enum: [Default, Otsu, Triangle, Huang, Li, IsoData, Mean, MaxEntropy]
        default: Default
        description: Automatic threshold method.
      dark_background: { type: boolean, default: false, description: True if the objects are bright on a dark background. }
      rolling_radius: { type: number, minimum: 0, default: 0, description: Rolling ball radius in pixels. 0 means no background subtraction. }
      light_background: { type: boolean, default: false, description: True for the rolling ball if the background is light. }
      sigma: { type: number, minimum: 0, default: 0, description: Gaussian blur sigma in pixels. 0 means no blur. }
      watershed: { type: boolean, default: false, description: True to split touching objects. }
      min_size: { type: number, minimum: 0, default: 0, description: "Smallest area to count, in calibrated units." }
      max_size: { type: number, minimum: 0, default: 0, description: Largest area to count. 0 means no limit. }
      min_circularity: { type: number, minimum: 0, maximum: 1, default: 0, description: Smallest circularity to count. }
      exclude_edges: { type: boolean, default: false, description: True to leave out objects that touch the image edge. }
    required: [folder]
    batch: true
    outputs:
      per_image: { kind: table, ext: .csv, description: One row for each image. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      quiet = true;
      folder = "{folder}";
      if (!File.isDirectory(folder)) fail("Folder not found: " + folder);
      if (!endsWith(folder, File.separator)) folder = folder + File.separator;
      rx = globToRegex(toLowerCase("{pattern}"));
      list = getFileList(folder);
      callDir = "{call_dir}" + File.separator;
      File.makeDirectory(callDir + "outlines");
      File.makeDirectory(callDir + "particles");
      csv = "file,count,mean_area,median_area,total_area,area_fraction,raw_mean_intensity,saturated_fraction\n";
      counts = newArray(list.length);
      n = 0;
      nSat = 0;
      satNames = "";
      for (i = 0; i < list.length; i++) {
        name = list[i];
        if (endsWith(name, "/") || endsWith(name, "\\")) continue;
        if (!matches(toLowerCase(name), rx)) continue;
        open(folder + name);
        if (nImages == 0) {
          print("warning=Skipped " + name);
          continue;
        }
        getStatistics(rawArea, rawMean);
        rawSat = saturatedFraction();
        if (rawSat > 0.01) { nSat++; satNames = satNames + " " + name; }
        pipeline({rolling_radius}, {light_background}, {sigma}, "{method}", {dark_background}, {watershed});
        analyze({min_size}, {max_size}, {min_circularity}, {exclude_edges}, "None", callDir + "outlines" + File.separator + name + ".png", callDir + "particles" + File.separator + name + ".csv");
        csv = csv + "\"" + name + "\"," + cCount + "," + d2s(cMean, 4) + "," + d2s(cMedian, 4) + "," + d2s(cTotal, 4) + "," + d2s(cFraction, 5) + "," + d2s(rawMean, 4) + "," + d2s(rawSat, 5) + "\n";
        counts[n] = cCount;
        n++;
        close("*");
      }
      if (n == 0) fail("No image in the folder matches the pattern: {pattern}");
      File.saveString(csv, "{output.per_image}");
      used = Array.trim(counts, n);
      Array.getStatistics(used, cmin, cmax, cmean, csd);
      print("n_images=" + n);
      print("total_count=" + (cmean * n));
      print("mean_count=" + d2s(cmean, 3));
      print("sd_count=" + d2s(csd, 3));
      print("min_count=" + cmin);
      print("max_count=" + cmax);
      print("area_unit=" + cUnit);
      print("n_saturated_images=" + nSat);
      if (nSat > 0) print("warning=" + nSat + " image(s) have more than 1 percent of pixels at the maximum value:" + satNames + ". Intensity values from these images are not reliable.");
    citations:
      - text: Ridler, T. W., & Calvard, S. (1978). Picture Thresholding Using an Iterative Selection Method. IEEE Transactions on Systems, Man, and Cybernetics, 8(8), 630–632. https://doi.org/10.1109/TSMC.1978.4310039
        doi: 10.1109/TSMC.1978.4310039
        when:
          method:
            - Default
            - IsoData
        bibtex: |
          @article{ridler1978picture,
            author  = {Ridler, T. W. and Calvard, S.},
            title   = {Picture Thresholding Using an Iterative Selection Method},
            journal = {IEEE Transactions on Systems, Man, and Cybernetics},
            year    = {1978},
            volume  = {8},
            number  = {8},
            pages   = {630--632},
            doi     = {10.1109/TSMC.1978.4310039}
          }
      - text: Otsu, N. (1979). A Threshold Selection Method from Gray-Level Histograms. IEEE Transactions on Systems, Man, and Cybernetics, 9(1), 62–66. https://doi.org/10.1109/TSMC.1979.4310076
        doi: 10.1109/TSMC.1979.4310076
        when:
          method: Otsu
        bibtex: |
          @article{otsu1979threshold,
            author  = {Otsu, Nobuyuki},
            title   = {A Threshold Selection Method from Gray-Level Histograms},
            journal = {IEEE Transactions on Systems, Man, and Cybernetics},
            year    = {1979},
            volume  = {9},
            number  = {1},
            pages   = {62--66},
            doi     = {10.1109/TSMC.1979.4310076}
          }
      - text: Zack, G. W., Rogers, W. E., & Latt, S. A. (1977). Automatic measurement of sister chromatid exchange frequency. Journal of Histochemistry & Cytochemistry, 25(7), 741–753. https://doi.org/10.1177/25.7.70454
        doi: 10.1177/25.7.70454
        when:
