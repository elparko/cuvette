adapter:
  name: imagej
  field: microscopy
  file_types: [".tif", ".tiff", ".png", ".jpg"]
  file_magic: ["49492a00", "4d4d002a", "89504e470d0a1a0a"]
  file_label: image files
  title: ImageJ
  version: 0.1.1
  spec: "1"
  description: >
    Counts and measures objects in microscope images with ImageJ. Each tool opens its input file,
    does one step, saves the result as a TIFF file and a PNG preview, and prints metrics. The next
    step takes the path of the file that the last step saved. The scientist can repeat each step
    in the ImageJ menus.
  authors: [Parker Smith]
  status: draft

program:
  name: ImageJ
  version: ""
  tested_versions: ["1.53k"]
  homepage: https://imagej.net
  docs:
    - https://imagej.net/ij/docs/guide/146.html
    - https://imagej.net/ij/developer/macro/macros.html
    - https://imagej.net/ij/developer/macro/functions.html
  install: >
    Download ImageJ 1.x or Fiji from https://imagej.net and install Java, because the adapter starts ij.jar with java.
    The adapter reads the jar from IMAGEJ_JAR, or from /Applications/ImageJ.app/Contents/Java/ij.jar or Fiji.app/jars/ij-*.jar:
    export IMAGEJ_JAR=/Applications/ImageJ.app/Contents/Java/ij.jar
  citation:
    - text: "Schneider, C. A., Rasband, W. S., & Eliceiri, K. W. (2012). NIH Image to ImageJ: 25 years of image analysis. Nature Methods, 9(7), 671–675. https://doi.org/10.1038/nmeth.2089"
      doi: 10.1038/nmeth.2089
      bibtex: |
        @article{schneider2012nih,
          author  = {Schneider, Caroline A. and Rasband, Wayne S. and Eliceiri, Kevin W.},
          title   = {{NIH} Image to {ImageJ}: 25 years of image analysis},
          journal = {Nature Methods},
          year    = {2012},
          volume  = {9},
          number  = {7},
          pages   = {671--675},
          doi     = {10.1038/nmeth.2089}
        }

connection:
  kind: macro
  interpreter: ["java", "-Dapple.awt.UIElement=true", "-jar", "{program_path}", "-batch", "{macro_file}"]
  macro_ext: ".ijm"
  state_tool: image_info
  history_tool: read_recording
  call_timeout_s: 120

locate:
  env: IMAGEJ_JAR
  paths:
    - /Applications/ImageJ.app/Contents/Java/ij.jar
    - ~/Applications/ImageJ.app/Contents/Java/ij.jar
    - /Applications/Fiji.app/jars/ij-*.jar
    - ~/Applications/Fiji.app/jars/ij-*.jar
    - ~/Fiji.app/jars/ij-*.jar
    - /Applications/Fiji/jars/ij-*.jar
    - ~/Applications/Fiji/jars/ij-*.jar
    - ~/Fiji/jars/ij-*.jar
    - ~/ImageJ/ij.jar
    - /opt/imagej/ij.jar
    - /opt/Fiji.app/jars/ij-*.jar
    - /usr/share/java/ij.jar
    - C:\Program Files\ImageJ\ij.jar
    - C:\ImageJ\ij.jar
    - C:\Fiji.app\jars\ij-*.jar
    - C:\Program Files\Fiji.app\jars\ij-*.jar
  version_command: ["java", "-Dapple.awt.UIElement=true", "-jar", "{program_path}", "-batch", "{adapter_dir}/version.ijm"]
  version_pattern: "version=(\\S+)"
  identity: "ImageJ version="

module: adapter.ts

data_rules:
  cloud_visibility: summaries
  note: A cloud model sees metrics, tables and small PNG previews. It never sees the original image files.

decisions:
  - key: question
    label: What question do you ask with these images?
    kind: text
    group: Question
    help: Example - Does drug X change the number of nuclei per field?
    essential: true
    owner: human
    stage: setup

  - key: replicate
    label: What is the unit of replication?
    kind: choice
    choices:
      - cells or particles (exploratory)
      - images or fields
      - biological replicates (animals, patients, cultures)
    default: images or fields
    group: Design
    help: >
      Cells in one image are not independent samples. Use images or biological replicates for a
      test. Use cells or particles only to explore.
    essential: true
    owner: human
    stage: setup

  - key: pixel_size
    label: Pixel size of the images
    kind: text
    default: uncalibrated
    group: Design
    help: Write the size and the unit, such as "0.65 um/pixel". Write "uncalibrated" if you do not know it.
    essential: true
    owner: human
    stage: setup
    changes_conclusion: true

  - key: alpha
    label: Significance level (alpha)
    kind: float
    default: 0.05
    lo: 0.0001
    hi: 0.2
    group: Statistics
    help: The p-value below which you call a difference significant.
    owner: human
    stage: setup
    changes_conclusion: false

  - key: threshold_method
    label: Threshold method
    kind: choice
    choices: [Default, Otsu, Triangle, Huang, Li, IsoData, Mean, MaxEntropy]
    default: Default
    group: Segmentation
    help: >
      The threshold decides which pixels are objects. Different methods can give different
      counts. The agent runs the main methods and shows you the counts before you choose.
    essential: true
    owner: human
    stage: when_needed
    links:
      - { tool: threshold, arg: method }
      - { tool: threshold_and_count, arg: method }
      - { tool: count_folder, arg: method }
    sensitivity:
      options: [Default, Otsu, Triangle, Li]
      tool: threshold_and_count
      compare: [metrics.count, metrics.mean_area]
      max_runs: 4

  - key: background_subtraction
    label: Background subtraction (rolling ball radius in pixels, 0 = none)
    kind: choice
    choices: [0, 10, 25, 50, 100]
    default: 0
    group: Segmentation
    help: >
      Use a radius larger than the largest object. Use 0 if the background is flat. An uneven
      background can change the count.
    owner: human
    stage: when_needed
    links:
      - { tool: subtract_background, arg: rolling_radius }
      - { tool: threshold_and_count, arg: rolling_radius }
      - { tool: count_folder, arg: rolling_radius }

  - key: particle_size_min
    label: Smallest object to count (in calibrated area units)
    kind: float
    default: 0
    lo: 0
    group: Segmentation
    help: Objects smaller than this are noise. Use 0 to count all objects.
    owner: human
    stage: setup
    links:
      - { tool: analyze_particles, arg: min_size }
      - { tool: threshold_and_count, arg: min_size }
      - { tool: count_folder, arg: min_size }

  - key: exclude_edges
    label: Exclude objects that touch the image edge
    kind: bool
    default: true
    group: Segmentation
    help: Objects cut by the image edge have a wrong size. The agent excludes them and records the reason.
    owner: agent
    stage: setup
    links:
      - { tool: analyze_particles, arg: exclude_edges }
      - { tool: threshold_and_count, arg: exclude_edges }
      - { tool: count_folder, arg: exclude_edges }

map:
  - tool: open_image
    route: File > Open...
    steps:
      - Select the file {path}
      - Image > Show Info... shows the size, the bit depth and the scale
      - Analyze > Measure shows the mean, the minimum and the maximum
    params:
      - { arg: path, label: File to open }
    fidelity: exact
    evidence: { source: program_definitions, test: blobs_info, note: The saturation and background numbers come from the tool and have no menu command. }
    summary: "Opened the image: {metrics.width} by {metrics.height} pixels, {metrics.bit_depth} bit."

  - tool: image_info
    route: Image > Show Info...
    steps:
      - Open the file {path} with File > Open...
    params:
      - { arg: path, label: File to open }
    fidelity: exact
    evidence: { source: program_definitions, test: blobs_info }
    summary: "Read the image: {metrics.width} by {metrics.height} pixels, {metrics.bit_depth} bit."

  - tool: set_scale
    route: Analyze > Set Scale...
    steps:
      - Distance in pixels = {distance_px}
      - Known distance = {known_distance}
      - Pixel aspect ratio = 1
      - Unit of length = {unit}
      - Click OK
    params:
      - { arg: distance_px, label: Distance in pixels, ui_default: 0 }
      - { arg: known_distance, label: Known distance, ui_default: 0 }
      - { arg: unit, label: Unit of length, ui_default: pixel }
    fidelity: exact
    evidence: { source: macro_recorder, test: discs_calibrated }
    summary: "Set the scale: {metrics.pixel_width} {data.values.pixel_unit} for each pixel."

  - tool: subtract_background
    route: Process > Subtract Background...
    steps:
      - Rolling ball radius = {rolling_radius}
      - Light background = {light_background}
      - Create background (don't subtract) = off
      - Sliding paraboloid = off
      - Disable smoothing = off
      - Click OK
    params:
      - { arg: rolling_radius, label: Rolling ball radius, ui_default: 50 }
      - { arg: light_background, label: Light background, ui_default: false }
    fidelity: exact
    evidence: { source: macro_recorder, test: discs_gradient_subtracted }
    summary: "Subtracted the background with a rolling ball of radius {rolling_radius} pixels."

  - tool: gaussian_blur
    route: Process > Filters > Gaussian Blur...
    steps:
      - Sigma (Radius) = {sigma}
      - Scaled Units = off
      - Click OK
    params:
      - { arg: sigma, label: Sigma (Radius), ui_default: 2 }
    fidelity: exact
    evidence: { source: macro_recorder, test: discs_noisy_blurred }
    summary: "Blurred the image with sigma {sigma} pixels."

  - tool: threshold
    route: Image > Adjust > Threshold...
    steps:
      - If the image is in color, run Image > Type > 8-bit first
      - Process > Binary > Options... clear Black background
      - Select the method {method} in the first list
      - Dark background = {dark_background}
      - Click Auto, then close the window without Apply
      - Process > Binary > Convert to Mask
    params:
      - { arg: method, label: Method, ui_default: Default }
      - { arg: dark_background, label: Dark background, ui_default: false }
    fidelity: exact
    evidence: { source: macro_recorder, test: blobs_threshold_steps }
    summary: "Applied the {method} threshold. {metrics.foreground_fraction} of the pixels are objects."

  - tool: watershed
    route: Process > Binary > Watershed
    steps:
      - Process > Binary > Options... clear Black background
    params: []
    fidelity: exact
    evidence: { source: macro_recorder, test: discs_touching_watershed }
    summary: "Split touching objects with the watershed."

  - tool: analyze_particles
    route: Analyze > Analyze Particles...
    steps:
      - Process > Binary > Options... clear Black background
      - Analyze > Set Measurements... select Area, Mean gray value, Standard deviation, Min and max gray value, Centroid, Perimeter, Shape descriptors, Integrated density, Median
      - Redirect to = {measure_image}
      - Size = {min_size}-{max_size}
      - Circularity = {min_circularity}-1.00
      - Show = Outlines
      - Display results = on
      - Clear results = on
      - Exclude on edges = {exclude_edges}
      - Click OK
    params:
      - { arg: min_size, label: Size (minimum), ui_default: 0 }
      - { arg: max_size, label: Size (maximum), ui_default: Infinity, note: The tool uses 0 for Infinity. }
      - { arg: min_circularity, label: Circularity (minimum), ui_default: 0 }
      - { arg: exclude_edges, label: Exclude on edges, ui_default: false }
      - { arg: measure_image, label: Redirect to, ui_default: None }
    fidelity: exact
    evidence: { source: macro_recorder, test: blobs_count_default }
    summary: "Counted {metrics.count} particles. Mean area {metrics.mean_area}, total area {metrics.total_area} {data.values.area_unit}."

  - tool: measure
    route: Analyze > Measure
    steps:
      - Analyze > Set Measurements... select Area, Mean gray value, Standard deviation, Min and max gray value, Integrated density
      - Edit > Selection > Specify... Width, Height, X, Y = {roi}
      - Analyze > Measure
    params:
      - { arg: roi, label: "Selection (x, y, width, height)", ui_default: whole image }
    fidelity: exact
    evidence: { source: macro_recorder, test: discs_measure }
    summary: "Measured the image. Mean {metrics.mean}, standard deviation {metrics.std}."

  - tool: threshold_and_count
    route: Analyze > Analyze Particles...
    steps:
      - If the rolling ball radius is above 0, run Process > Subtract Background... with the radius {rolling_radius}
      - If sigma is above 0, run Process > Filters > Gaussian Blur... with sigma {sigma}
      - Run Image > Adjust > Threshold... with the method {method}, then Process > Binary > Convert to Mask
      - If watershed is on, run Process > Binary > Watershed
      - Run Analyze > Analyze Particles... with size {min_size}-{max_size} and Exclude on edges = {exclude_edges}
    params:
      - { arg: method, label: Method, ui_default: Default }
      - { arg: dark_background, label: Dark background, ui_default: false }
      - { arg: rolling_radius, label: Rolling ball radius, ui_default: 50 }
      - { arg: sigma, label: Sigma (Radius), ui_default: 2 }
      - { arg: min_size, label: Size (minimum), ui_default: 0 }
      - { arg: exclude_edges, label: Exclude on edges, ui_default: false }
    fidelity: exact
    evidence: { source: macro_recorder, test: blobs_count_default }
    summary: "Counted {metrics.count} particles with the {method} threshold. Mean area {metrics.mean_area} {data.values.area_unit}."

  - tool: count_folder
    route: Analyze > Analyze Particles...
    steps:
      - Repeat the steps of threshold_and_count for each image in the folder
      - The folder is {folder}. The files match {pattern}
    params:
      - { arg: method, label: Method, ui_default: Default }
      - { arg: min_size, label: Size (minimum), ui_default: 0 }
      - { arg: exclude_edges, label: Exclude on edges, ui_default: false }
    fidelity: exact
    evidence: { source: macro_recorder, test: folder_counts }
    summary: "Counted {metrics.n_images} images. Total {metrics.total_count} particles, mean {metrics.mean_count} for each image."

  - tool: run_command
    route: Menu command
    steps:
      - Open the file {input}
      - Run the command {command} with the options {options}
    params:
      - { arg: command, label: Menu command }
      - { arg: options, label: Dialog fields, note: The same text that the Macro Recorder writes. }
    fidelity: exact
    evidence: { source: program_definitions, test: discs_run_command }
    summary: "Ran the menu command {command}."

  - tool: run_macro
    route: Plugins > New > Macro
    steps:
      - Paste the macro text and click Run in the macro editor
    params:
      - { arg: code, label: Macro text }
    fidelity: code_only
    evidence: { source: code }
    summary: "Ran the macro."

  - tool: list_commands
    route: Plugins > Utilities > Find Commands...
    steps:
      - Type {query} in the search field
    params:
      - { arg: query, label: Search field }
    fidelity: exact
    evidence: { source: program_definitions }
    summary: "Found {metrics.n_found} menu commands for {query}."

  - tool: read_recording
    route: Plugins > Macros > Record...
    steps:
      - Do the steps in the ImageJ menus
      - Click Create in the recorder window, then save the macro with File > Save As...
    params:
      - { arg: path, label: Saved macro file }
    fidelity: exact
    evidence: { source: macro_recorder }
    summary: "Read {metrics.n_steps} recorded steps."

checks:
  - id: pseudoreplication
    description: Statistics over cells or particles from too few images, shown with p-values.
    severity: error
  - id: uncalibrated_units
    description: The answer gives sizes in micrometers but the image has no scale.
    severity: error
  - id: saturation
    description: A measured image has saturated pixels.
    severity: warning
  - id: jpeg_quantification
    description: A JPEG file was measured.
    severity: warning
  - id: threshold_not_checked
    description: The threshold method was not compared with other methods, or the count depends on the method.
    severity: warning
  - id: background_not_handled
    description: The image background differs across the field but the steps do not subtract it.
    severity: warning

text_tools: [list_commands]

tests:
  - id: blobs_info
    gui: true
    description: The sample image blobs.gif is 256 by 254 pixels, 8 bit, with an inverting LUT.
    data: [data/blobs.gif]
    calls:
      - tool: open_image
        args: { path: "{adapter_dir}/data/blobs.gif" }
    expect:
      - { path: metrics.width, equals: 256 }
      - { path: metrics.height, equals: 254 }
      - { path: metrics.bit_depth, equals: 8 }
      - { path: metrics.inverting_lut, equals: 1 }
      - { path: metrics.min_value, equals: 8 }
      - { path: metrics.max_value, equals: 248 }
      - { path: metrics.saturated_fraction, equals: 0 }

  - id: blobs_count_default
    gui: true
    description: The classic result. The Default threshold finds 64 particles in blobs.gif. Edges are not excluded.
    data: [data/blobs.gif]
    manual_route_checked: true
    calls:
      - tool: threshold
        args: { input: "{adapter_dir}/data/blobs.gif", method: Default, dark_background: false }
        save_as: thr
      - tool: analyze_particles
        args: { mask: "{saved.thr.data.files.mask}", exclude_edges: false }
    expect:
      - { path: metrics.count, equals: 64 }
      - { path: metrics.total_area, equals: 22243 }
      - { path: metrics.mean_area, approx: 347.547, rel: 0.00001 }
      - { path: metrics.area_fraction, approx: 0.34207, rel: 0.0001 }

  - id: blobs_threshold_steps
    gui: true
    description: The threshold step on blobs.gif gives the limits 126 and 255.
    data: [data/blobs.gif]
    calls:
      - tool: threshold
        args: { input: "{adapter_dir}/data/blobs.gif", method: Default, dark_background: false }
    expect:
      - { path: metrics.threshold_low, equals: 126 }
      - { path: metrics.threshold_high, equals: 255 }
      - { path: metrics.foreground_fraction, approx: 0.34207, rel: 0.0001 }

  - id: blobs_exclude_edges
    gui: true
    description: With Exclude on edges, 46 of the 64 particles remain.
    data: [data/blobs.gif]
    calls:
      - tool: threshold_and_count
        args: { input: "{adapter_dir}/data/blobs.gif", method: Default, dark_background: false, exclude_edges: true }
    expect:
      - { path: metrics.count, equals: 46 }
      - { path: metrics.mean_area, approx: 384.478, rel: 0.00001 }

  - id: blobs_triangle
    gui: true
    description: The Triangle threshold gives a very different count than Default. The count depends on the method.
    data: [data/blobs.gif]
    calls:
      - tool: threshold_and_count
        args: { input: "{adapter_dir}/data/blobs.gif", method: Triangle, dark_background: false }
    expect:
      - { path: metrics.count, equals: 119 }

  - id: discs_count
    gui: true
    description: Twelve discs of radius 10 on a dark background. Each disc has 317 pixels.
    data: [data/discs.png]
    calls:
      - tool: threshold_and_count
        args: { input: "{adapter_dir}/data/discs.png", method: Default, dark_background: true }
    expect:
      - { path: metrics.count, equals: 12 }
      - { path: metrics.mean_area, equals: 317 }
      - { path: metrics.total_area, equals: 3804 }
      - { path: metrics.area_fraction, approx: 0.05804, rel: 0.0001 }

  - id: discs_touching
    gui: true
    description: Six pairs of touching discs. Without the watershed, each pair counts as one object.
    data: [data/discs_touching.png]
    calls:
      - tool: threshold_and_count
        args: { input: "{adapter_dir}/data/discs_touching.png", method: Default, dark_background: true }
    expect:
      - { path: metrics.count, equals: 6 }
      - { path: metrics.mean_area, equals: 573 }

  - id: discs_touching_watershed
    gui: true
    description: The watershed splits the six pairs into twelve objects.
    data: [data/discs_touching.png]
    calls:
      - tool: threshold_and_count
        args: { input: "{adapter_dir}/data/discs_touching.png", method: Default, dark_background: true, watershed: true }
    expect:
      - { path: metrics.count, equals: 12 }
      - { path: metrics.mean_area, equals: 279 }

  - id: discs_gradient_raw
    gui: true
    description: Twelve discs on a background with a gradient. Without background subtraction the count is wrong.
    data: [data/discs_gradient.png]
    calls:
      - tool: threshold_and_count
        args: { input: "{adapter_dir}/data/discs_gradient.png", method: Default, dark_background: true }
    expect:
      - { path: metrics.count, equals: 116 }

  - id: discs_gradient_subtracted
    gui: true
    description: A rolling ball with radius 25 removes the gradient and the count is 12.
    data: [data/discs_gradient.png]
    calls:
      - tool: subtract_background
        args: { input: "{adapter_dir}/data/discs_gradient.png", rolling_radius: 25 }
        save_as: flat
      - tool: threshold_and_count
        args: { input: "{saved.flat.data.files.image}", method: Default, dark_background: true }
    expect:
      - { path: metrics.count, equals: 12 }
      - { path: metrics.mean_area, equals: 317 }

  - id: discs_noisy_blurred
    gui: true
    description: Twelve discs with noise. A blur with sigma 2 gives 12 objects.
    data: [data/discs_noisy.png]
    calls:
      - tool: gaussian_blur
        args: { input: "{adapter_dir}/data/discs_noisy.png", sigma: 2 }
        save_as: smooth
      - tool: threshold_and_count
        args: { input: "{saved.smooth.data.files.image}", method: Default, dark_background: true }
    expect:
      - { path: metrics.count, equals: 12 }
      - { path: metrics.mean_area, approx: 331.917, rel: 0.0001 }

  - id: discs_calibrated
    gui: true
    description: A scale of 0.5 micrometer for each pixel makes each area 79.25 square micrometers.
    data: [data/discs.png]
    calls:
      - tool: set_scale
        args: { input: "{adapter_dir}/data/discs.png", distance_px: 100, known_distance: 50, unit: um }
        save_as: scaled
      - tool: threshold_and_count
        args: { input: "{saved.scaled.data.files.image}", method: Default, dark_background: true }
    expect:
      - { path: metrics.count, equals: 12 }
      - { path: metrics.mean_area, equals: 79.25 }
      - { path: data.values.area_unit, equals: um }

  - id: discs_measure
    gui: true
    description: The mean of the whole synthetic image.
    data: [data/discs.png]
    calls:
      - tool: measure
        args: { input: "{adapter_dir}/data/discs.png" }
    expect:
      - { path: metrics.area, equals: 65536 }
      - { path: metrics.mean, approx: 30.448, rel: 0.0001 }
      - { path: metrics.max, equals: 200 }

  - id: discs_saturated
    gui: true
    description: The saturated version has 5.8 percent of pixels at 255.
    data: [data/discs_saturated.png]
    calls:
      - tool: open_image
        args: { path: "{adapter_dir}/data/discs_saturated.png" }
    expect:
      - { path: metrics.saturated_fraction, approx: 0.05804, rel: 0.001 }

  - id: discs_gradient_info
    gui: true
    description: >
      open_image flags the uneven background. The background variation 0.4767 (block medians 21,
      102, 20, 102 and 61, range 4 to 176) comes from a Python version of the same calculation
      with the ImageJ histogram median (checks/background_variation.py and its output
      checks/background_variation.txt). The tolerance allows 2 grey levels of median difference.
    data: [data/discs_gradient.png]
    calls:
      - tool: open_image
        args: { path: "{adapter_dir}/data/discs_gradient.png" }
    expect:
      - { path: metrics.background_variation, min: 0.3 }
      - { path: metrics.background_variation, approx: 0.4767, abs: 0.012 }

  - id: discs_run_command
    gui: true
    description: A generic menu command gives the same pixels as the named tool.
    data: [data/discs.png]
    calls:
      - tool: run_command
        args: { input: "{adapter_dir}/data/discs.png", command: Gaussian Blur..., options: sigma=2 }
        save_as: viacommand
      - tool: gaussian_blur
        args: { input: "{adapter_dir}/data/discs.png", sigma: 2 }
        save_as: named
      - tool: measure
        args: { input: "{saved.viacommand.data.files.image}" }
        save_as: m1
      - tool: measure
        args: { input: "{saved.named.data.files.image}" }
    expect:
      - { path: saved.m1.metrics.integrated_density, equals: 1994960 }
      - { path: metrics.integrated_density, equals: 1994960 }

  - id: folder_counts
    gui: true
    description: Counts for each image in the data folder.
    data: [data/discs.png, data/discs_touching.png, data/discs_gradient.png, data/discs_noisy.png, data/discs_saturated.png]
    calls:
      - tool: count_folder
        args: { folder: "{adapter_dir}/data", pattern: "discs*.png", method: Default, dark_background: true, sigma: 2 }
    expect:
      - { path: metrics.n_images, equals: 5 }
      - { path: metrics.total_count, equals: 49 }
      - { path: metrics.min_count, equals: 6 }
      - { path: metrics.max_count, equals: 12 }

  - id: blobs_image_info
    gui: true
    description: >
      image_info reads blobs.gif without a change. 256 by 254 pixels, 8 bit, raw values 8 to 248.
      The scikit-image adapter test and a Python read (checks/background_variation.txt) give the
      same numbers.
    data: [data/blobs.gif]
    calls:
      - tool: image_info
        args: { path: "{adapter_dir}/data/blobs.gif" }
    expect:
      - { path: metrics.width, equals: 256 }
      - { path: metrics.height, equals: 254 }
      - { path: metrics.bit_depth, equals: 8 }
      - { path: metrics.min_value, equals: 8 }
      - { path: metrics.max_value, equals: 248 }

  - id: discs_watershed_steps
    gui: true
    description: >
      The image has six pairs of touching discs, twelve discs by construction (data/make-synthetic.ts).
      threshold, then watershed, then analyze_particles gives twelve objects, the same count as the
      test discs_touching_watershed.
    data: [data/discs_touching.png]
    calls:
      - tool: threshold
        args: { input: "{adapter_dir}/data/discs_touching.png", method: Default, dark_background: true }
        save_as: thr
      - tool: watershed
        args: { mask: "{saved.thr.data.files.mask}" }
        save_as: ws
      - tool: analyze_particles
        args: { mask: "{saved.ws.data.files.mask}", exclude_edges: false }
    expect:
      - { path: metrics.count, equals: 12 }

  - id: run_macro_new_image
    gui: true
    description: Macro code makes a new 10 by 20 pixel image and prints its size. The size is set by the code.
    calls:
      - tool: run_macro
        args: { code: "newImage(\"t\", \"8-bit black\", 10, 20, 1); print(\"width=\" + getWidth()); print(\"height=\" + getHeight());" }
    expect:
      - { path: metrics.width, equals: 10 }
      - { path: metrics.height, equals: 20 }

  - id: list_commands_gaussian
    gui: true
    description: The ImageJ menu has Gaussian Blur under Process > Filters (ImageJ user guide, https://imagej.net/ij/docs/menus/process.html). list_commands returns text (text_tools).
    calls:
      - tool: list_commands
        args: { query: gaussian blur }
    expect:
      - { path: text, contains: "Process > Filters > Gaussian Blur..." }

  - id: read_recording_blobs
    gui: true
    description: >
      data/recording-blobs.ijm has nine macro lines. setAutoThreshold and Convert to Mask make one
      threshold step, so the file holds eight steps (count by hand; tests/imagej.test.ts checks
      the same list).
    data: [data/recording-blobs.ijm]
    calls:
      - tool: read_recording
        args: { path: "{adapter_dir}/data/recording-blobs.ijm" }
    expect:
      - { path: metrics.n_steps, equals: 8 }

  - id: read_recording_missing_file
    gui: true
    description: A macro file that does not exist fails, and the error names the file.
    calls:
      - tool: read_recording
        args: { path: "{adapter_dir}/data/no_such_recording.ijm" }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "No file at" }
      - { path: error, contains: "no_such_recording.ijm" }

tools:
  - name: open_image
    title: Open an image
    description: >
      Open an image file and report its size, bit depth, scale, intensity range, saturated
      fraction and background variation. Saves a PNG preview. Use this first for each new image.
    params:
      path: { type: string, description: Full path of the image file. }
    required: [path]
    outputs:
      preview: { kind: image, ext: .png, description: PNG preview of the image. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{path}");
      printInfo("{path}");
      savePreview("{output.preview}");

  - name: image_info
    title: Read image information
    description: Report the size, bit depth, scale and intensity range of an image file. Changes nothing.
    params:
      path: { type: string, description: Full path of the image file. }
    required: [path]
    read_only: true
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{path}");
      printInfo("{path}");

  - name: set_scale
    title: Set the scale
    description: >
      Save a copy of the image with a known scale. Use it when you know the length of a feature
      in pixels, such as a scale bar. After this step sizes use real units.
    params:
      input: { type: string, description: Path of the input image. }
      distance_px: { type: number, exclusiveMinimum: 0, description: Distance in pixels. }
      known_distance: { type: number, exclusiveMinimum: 0, description: "The real length of that distance, in the unit that the unit argument names." }
      unit: { type: string, default: um, description: "Unit of length, such as um, mm or nm." }
    required: [input, distance_px, known_distance]
    outputs:
      image: { kind: file, ext: .tif, description: Image with the scale. }
      preview: { kind: image, ext: .png, description: PNG preview. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{input}");
      run("Set Scale...", "distance={distance_px} known={known_distance} pixel=1 unit={unit}");
      getPixelSize(u, pw, ph);
      print("pixel_width=" + d2s(pw, 6));
      print("pixel_unit=" + asciiUnit(u));
      savePair("{output.image}", "{output.preview}");

  - name: subtract_background
    title: Subtract the background
    description: >
      Remove an uneven background with the rolling ball method. Use a radius larger than the
      largest object. Use it when open_image reports that the background differs across the image.
    params:
      input: { type: string, description: Path of the input image. }
      rolling_radius: { type: number, minimum: 0, default: 50, description: Radius of the rolling ball in pixels. 0 means no subtraction; the image is passed on unchanged. }
      light_background: { type: boolean, default: false, description: True if the objects are dark on a light background. }
    required: [input]
    outputs:
      image: { kind: file, ext: .tif, description: Image without the background. }
      preview: { kind: image, ext: .png, description: PNG preview. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{input}");
      if ({rolling_radius} > 0) {
        opt = "rolling={rolling_radius}";
        if ({light_background}) opt = opt + " light";
        run("Subtract Background...", opt);
      } else {
        print("note=The radius is 0, so no background was subtracted. The image is unchanged.");
      }
      savePair("{output.image}", "{output.preview}");
    citations:
      - text: Sternberg, S. R. (1983). Biomedical Image Processing. Computer, 16(1), 22–34. https://doi.org/10.1109/MC.1983.1654163
        doi: 10.1109/MC.1983.1654163
        bibtex: |
          @article{sternberg1983biomedical,
            author  = {Sternberg, Stanley R.},
            title   = {Biomedical Image Processing},
            journal = {Computer},
            year    = {1983},
            volume  = {16},
            number  = {1},
            pages   = {22--34},
            doi     = {10.1109/MC.1983.1654163}
          }

  - name: gaussian_blur
    title: Blur the image
    description: >
      Smooth the image with a Gaussian filter. Use it to lower noise before a threshold. Sigma is
      in pixels.
    params:
      input: { type: string, description: Path of the input image. }
      sigma: { type: number, exclusiveMinimum: 0, default: 2, description: Sigma (radius) in pixels. }
    required: [input]
    outputs:
      image: { kind: file, ext: .tif, description: Blurred image. }
      preview: { kind: image, ext: .png, description: PNG preview. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{input}");
      run("Gaussian Blur...", "sigma={sigma}");
      savePair("{output.image}", "{output.preview}");

  - name: threshold
    title: Make a binary mask
    description: >
      Select the objects with an automatic threshold and save a binary mask. Set dark_background to
      true if the objects are bright on a dark background, as displayed. Use the same method for
      all images that you compare.
    params:
      input: { type: string, description: Path of the input image. }
      method:
        type: string
        enum: [Default, Otsu, Triangle, Huang, Li, IsoData, Mean, MaxEntropy]
        description: Automatic threshold method.
      dark_background: { type: boolean, default: false, description: True if the objects are bright on a dark background. }
    required: [input, method]
    outputs:
      mask: { kind: file, ext: .tif, description: Binary mask. The objects have the value 255. }
      preview: { kind: image, ext: .png, description: PNG preview of the mask. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{input}");
      runThreshold("{method}", {dark_background});
      savePair("{output.mask}", "{output.preview}");
    citations:
