  - name: run_command
    title: Run any menu command
    description: >
      Run one ImageJ menu command on an image and save the result. Use it only when no other tool
      fits. Give the exact command name, such as "Median...". Give every dialog field in options,
      in the form that the Macro Recorder writes, such as "radius=2". Use list_commands to find names.
    params:
      input: { type: string, description: Path of the input image. }
      command: { type: string, description: 'Exact menu command name, such as "Median...".' }
      options: { type: string, default: "", description: "Dialog fields, such as radius=2." }
    required: [input, command]
    approval: true
    outputs:
      image: { kind: file, ext: .tif, description: The image after the command. }
      preview: { kind: image, ext: .png, description: PNG preview. }
    parse: keyvalue
    macro: |
      {include:lib.ijm}
      openImage("{input}");
      cmdName = toLowerCase("{command}");
      if (cmdName == "run..." || cmdName == "install..." || cmdName == "compile and run..." || cmdName == "macro...") fail("The command {command} runs code. Use run_macro for code.");
      List.setCommands;
      if (List.get("{command}") == "") fail("Unknown menu command: {command}. Use list_commands to find the exact name.");
      run("{command}", "{options}");
      if (nImages == 0) fail("The command closed the image.");
      savePair("{output.image}", "{output.preview}");

  - name: run_macro
    title: Run macro code
    description: >
      Run ImageJ macro code. Use it only when no other tool fits. A macro error can stop the
      program until the time limit. Print results as key=value lines. The variable callDir holds a
      folder where the macro can save files.
    params:
      code: { type: string, description: ImageJ macro code. }
    required: [code]
    approval: true
    parse: keyvalue
    macro: |
      callDir = "{call_dir}";
      {raw:code}
