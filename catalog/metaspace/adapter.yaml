adapter:
  name: metaspace
  field: mass spectrometry imaging
  file_types: []
  title: METASPACE public annotations
  version: 0.1.6
  spec: "1"
  description: Searches public METASPACE datasets, reads their metadata, lists annotations at an FDR level and database, counts annotations at FDR 5, 10 and 20 percent, and saves one ion image as a PNG file. Read only. No upload and no private data.
  authors: [onboarding agent]
  status: draft

program:
  name: METASPACE
  version: "2.0.9"
  homepage: https://metaspace2020.org
  docs:
    - https://metaspace2020.org/help
    - https://metaspace2.readthedocs.io/en/latest/content/examples/fetch-dataset-annotations.html
    - https://github.com/metaspace2020/metaspace/tree/master/metaspace/python-client
  install: >
    The adapter uses the Python environment at ~/.guided-analysis/envs/metaspace, or the python that GA_METASPACE_PYTHON names.
    Make it and add the METASPACE client. The tools need network access and no API key:
    uv venv ~/.guided-analysis/envs/metaspace && uv pip install --python ~/.guided-analysis/envs/metaspace/bin/python metaspace2020
  citation:
    - text: Palmer, A., Phapale, P., Chernyavsky, I., Lavigne, R., Fay, D., Tarasov, A., Kovalev, V., Fuchser, J., Nikolenko, S., Pineau, C., Becker, M., & Alexandrov, T. (2017). FDR-controlled metabolite annotation for high-resolution imaging mass spectrometry. Nature Methods, 14(1), 57–60. https://doi.org/10.1038/nmeth.4072
      doi: 10.1038/nmeth.4072
      bibtex: |
        @article{palmer2017fdr,
          author  = {Palmer, Andrew and Phapale, Prasad and Chernyavsky, Ilya and Lavigne, Regis and Fay, Dominik and Tarasov, Artem and Kovalev, Vitaly and Fuchser, Jens and Nikolenko, Sergey and Pineau, Charles and Becker, Michael and Alexandrov, Theodore},
          title   = {{FDR}-controlled metabolite annotation for high-resolution imaging mass spectrometry},
          journal = {Nature Methods},
          year    = {2017},
          volume  = {14},
          number  = {1},
          pages   = {57--60},
          doi     = {10.1038/nmeth.4072}
        }
    - text: "Alexandrov, T., Ovchinnikova, K., Palmer, A., Kovalev, V., Tarasov, A., Stuart, L., Nigmetzianov, R., Fay, D., et al. (2019). METASPACE: A community-populated knowledge base of spatial metabolomes in health and disease [Computer software]. bioRxiv preprint 539478. https://doi.org/10.1101/539478"
      doi: 10.1101/539478
      bibtex: |
        @misc{alexandrov2019metaspace,
          author       = {Alexandrov, Theodore and Ovchinnikova, Katja and Palmer, Andrew and Kovalev, Vitaly and Tarasov, Artem and Stuart, Lachlan and Nigmetzianov, Renat and Fay, Dominik and others},
          title        = {{METASPACE}: A community-populated knowledge base of spatial metabolomes in health and disease},
          year         = {2019},
          howpublished = {bioRxiv preprint 539478},
          doi          = {10.1101/539478}
        }

connection:
  kind: python
  interpreter: ["{program_path}"]
  call_timeout_s: 180

locate:
  env: GA_METASPACE_PYTHON
  paths: ["~/.guided-analysis/envs/metaspace/bin/python"]
  version_command: ["{program_path}", "-c", "import importlib.metadata as m; print('metaspace2020', m.version('metaspace2020'))"]
  version_pattern: 'metaspace2020 (\S+)'
  identity: 'metaspace2020 \d'

data_rules:
  cloud_visibility: all
  note: All data are public METASPACE datasets. METASPACE policy for public datasets is CC BY 4.0. Check the license of one dataset before you redistribute its tables.

decisions:
  - key: fdr
    label: FDR level
    kind: choice
    choices: [0.05, 0.1, 0.2, 0.5]
    default: 0.1
    owner: human
    group: Annotation
    stage: when_needed
    essential: true
    changes_conclusion: true
    help: An annotation is kept if its false discovery rate is at or below this value. METASPACE offers 5, 10, 20 and 50 percent. The website shows 10 percent first. The count changes a lot between levels.
    links:
      - { tool: list_annotations, arg: fdr }
      - { tool: overlap_annotations, arg: fdr }
    sensitivity:
      options: [0.05, 0.1, 0.2]
      tool: list_annotations
      compare: [metrics.n_annotations]
      max_runs: 3

  - key: database
    label: Molecular database and version
    kind: choice
    choices: ["HMDB v4", "LipidMaps 2017-12-12", "SwissLipids 2018-02-02", "HMDB v2.5", "ChEBI 2018-01", "LIPID_MAPS 2016"]
    default: "HMDB v4"
    owner: human
    group: Annotation
    stage: when_needed
    essential: true
    changes_conclusion: true
    help: The engine scores only the molecular formulas that are in this database. Write the name and the version, such as LipidMaps 2017-12-12. The dataset must have been processed with it. Use get_dataset_info for the databases of a dataset and list_databases for all of them.
    links:
      - { tool: list_annotations, arg: database }
      - { tool: compare_fdr_counts, arg: database }
      - { tool: overlap_annotations, arg: database }
    sensitivity:
      options: ["HMDB v4", "LipidMaps 2017-12-12"]
      tool: compare_fdr_counts
      compare: [metrics.n_fdr_10]
      max_runs: 2

  - key: adducts
    label: Adduct to count
    kind: choice
    choices: [all, "+H", "+Na", "+K", "-H", "+Cl"]
    default: all
    owner: human
    group: Annotation
    stage: when_needed
    help: The adducts were set when the owner of the dataset ran the engine. This choice only filters the list. Use all to count every adduct that the dataset has.
    links:
      - { tool: list_annotations, arg: adduct }

  - key: exclude_off_sample
    label: Remove off-sample annotations
    kind: bool
    default: false
    owner: human
    group: Annotation
    stage: when_needed
    essential: true
    help: METASPACE flags an annotation as off-sample if its ion image looks like it comes from outside the tissue, for example from matrix. The website shows them unless you hide them. Yes removes them from the count.
    links:
      - { tool: list_annotations, arg: exclude_off_sample }
      - { tool: compare_fdr_counts, arg: exclude_off_sample }
      - { tool: overlap_annotations, arg: exclude_off_sample }

tools:
  - name: search_datasets
    title: Search public datasets
    description: Search public METASPACE datasets. All filters are optional. The result lists id, name, organism, polarity, matrix, analyzer, resolving power, submitter and group. The newest datasets come first.
    read_only: true
    function: "wrapper:search_datasets"
    params:
      name: { type: string, description: Part of the dataset name. }
      dataset_id: { type: string, description: "One dataset id, or several ids joined with | or a comma, such as 2022-08-16_10h14m23s." }
      organism: { type: string, description: "Organism as METASPACE writes it, such as Mouse or Human." }
      polarity: { type: string, enum: [Positive, Negative] }
      submitter: { type: string, description: Part of the name of the submitter. The tool checks only the newest 1500 datasets that fit the other filters. Add group or organism to narrow the search. }
      group: { type: string, description: Part of the name of the lab group. }
      maldi_matrix: { type: string, description: "MALDI matrix name as the dataset metadata writes it. The matrix column of a search result shows the names." }
      analyzer_type: { type: string, description: "Analyzer such as Orbitrap, FTICR or TOF." }
      ionisation_source: { type: string, description: "Such as MALDI or DESI." }
      limit: { type: integer, minimum: 1, maximum: 100, default: 20, description: Largest count of datasets that the search returns. }

  - name: get_dataset_info
    title: Read dataset information
    description: Read the metadata of one public dataset - organism, polarity, ionisation source, analyzer, resolving power, matrix, pixel size, and the databases, adducts and ppm tolerance that the engine used.
    read_only: true
    function: "wrapper:get_dataset_info"
    params:
      dataset_id: { type: string, description: "One dataset id, such as 2022-08-16_10h14m23s. Call the tool once for each dataset." }
    required: [dataset_id]

  - name: list_databases
    title: List molecular databases
    description: List the public molecular databases of METASPACE with their ids and versions.
    read_only: true
    function: "wrapper:list_databases"
    returns: text

  - name: list_annotations
    title: List annotations
    description: List the annotations of one dataset at a maximum FDR for one database. Each row has formula, adduct, m/z, MSM, FDR, the off-sample flag and molecule names. The full list is saved as a CSV file. An annotation is a putative sum formula, not an identification.
    read_only: true
    function: "wrapper:list_annotations"
    params:
      dataset_id: { type: string, description: "One dataset id, such as 2022-08-16_10h14m23s. Call the tool once for each dataset." }
      database: { type: string, description: "Database name and version, such as HMDB v4 or LipidMaps 2017-12-12." }
      fdr: { type: number, enum: [0.05, 0.1, 0.2, 0.5] }
      exclude_off_sample: { type: boolean, default: false, description: "Leave this out unless the scientist decided to remove off-sample annotations. The result already shows the number of off-sample annotations." }
      adduct: { type: string, description: "An adduct such as +H, or all.", default: all }
    required: [dataset_id]

  - name: compare_fdr_counts
    title: Compare annotation counts at FDR 5, 10 and 20 percent
    description: Count the annotations of one dataset and one database at FDR 5, 10 and 20 percent. Also count the off-sample annotations at each level. To compare databases, call it once for each database.
    read_only: true
    function: "wrapper:compare_fdr_counts"
    params:
      dataset_id: { type: string, description: "One dataset id, such as 2022-08-16_10h14m23s. Call the tool once for each dataset." }
      database: { type: string, description: "Database name and version, such as HMDB v4 or LipidMaps 2017-12-12." }
      exclude_off_sample: { type: boolean, default: false, description: "Leave this out unless the scientist decided to remove off-sample annotations. The result already shows the number of off-sample annotations." }
    required: [dataset_id]

  - name: overlap_annotations
    title: Compare the annotations of 2 to 6 datasets
    description: Count the ions (sum formula plus adduct) that all given datasets share, at one FDR level and one database. Use it to ask if serial sections or two datasets agree.
    read_only: true
    function: "wrapper:overlap_annotations"
    params:
      dataset_ids: { type: string, description: "2 to 6 dataset ids joined with a comma." }
      database: { type: string, description: "Database name and version, such as HMDB v4 or LipidMaps 2017-12-12." }
      fdr: { type: number, enum: [0.05, 0.1, 0.2, 0.5] }
      exclude_off_sample: { type: boolean, default: false, description: "Leave this out unless the scientist decided to remove off-sample annotations." }
    required: [dataset_ids]

  - name: get_ion_image
    title: Save an ion image
    description: Save the ion image of one annotation as a PNG file. The image is the first isotope peak, scaled to its own maximum, in the viridis color scale.
    read_only: true
    function: "wrapper:get_ion_image"
    params:
      dataset_id: { type: string, description: "One dataset id, such as 2022-08-16_10h14m23s. Call the tool once for each dataset." }
      formula: { type: string, description: "Neutral sum formula, such as C39H78NO8P." }
      adduct: { type: string, description: "Adduct such as +H." }
      hotspot_clipping: { type: boolean, default: true, description: "Clip the brightest pixels as the website does." }
    required: [dataset_id, formula, adduct]

map:
  - tool: search_datasets
    route: "Datasets page > Add filter > Select organism / Select polarity / Select group / Select submitter / Select MALDI matrix / Select analyzer / Select ionisation source > pick a value; or type in Enter keywords"
    steps:
      - "Open https://metaspace2020.org/datasets"
      - "Click Add filter and choose a filter, such as Select polarity"
      - "Pick the value, such as Negative"
      - "Read the id of each dataset on its Dataset overview page, or in the address after ds="
    params:
      - { arg: name, label: Enter keywords }
      - { arg: dataset_id, label: Select dataset }
      - { arg: organism, label: Select organism }
      - { arg: polarity, label: Select polarity }
      - { arg: submitter, label: Select submitter }
      - { arg: group, label: Select group }
      - { arg: maldi_matrix, label: Select MALDI matrix }
      - { arg: analyzer_type, label: Select analyzer }
      - { arg: ionisation_source, label: Select ionisation source }
    fidelity: close
    difference: "The website lists Processing, Queued and Finished datasets; the tool lists Finished ones. The website needs a pick from a list for submitter; the tool matches part of the name in the newest 1500 datasets. Keyword search on the website is not the same as the name filter of the tool. The route was not run side by side."
    evidence: { source: docs, test: search-group, note: "Filter names were read from the Add filter list on the website on 2026-10-08. The tool search was run through the GraphQL API." }
    summary: "{metrics.n_found} datasets found"

  - tool: get_dataset_info
    route: "Datasets page > filter on the dataset > Show full metadata; or Dataset overview"
    steps:
      - "Open https://metaspace2020.org/dataset/{dataset_id}"
      - "Read Sample information, Sample preparation, MS analysis and the processing settings"
    params:
      - { arg: dataset_id, label: Dataset }
    fidelity: exact
    evidence: { source: docs, test: info-pinned, note: "The website dataset card for this dataset shows Mouse, brain, MALDI + qTOF, positive mode, RP 60k @ 700. The tool shows the same values." }
    summary: "{data.name}: {data.organism}, {data.polarity}, {data.analyzer}"

  - tool: list_databases
    route: "Upload page > Molecular databases list; or Annotations page > Add filter > Database"
    steps:
      - "Open https://metaspace2020.org/annotations"
      - "Open the Database filter and read the list"
    fidelity: close
    difference: "The Annotations page lists only the databases of the datasets that match the current filters. The tool lists every public database. The route was not run side by side."
    evidence: { source: docs, test: databases-list }
    summary: "{metrics.n_databases} public databases"

  - tool: list_annotations
    route: "Datasets page > open the dataset > Browse annotations > Annotations page > set filters Database and FDR > Export to CSV"
    steps:
      - "Open https://metaspace2020.org/annotations?ds={dataset_id}"
      - "Set the filter Database to {database}"
      - "Set the filter FDR to the value of fdr, such as 10%"
      - "Add filter > Show/hide off-sample annotations, to hide off-sample annotations if you choose that"
      - "Add filter > Select adduct, if you filter on one adduct"
      - "Read the number in the line 'matching records' under the table"
      - "Click Export to CSV to save the table"
    params:
      - { arg: dataset_id, label: Dataset }
      - { arg: database, label: Database, note: "The website shows name and version together, such as LipidMaps - 2017-12-12." }
      - { arg: fdr, label: FDR, ui_default: 0.1 }
      - { arg: exclude_off_sample, label: Show/hide off-sample annotations, ui_default: false }
      - { arg: adduct, label: Select adduct, ui_default: all }
    fidelity: exact
    evidence: { source: docs, test: annotations-lipidmaps-fdr10, note: "The website shows 414 matching records for LipidMaps - 2017-12-12 at FDR 10% for dataset 2022-08-16_10h14m23s. The tool gives 414. Checked by the onboarding agent on 2026-10-08, not by the scientist." }
    summary: "{metrics.n_annotations} annotations at FDR {fdr}"

  - tool: compare_fdr_counts
    route: "Annotations page > set Database > set FDR to 5%, then 10%, then 20% > read 'matching records' each time"
    steps:
      - "Open https://metaspace2020.org/annotations?ds={dataset_id}"
      - "Set the filter Database"
      - "Set the filter FDR to 5% and read the number of matching records"
      - "Set FDR to 10% and read the number"
      - "Set FDR to 20% and read the number"
    params:
      - { arg: dataset_id, label: Dataset }
      - { arg: database, label: Database }
      - { arg: exclude_off_sample, label: Show/hide off-sample annotations, ui_default: false }
    fidelity: exact
    evidence: { source: docs, test: fdr-counts-lipidmaps, note: "The 10 percent count was read on the website (414). The 5 and 20 percent counts come from the same API data and from the paper table of the benchmark folder, not from a second look at the website." }
    summary: "FDR 5/10/20 percent: {metrics.n_fdr_05} / {metrics.n_fdr_10} / {metrics.n_fdr_20} annotations"

  - tool: overlap_annotations
    route: "Annotations page > set Database and FDR > Export to CSV for each dataset > compare the formula and adduct columns in a spreadsheet"
    steps:
      - "For each dataset, open https://metaspace2020.org/annotations?ds=<id>"
      - "Set the filters Database and FDR"
      - "Click Export to CSV"
      - "Compare the columns formula and adduct of the files in a spreadsheet"
    params:
      - { arg: database, label: Database }
      - { arg: fdr, label: FDR, ui_default: 0.1 }
      - { arg: exclude_off_sample, label: Show/hide off-sample annotations, ui_default: false }
    fidelity: close
    difference: "The website has no overlap view. The overlap is done by hand on the exported files. The route was not run."
    evidence: { source: unverified, test: overlap-pinned, note: "Route not tested." }
    summary: "{metrics.n_in_all} of {metrics.n_in_union} ions are in all {metrics.n_datasets} datasets"

  - tool: get_ion_image
    route: "Annotations page > click the annotation row > Image viewer > Export image"
    steps:
      - "Open https://metaspace2020.org/annotations?ds={dataset_id}"
      - "Click the row of {formula}{adduct}"
      - "In the Image viewer, click Export image"
    params:
      - { arg: dataset_id, label: Dataset }
      - { arg: formula, label: Annotation }
      - { arg: adduct, label: Annotation }
      - { arg: hotspot_clipping, label: "Ion image controls > scale (Linear / Linear without hot-spot removal)", ui_default: true }
    fidelity: close
    difference: "The website draws the image in its own color scale with its own scale bar and exports with that. The tool uses viridis, scaled to the maximum. The pixel data and the size are the same. Route not compared pixel by pixel."
    evidence: { source: docs, test: ion-image-pinned }
    summary: "Saved the ion image of {ion}: {metrics.width} by {metrics.height} pixels"

checks:
  - id: fdr_stated
    description: Each annotation count must come with its FDR level.
    severity: error
    text: "The answer must state the FDR level for every annotation count, and must say that the level is a maximum (for example, at most 10 percent). An answer that gives a count with no FDR level fails."
  - id: database_stated
    description: Each annotation count must name the molecular database and its version.
    severity: warning
    text: "The answer must name the molecular database and its version for every annotation count. The count depends on the database."
  - id: not_identification
    description: Annotations are putative sum formulas, not identifications.
    severity: error
    text: "The answer must not call METASPACE annotations identified, confirmed or validated molecules. They are putative annotations at the level of the sum formula and the adduct. A formula can match many isomers. An answer that says lipids were identified, with no MS/MS, fails."
  - id: off_sample_kept
    description: The list or count keeps off-sample annotations.
    severity: warning
    rule:
      tool: list_annotations
      arg: exclude_off_sample
      op: "=="
      value: false
      message: "Off-sample annotations are in this list. METASPACE flags them as signal from outside the tissue. Say how many there are, or remove them."
  - id: high_fdr
    description: An FDR above 10 percent gives more false annotations.
    severity: warning
    rule:
      tool: list_annotations
      arg: fdr
      op: ">"
      value: 0.1
      message: "FDR above 10 percent keeps annotations that are more likely false. Do not use this list as a result without a reason."

tests:
  - id: search-group
    description: "Network test. The two Michael et al. 2022 mouse brain datasets of the Ellis group are in the search result, newest first. The ids and names come from bench/papers/alexandrov2019-metaspace/paper.md."
    calls:
      - { tool: search_datasets, args: { group: Ellis, submitter: Jesse, polarity: Positive, limit: 10 } }
    expect:
      - { path: metrics.n_found, min: 2 }
      - { path: "table.rows[0][0]", equals: "2022-08-16_12h31m33s" }
      - { path: "table.rows[0][1]", equals: MouseBrain_PlasmaPI_Pos_TIMS }
      - { path: "table.rows[1][0]", equals: "2022-08-16_10h14m23s" }
      - { path: "table.rows[1][1]", equals: MouseBrain_PlasmaPI_Pos20um }

  - id: info-pinned
    description: "Network test. Metadata of 2022-08-16_10h14m23s, a dataset of the published project Michael et al. 2022. The values match the website dataset card read on 2026-10-08."
    calls:
      - { tool: get_dataset_info, args: { dataset_id: "2022-08-16_10h14m23s" } }
    expect:
      - { path: data.name, equals: MouseBrain_PlasmaPI_Pos20um }
      - { path: data.organism, equals: Mouse }
      - { path: data.polarity, equals: Positive }
      - { path: data.analyzer, equals: qTOF }
      - { path: metrics.resolving_power, equals: 60000 }
      - { path: metrics.ppm, equals: 6 }
      - { path: "data.adducts[0]", equals: "+H" }

  - id: databases-list
    description: "Network test. The public database list has HMDB v4 and LipidMaps 2017-12-12, the databases of bench/papers/alexandrov2019-metaspace. The tool returns names (returns: text). The count grows when users publish databases, so the test pins the names, not the count."
    calls:
      - { tool: list_databases }
    expect:
      - { path: metrics.n_databases, min: 10 }
      - { path: table.rows, contains: ",HMDB,v4" }
      - { path: table.rows, contains: ",LipidMaps,2017-12-12" }

  - id: annotations-lipidmaps-fdr10
    description: "Network test. 414 annotations at FDR 10 percent in LipidMaps 2017-12-12 for 2022-08-16_10h14m23s; 26 are off-sample. The 414 was read on the website on 2026-10-08."
    calls:
      - { tool: list_annotations, args: { dataset_id: "2022-08-16_10h14m23s", database: "LipidMaps 2017-12-12", fdr: 0.1, exclude_off_sample: false, adduct: all } }
    expect:
      - { path: metrics.n_annotations, equals: 414 }
      - { path: metrics.n_off_sample_in_fdr_set, equals: 26 }
      - { path: table.n_rows, equals: 414 }

  - id: annotations-off-sample-removed
    description: "Network test. Removing the 26 off-sample annotations leaves 388. The number is derived from the two known numbers above (414 minus 26)."
    calls:
      - { tool: list_annotations, args: { dataset_id: "2022-08-16_10h14m23s", database: "LipidMaps 2017-12-12", fdr: 0.1, exclude_off_sample: true, adduct: all } }
    expect:
      - { path: metrics.n_annotations, equals: 388 }

  - id: fdr-counts-lipidmaps
    description: "Network test. LipidMaps 2017-12-12 counts at FDR 5, 10 and 20 percent: 144, 414, 903. Source - benchmark folder alexandrov2019-metaspace, computed on 2026-10-07. The 10 percent count was also read on the website."
    calls:
      - { tool: compare_fdr_counts, args: { dataset_id: "2022-08-16_10h14m23s", database: "LipidMaps 2017-12-12", exclude_off_sample: false } }
    expect:
      - { path: metrics.n_fdr_05, equals: 144 }
      - { path: metrics.n_fdr_10, equals: 414 }
      - { path: metrics.n_fdr_20, equals: 903 }

  - id: fdr-counts-hmdb
    description: "Network test. HMDB v4 counts at FDR 5, 10 and 20 percent: 14, 263, 819. Source - benchmark folder alexandrov2019-metaspace, computed on 2026-10-07."
    calls:
      - { tool: compare_fdr_counts, args: { dataset_id: "2022-08-16_10h14m23s", database: "HMDB v4", exclude_off_sample: false } }
    expect:
      - { path: metrics.n_fdr_05, equals: 14 }
      - { path: metrics.n_fdr_10, equals: 263 }
      - { path: metrics.n_fdr_20, equals: 819 }

  - id: overlap-pinned
    description: "Network test. The two Michael et al. 2022 datasets share ions in LipidMaps 2017-12-12 at FDR 10 percent. The counts per dataset (414, 191) come from the benchmark folder. The shared count is stable, not independent; it comes from a run of the tool."
    calls:
      - { tool: overlap_annotations, args: { dataset_ids: "2022-08-16_10h14m23s,2022-08-16_12h31m33s", database: "LipidMaps 2017-12-12", fdr: 0.1 } }
    expect:
      - { path: metrics.n_dataset_1, equals: 414 }
      - { path: metrics.n_dataset_2, equals: 191 }
      - { path: metrics.n_in_all, min: 1 }

  - id: ion-image-pinned
    description: "Network test. The ion image of C39H78NO8P+H (a PC 32:0 sum formula) has 350 by 489 pixels. The size is the image size of the dataset. This number is stable, not independent; it comes from a run of the tool."
    calls:
      - { tool: get_ion_image, args: { dataset_id: "2022-08-16_10h14m23s", formula: C39H78NO8P, adduct: "+H" } }
    expect:
      - { path: metrics.width, equals: 350 }
      - { path: metrics.height, equals: 489 }
      - { path: "outputs[0].path", contains: ".png" }

  - id: fdr-then-list
    description: "Network test with two tools in order. The count at FDR 10 percent from compare_fdr_counts equals the count from list_annotations."
    calls:
      - { tool: compare_fdr_counts, args: { dataset_id: "2022-08-16_12h31m33s", database: "LipidMaps 2017-12-12" }, save_as: counts }
      - { tool: list_annotations, args: { dataset_id: "2022-08-16_12h31m33s", database: "LipidMaps 2017-12-12", fdr: 0.1 } }
    expect:
      - { path: metrics.n_annotations, equals: 191 }
      - { path: saved.counts.metrics.n_fdr_10, equals: 191 }

  - id: fdr-not-allowed
    description: An FDR level that METASPACE does not compute fails before any network call, and the error names the valid levels.
    calls:
      - { tool: list_annotations, args: { dataset_id: "2022-08-16_10h14m23s", database: "LipidMaps 2017-12-12", fdr: 0.3 } }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "fdr must be one of 0.05, 0.1, 0.2, 0.5" }
