adapter:
  name: qgis
  field: geospatial
  file_types: [".geojson", ".gpkg", ".shp", ".tif"]
  title: QGIS Processing
  version: 0.1.1
  spec: "1"
  description: >
    Runs QGIS Processing algorithms from the command line with qgis_process. Each tool runs one
    algorithm and returns its numbers. The scientist can repeat each step in the QGIS Processing
    Toolbox or with the printed qgis_process command.
  authors: [Parker Smith]
  status: draft

program:
  name: QGIS
  version: "4.2.3"
  homepage: https://qgis.org
  docs:
    - https://docs.qgis.org/latest/en/docs/user_manual/processing/standalone.html
    - https://docs.qgis.org/latest/en/docs/user_manual/processing_algs/qgis/rasteranalysis.html
    - https://docs.qgis.org/latest/en/docs/user_manual/processing_algs/gdal/rasterprojections.html
  install: >
    Download the QGIS desktop app from https://qgis.org and put it in /Applications. The adapter runs the
    headless program qgis_process in QGIS*.app/Contents/MacOS. For an app in another folder, set
    CUVETTE_QGIS_PROCESS to the path of qgis_process. The tools start scripts/ga_qgis.py with python3, and the
    script uses only the Python standard library.
  citation:
    - text: QGIS.org. (2026). QGIS Geographic Information System (Version 4.2.3) [Computer software]. QGIS Association. https://doi.org/10.5281/zenodo.6139224
      doi: 10.5281/zenodo.6139224
      bibtex: |
        @software{qgis2026qgis,
          author    = {{QGIS.org}},
          title     = {{QGIS} Geographic Information System},
          version   = {4.2.3},
          year      = {2026},
          publisher = {QGIS Association},
          doi       = {10.5281/zenodo.6139224},
          url       = {https://qgis.org}
        }
    - text: "Graser, A., Sutton, T., & Bernasocchi, M. (2025). The QGIS project: Spatial without compromise. Patterns, 6(7), 101265. https://doi.org/10.1016/j.patter.2025.101265"
      doi: 10.1016/j.patter.2025.101265
      bibtex: |
        @article{graser2025qgis,
          author  = {Graser, Anita and Sutton, Tim and Bernasocchi, Marco},
          title   = {The {QGIS} project: Spatial without compromise},
          journal = {Patterns},
          year    = {2025},
          volume  = {6},
          number  = {7},
          pages   = {101265},
          doi     = {10.1016/j.patter.2025.101265}
        }

connection:
  kind: cli
  startup_timeout_s: 120
  call_timeout_s: 900

locate:
  env: CUVETTE_QGIS_PROCESS
  paths:
    - /Volumes/T7/guided-analysis/tools/qgis/QGIS*.app/Contents/MacOS/qgis_process
    - /Applications/QGIS*.app/Contents/MacOS/qgis_process
  which: [qgis_process]
  version_command: ["{program_path}", "--version"]
  version_pattern: 'QGIS (\d+\.\d+\.\d+)'
  identity: 'QGIS \d'

data_rules:
  cloud_visibility: all
  note: Maps of patients or of protected sites can show where a person lives. Set summaries if the data are personal.

decisions:
  - key: target_crs
    label: Target coordinate reference system
    kind: text
    group: Geometry
    help: >
      The coordinate reference system (CRS) of the output, as an EPSG code such as EPSG:4326 or
      EPSG:32615. It sets the units of the pixel size and of areas and distances. Degrees are
      not metres, so use a projected CRS for area or distance.
    essential: true
    owner: human
    stage: when_needed
    changes_conclusion: true
    links:
      - { tool: warp_raster, arg: target_crs }
      - { tool: reproject_layer, arg: target_crs }

  - key: resampling
    label: Resampling method
    kind: choice
    choices: [near, bilinear, cubic, cubicspline, lanczos, average, mode, max, min, med, q1, q3]
    default: near
    group: Geometry
    help: >
      How GDAL computes a new pixel value from the old pixels. near copies the closest value and
      is the only safe method for classes such as land cover. bilinear, cubic and lanczos blend
      values and suit continuous data such as elevation. average suits a coarser grid.
    essential: true
    owner: human
    stage: when_needed
    changes_conclusion: true
    links:
      - { tool: warp_raster, arg: resampling }
    sensitivity:
      options: [near, bilinear, average]
      tool: warp_raster
      compare: [metrics.width, metrics.height]
      max_runs: 3

  - key: nodata
    label: Nodata value for the output
    kind: text
    default: ""
    group: Data
    help: >
      The number that marks pixels with no data in the output raster. Empty keeps the value that
      the input file carries. A wrong value counts empty pixels as real data or hides real data.
    owner: human
    stage: when_needed
    changes_conclusion: true
    links:
      - { tool: warp_raster, arg: nodata }

  - key: pixel_size
    label: Output pixel size
    kind: text
    default: ""
    group: Geometry
    help: >
      The width and height of an output pixel, in the units of the target CRS (metres for UTM,
      degrees for EPSG:4326). Empty lets GDAL pick a size that keeps the pixel count close to the
      input. A larger size loses detail.
    owner: human
    stage: when_needed
    changes_conclusion: true
    links:
      - { tool: warp_raster, arg: pixel_size }

tools:
  - name: raster_statistics
    title: Raster layer statistics
    description: >
      Read the pixel count, min, max, mean, sum and standard deviation of one raster band with the
      QGIS algorithm native:rasterlayerstatistics. The standard deviation uses n - 1 in the divisor.
    read_only: true
    params:
      path: { type: string, minLength: 1, description: Absolute path of the raster file. }
      band: { type: integer, minimum: 1, description: "Band number (index, starting at 1). Default 1." }
    required: [path]
    command: ["python3", "{adapter_dir}/scripts/ga_qgis.py", "raster_statistics", "{path}", "--band", "{band}"]
    parse: json

  - name: zonal_statistics
    title: Zonal statistics
    description: >
      Compute statistics of the raster pixels inside each polygon with native:zonalstatisticsfb.
      QGIS counts a pixel if its center is inside the polygon. The result has one row for each polygon.
    params:
      raster: { type: string, minLength: 1, description: Absolute path of the raster file. }
      zones: { type: string, minLength: 1, description: Absolute path of the polygon file. }
      stats: { type: string, description: "Comma list of count, sum, mean, median, stdev, min, max, range, minority, majority, variety, variance. Default count,sum,mean,min,max." }
      band: { type: integer, minimum: 1, description: "Band number (index, starting at 1). Default 1." }
      id_field: { type: string, description: Polygon field that names each row. Leave out to number the rows from 1. }
    required: [raster, zones]
    outputs:
      result: { kind: file, ext: .gpkg, description: The polygons with the statistics columns. }
    command: ["python3", "{adapter_dir}/scripts/ga_qgis.py", "zonal_statistics", "{raster}", "{zones}", "--stats", "{stats}", "--band", "{band}", "--id-field", "{id_field}"]
    parse: json

  - name: reproject_layer
    title: Reproject a vector layer
    description: >
      Transform a vector file to a new CRS with native:reprojectlayer and write a GeoPackage. The
      result has the feature count and the new extent.
    params:
      path: { type: string, minLength: 1, description: Absolute path of the vector file. }
      target_crs: { type: string, minLength: 1, description: "Target CRS, such as EPSG:4326." }
    required: [path, target_crs]
    outputs:
      result: { kind: file, ext: .gpkg, description: The reprojected GeoPackage. }
    command: ["python3", "{adapter_dir}/scripts/ga_qgis.py", "reproject_layer", "{path}", "--target-crs", "{target_crs}"]
    parse: json

  - name: warp_raster
    title: Reproject a raster
    description: >
      Warp a raster to a new CRS with gdal:warpreproject, which runs gdalwarp. The result has the new
      size in pixels and the gdalwarp command that QGIS ran.
    params:
      path: { type: string, minLength: 1, description: Absolute path of the raster file. }
      target_crs: { type: string, minLength: 1, description: "Target CRS, such as EPSG:4326." }
      resampling: { type: string, enum: [near, bilinear, cubic, cubicspline, lanczos, average, mode, max, min, med, q1, q3], description: Resampling method. }
      nodata: { type: string, description: Nodata value of the output. }
      pixel_size: { type: string, description: Output pixel size in target CRS units. Leave out or empty to let GDAL choose. }
    required: [path, target_crs]
    outputs:
      result: { kind: file, ext: .tif, description: The reprojected GeoTIFF. }
    command: ["python3", "{adapter_dir}/scripts/ga_qgis.py", "warp_raster", "{path}", "--target-crs", "{target_crs}", "--resampling", "{resampling}", "--nodata", "{nodata}", "--pixel-size", "{pixel_size}"]
    parse: json

map:
  - tool: raster_statistics
    route: "QGIS: Processing Toolbox > Raster analysis > Raster layer statistics"
    params:
      - { arg: path, label: "Input layer" }
      - { arg: band, label: "Band number", ui_default: 1 }
    fidelity: exact
    evidence: { source: docs, test: stats_byte, note: "The command line and the dialog run the same algorithm." }
    summary: "{metrics.count} pixels, mean {metrics.mean}, stddev {metrics.std_dev} (n - 1)."

  - tool: zonal_statistics
    route: "QGIS: Processing Toolbox > Raster analysis > Zonal statistics"
    params:
      - { arg: raster, label: "Raster layer" }
      - { arg: zones, label: "Input layer" }
      - { arg: stats, label: "Statistics to calculate", ui_default: "count,sum,mean" }
      - { arg: band, label: "Raster band", ui_default: 1 }
    fidelity: exact
    evidence: { source: docs, test: zonal_centers, note: "The command line and the dialog run the same algorithm. A second method (numpy and shapely) gives the same counts." }
    summary: "{metrics.n_zones} zone(s). First zone: {metrics.count} pixels, mean {metrics.mean}."

  - tool: reproject_layer
    route: "QGIS: Processing Toolbox > Vector general > Reproject layer"
    params:
      - { arg: path, label: "Input layer" }
      - { arg: target_crs, label: "Target CRS" }
    fidelity: exact
    evidence: { source: docs, test: reproject_zones }
    summary: "{metrics.n_features} features in EPSG:{metrics.epsg}."

  - tool: warp_raster
    route: "QGIS: Processing Toolbox > GDAL > Raster projections > Warp (reproject)"
    params:
      - { arg: path, label: "Input layer" }
      - { arg: target_crs, label: "Target CRS" }
      - { arg: resampling, label: "Resampling method to use", ui_default: "Nearest Neighbour" }
      - { arg: nodata, label: "Nodata value for output bands", ui_default: "" }
      - { arg: pixel_size, label: "Output file resolution in target georeferenced units", ui_default: "" }
    fidelity: exact
    evidence: { source: docs, test: warp_size, note: "QGIS prints the gdalwarp command. The size equals the size of gdalwarp on the command line." }
    summary: "The output has {metrics.width} x {metrics.height} pixels."

checks:
  - id: crs_not_stated
    description: The report gives areas, distances or pixel sizes and does not name the CRS.
    severity: warning
    text: The report must name the CRS (EPSG code) of each raster and polygon file that it measures, and the unit of each pixel size, area or distance.
  - id: resampling_not_stated
    description: The report uses a warped raster and does not say which resampling method made it.
    severity: warning
    text: The report must state the resampling method of each warped raster and the reason for it.
  - id: stddev_kind_not_stated
    description: The report gives a standard deviation and does not say if it divides by n or by n - 1.
    severity: warning
    text: QGIS raster statistics divide by n - 1. GDAL gdalinfo divides by n. The report must say which one it gives.
  - id: target_crs_missing
    description: A layer was reprojected with no target CRS.
    severity: error
    rule:
      tool: reproject_layer
      arg: target_crs
      op: missing
      message: Ask the scientist for the target CRS.

tests:
  - id: stats_byte
    description: >
      byte.tif has 400 pixels, min 74, max 255, mean 126.765 (same as gdalinfo -stats). QGIS divides
      by n - 1, so its standard deviation is 22.957. GDAL divides by n and gives 22.928.
    data: [data/byte.tif]
    manual_route_checked: true
    calls:
      - { tool: raster_statistics, args: { path: "{adapter_dir}/data/byte.tif" } }
    expect:
      - { path: metrics.count, equals: 400 }
      - { path: metrics.min, equals: 74 }
      - { path: metrics.max, equals: 255 }
      - { path: metrics.mean, approx: 126.765, abs: 0.001 }
      - { path: metrics.std_dev, approx: 22.957, abs: 0.001 }

  - id: zonal_centers
    description: >
      Zone A covers the top-left 10 x 10 pixels: 100 pixels, mean 129.5 (numpy). Zone B is offset from
      the pixel grid: 42 pixels with a center inside, mean 135.0 (numpy and shapely).
    data: [data/byte.tif, data/zones.geojson]
    manual_route_checked: true
    calls:
      - { tool: zonal_statistics, args: { raster: "{adapter_dir}/data/byte.tif", zones: "{adapter_dir}/data/zones.geojson", id_field: id } }
    expect:
      - { path: table.n_rows, equals: 2 }
      - { path: "data.data.zones[0].count", equals: 100 }
      - { path: "data.data.zones[0].mean", approx: 129.5, abs: 0.0001 }
      - { path: "data.data.zones[1].count", equals: 42 }
      - { path: "data.data.zones[1].mean", approx: 135.0, abs: 0.0001 }

  - id: reproject_zones
    description: The two polygons move to EPSG:4326. The extent matches pyproj transform_bounds (-117.64205 to -117.63552 degrees east).
    data: [data/zones.geojson]
    calls:
      - { tool: reproject_layer, args: { path: "{adapter_dir}/data/zones.geojson", target_crs: "EPSG:4326" } }
    expect:
      - { path: metrics.n_features, equals: 2 }
      - { path: metrics.epsg, equals: 4326 }
      - { path: metrics.xmin, approx: -117.64205, abs: 0.00001 }
      - { path: metrics.xmax, approx: -117.63552, abs: 0.00001 }

  - id: warp_size
    description: >
      byte.tif warped to EPSG:4326 is 22 x 18 pixels with the GDAL pixel size, and 13 x 11 pixels with
      a 0.001 degree pixel. Both sizes equal the output of gdalwarp on the command line.
    data: [data/byte.tif]
    manual_route_checked: true
    calls:
      - { tool: warp_raster, args: { path: "{adapter_dir}/data/byte.tif", target_crs: "EPSG:4326" }, save_as: d }
      - { tool: warp_raster, args: { path: "{adapter_dir}/data/byte.tif", target_crs: "EPSG:4326", resampling: bilinear, pixel_size: "0.001" } }
    expect:
      - { path: saved.d.metrics.width, equals: 22 }
      - { path: saved.d.metrics.height, equals: 18 }
      - { path: metrics.width, equals: 13 }
      - { path: metrics.height, equals: 11 }

  - id: zonal_bad_statistic
    description: An unknown statistic name stops the tool.
    data: [data/byte.tif, data/zones.geojson]
    calls:
      - { tool: zonal_statistics, args: { raster: "{adapter_dir}/data/byte.tif", zones: "{adapter_dir}/data/zones.geojson", stats: "average" } }
    expect:
      - { path: ok, equals: false }
