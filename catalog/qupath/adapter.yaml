      - { path: metrics.n_positive, equals: 24 }
      - { path: metrics.positive_percent, approx: 8.3045, rel: 0.0001 }

  - id: positive_region
    gui: true
    description: >
      A region of 150 by 150 pixels at 0.4537 um is 150 x 150 x 0.4537 x 0.4537 / 1e6 = 0.00463148
      mm2 (arithmetic). The cell and positive counts are from the first run of this tool, not
      published numbers.
    data: [data/ki67_crop.png]
    calls:
      - { tool: detect_positive_cells, args: { input: "{adapter_dir}/data/ki67_crop.png", image_type: "Brightfield (H-DAB)", pixel_width_um: 0.4537, region: "0,0,150,150" } }
    expect:
      - { path: metrics.region_area_mm2, approx: 0.00463148, rel: 0.00001 }
      - { path: metrics.n_cells, equals: 67 }
      - { path: metrics.n_positive, equals: 4 }

  - id: open_missing_file
    gui: true
    description: An image file that does not exist fails, and the error names the file. The text comes from gaLoad in lib.groovy.
    calls:
      - { tool: open_image, args: { input: "{adapter_dir}/data/no_such_image.tif" } }
    expect:
      - { path: ok, equals: false }
      - { path: error, contains: "File not found:" }
      - { path: error, contains: "no_such_image.tif" }
