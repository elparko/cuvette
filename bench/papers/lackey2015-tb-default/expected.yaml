tool: statsmodels Logit and SciPy chi2_contingency, through the biostats adapter
adapter_kind: python
data:
  - /Volumes/T7/guided-analysis/data/lackey2015-tb-default/tb_default.csv
decisions:
  chi_square: "Pearson, no continuity correction"
  logistic_covariates: "drug_use, bmi, mdr_tb, alcohol_weekly, hiv_status, secondary_education"
  reference_levels: "No, Normal, No, No, Negative, Yes (secondary school completed)"
  ci: Wald
  alpha: 0.05
expected:
  - {description: "patients", value: 1233, tolerance: 0, source: "paper: 1233 in the final analyses"}
  - {description: "defaulted", value: 127, tolerance: 0, source: "paper: 127 (10%) defaulted"}
  - {description: "chi-square p age", value: 0.00604, tolerance: 0.0002, source: "paper Table 2: .006"}
  - {description: "chi-square p sex", value: 0.0000395, tolerance: 0.000005, source: "paper Table 2: < .001"}
  - {description: "chi-square p marital", value: 0.6815, tolerance: 0.001, source: "paper Table 2: .681"}
  - {description: "chi-square p poverty", value: 0.03436, tolerance: 0.0005, source: "paper Table 2: .034"}
  - {description: "OR drug use", value: 4.7816, tolerance: 0.005, source: "paper: 4.78 (3.05-7.49)"}
  - {description: "OR drug use lower", value: 3.0522, tolerance: 0.005, source: "paper: 3.05"}
  - {description: "OR drug use upper", value: 7.4907, tolerance: 0.005, source: "paper: 7.49"}
