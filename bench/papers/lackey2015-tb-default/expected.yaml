notes: |
  R 4.6.1 glm with Wald intervals (confint.default) and chisq.test(correct = FALSE) give every value (check.R, check.out). The biostats tools (statsmodels Logit, SciPy chi2_contingency) give the same values.
  The paper used Stata 12.1. Its tabulate, chi2 has no continuity correction. The Yates correction gives p 0.0465 for poverty, not the printed .034, so the correction decision matters. It is a trap item.
  The analysis set is the 1233 patients with an outcome and complete data for the 12 variables of the original multivariable model (Fig 1 and the Missing data section). fetch.sh makes it. A complete-case set for the 6 final covariates only holds more patients and gives other odds ratios.
  The multivariable p-values of BMI (.020) and HIV status (< .001) in Table 2 are joint tests. The likelihood-ratio tests give .026 and .0009. They are not items.
  The paper selected the final covariates by backward selection. The request gives the final covariates. The diabetes odds ratio (exact logistic regression) is not an item.
