data:
  source: >-
    Dryad dataset of the paper, copied on Zenodo record 4992464 (Lima TB Treatment Default Data.xls). fetch.sh drops
    the patients with no outcome and with a missing value in the 12 variables of the original model (Fig 1), renames
    the columns and adds default (1 for the outcome Default).
  url: https://zenodo.org/records/4992464
  license: CC0 1.0 public domain dedication, from the Zenodo record. Ages are in groups; the file has no names. The paper is CC BY 4.0.
  size: 380 KB Excel file, 1293 rows and 18 columns. The CSV has 1233 rows and 19 columns.
