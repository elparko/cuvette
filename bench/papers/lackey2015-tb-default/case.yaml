kind: research paper
short: Lackey 2015
field: Statistics
program: statsmodels and SciPy (Python), through the biostats adapter
citation:
  authors: Lackey B, Seas C, Van der Stuyft P, Otero L
  title: "Patient characteristics associated with tuberculosis treatment default: a cohort study in a high-incidence area of Lima, Peru"
  venue: PLOS ONE 10(6):e0128541
  year: 2015
  doi: 10.1371/journal.pone.0128541
related:
  - text: "Data: Lackey B et al. Data from: Patient characteristics associated with tuberculosis treatment default. Dryad, CC0. The benchmark downloads the copy on Zenodo, record 4992464."
    url: https://zenodo.org/records/4992464
measured: >-
  A prospective cohort of 1294 adults with smear-positive pulmonary tuberculosis in Lima, Peru, 2010 to 2011. The
  analysis holds 1233 patients with an outcome and complete data; 127 defaulted. The paper tests each risk factor
  with a chi-square test and reports the odds ratios of a multivariable logistic regression model.
instruction: >-
  Test the association of default with age group, sex, marital status and poverty. Fit a multivariable logistic
  regression of default on drug use, BMI, MDR treatment, weekly alcohol, HIV status and secondary education, and give
  each adjusted odds ratio with its 95% confidence interval.
instruction_basis: >-
  The Statistical analysis section and Table 2. Bivariate chi-square tests, then a multivariable logistic regression
  in Stata 12.1. The final model holds the six covariates of the request.
answers:
  replicate:
    decision: Unit of replication
    value: the patient, one row for each patient
    source: The cohort design. Each patient gives one outcome.
  alpha:
    decision: Significance level
    value: 0.05
    source: The paper reports 95% confidence intervals and calls p below .05 significant.
  chi_square_correction:
    decision: Yates continuity correction for a 2x2 chi-square test
    value: false
    source: >-
      The paper used Stata 12.1; tabulate, chi2 gives the Pearson test with no correction. The uncorrected test
      reproduces the printed p for poverty (.034). The Yates test gives .046.
  logistic_covariates:
    decision: Covariates of the logistic model
    value: drug_use, bmi, mdr_tb, alcohol_weekly, hiv_status, secondary_education
    source: Table 2, the variables with a multivariable odds ratio.
  logistic_event:
    decision: Outcome value that counts as the event
    value: "1"
    source: Table 2 compares default with all other outcomes. The column default is 1 for default.
  reference_levels:
    decision: Reference level of each categorical covariate
    value: drug_use=No, bmi=Normal, mdr_tb=No, alcohol_weekly=No, hiv_status=Negative, secondary_education=Yes
    source: Table 2, the rows with an odds ratio of 1.00.
  fisher_alternative:
    decision: Sidedness of the Fisher exact test
    value: two-sided
    source: The request asks for no Fisher test. The default value.
