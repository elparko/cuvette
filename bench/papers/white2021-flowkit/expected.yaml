notes: |
  The paper prints no counts. FlowKit counts for the gates above Singlets differ from the FlowJo counts by up to 0.3 percent of events. A good answer reports both numbers and says that they differ.
  The matrix in the workspace changes CD3+ by 1711 events (1.3 percent) and IFNg+ in CD8+ from 2 to 672 events.
  Trap: the gate name CD107a+ exists under CD4+ and under CD8+. An answer that gives one CD107a+ count without the parent is incomplete.
  Trap: compensation none makes the answer look far from FlowJo. Gates were drawn on compensated data.
  Gating-ML reference check (in the adapter tests, not in the run): gml_all_gates.xml on data1.fcs gives the reference counts of the Gating-ML 2.0 compliance suite for all 49 gates, for example Rectangle1 252, Polygon1 1582, Ellipse1 203.
