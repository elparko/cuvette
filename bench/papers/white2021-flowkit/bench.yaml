adapters: [flowkit]
prompt: |
  The FCS file is {data}/white2021-flowkit/src/data/8_color_data_set/fcs_files/101_DEN084Y5_15_E01_008_clean.fcs and the FlowJo workspace is {data}/white2021-flowkit/src/data/8_color_data_set/8_color_ICS.wsp . 1. I have a flow cytometry file from a T cell stimulation experiment and the FlowJo workspace that someone gave me. How many events are in the file, and how many of them are CD3+ T cells? 2. How many of the T cells are CD4 and how many are CD8? Do your counts match what FlowJo reported? 3. What happens to the counts if nobody compensated the data? Which gate changes the most?
setup: {}
answers:
  gating_file: /Volumes/T7/guided-analysis/data/white2021-flowkit/src/data/8_color_data_set/8_color_ICS.wsp
  compensation: gating_file
  free_compensation: none
  compensation_matrix: ""
  control_sample: ""
  transform: logicle
  transform_t: 262144
  transform_w: 0.5
  transform_m: 4.5
  transform_a: 0
allow: all
timeout_s: 900
data:
  - white2021-flowkit/src/data/8_color_data_set/fcs_files/101_DEN084Y5_15_E01_008_clean.fcs
  - white2021-flowkit/src/data/8_color_data_set/8_color_ICS.wsp
