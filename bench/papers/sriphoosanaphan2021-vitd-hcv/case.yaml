data:
  source: >-
    Dryad dataset 10.5061/dryad.573n5tb4h, copied on Zenodo record 4404285. fetch.sh converts the Excel sheet
    to one CSV file. It renames the column Group to arm (A is vitamin_d, B is placebo) and adds the columns
    VD_change, AST_change, ALT_change, TGF_change, TIMP_change, MMP_change and P3NP_change (week 6 minus
    baseline), because compare_two_groups reads one outcome column. The readme does not name the arms. The
    group sizes, the sex counts and the means of each group match Tables 2 and 3 of the paper.
  url: https://zenodo.org/records/4404285
  license: >-
    CC0 1.0 public domain dedication, from the Dryad and Zenodo records. The file has a case number, sex and an
    age range for each patient, and no names. The paper is CC BY 4.0.
  size: 20 KB Excel file, 75 rows and 24 columns. The CSV has 75 rows and 31 columns.
