kind: research paper
short: Sriphoosanaphan 2021
field: Statistics
program: SciPy (Python), through the biostats adapter
citation:
  authors: Sriphoosanaphan S, Thanapirom K, Kerr SJ, Suksawatamnuay S, Thaimai P, Sittisomwong S, Sonsiri K, Srisoonthorn N, Teeratorn N, Tanpowpong N, Chaopathomkul B, Treeprasertsuk S, Poovorawan Y, Komolmit P
  title: >-
    Effect of vitamin D supplementation in patients with chronic hepatitis C after direct-acting antiviral
    treatment: a randomized, double-blind, placebo-controlled trial
  venue: PeerJ 9:e10709
  year: 2021
  doi: 10.7717/peerj.10709
related:
  - text: "Data: Komolmit P. Effect of vitamin D supplementation in patients with chronic hepatitis C after direct-acting antiviral treatment. Dryad (2020), CC0. The benchmark downloads the copy on Zenodo, record 4404285."
    doi: 10.5061/dryad.573n5tb4h
  - text: "Thai Clinical Trials Registry TCTR20171206003."
measured: >-
  The trial randomized 75 patients with chronic hepatitis C, a sustained virological response after
  direct-acting antivirals, liver fibrosis and a serum 25(OH)D below 30 ng/mL. 37 patients got ergocalciferol
  and 38 got placebo for 6 weeks. The trial measured serum 25(OH)D and four markers of liver fibrogenesis
  (TGF-beta1, TIMP-1, MMP-9 and P3NP) at baseline and at week 6. The primary analysis compares the change from
  baseline between the arms with an independent t-test.
instruction: >-
  Did vitamin D raise 25(OH)D, and did it change the four fibrosis markers compared with placebo? For each,
  give the difference in the mean change from baseline, vitamin D minus placebo, with a 95% confidence
  interval and a p-value.
instruction_basis: >-
  The Statistical analysis section and Table 3. The paper reports the mean difference in the change from
  baseline to week 6, vitamin D against placebo, with a 95% confidence interval and a p-value from the
  independent t-test.
answers:
  replicate:
    decision: Unit of replication
    value: the patient, one row for each patient
    source: Patient characteristics section. Each of the 75 randomized patients gives one change for each marker.
  alpha:
    decision: Significance level
    value: 0.05
    source: Sample size calculation section. The trial used a two-sided significance level of 5%.
  paired:
    decision: Paired or unpaired test
    value: false
    source: >-
      Statistical analysis section. The test compares the change in the vitamin D arm with the change in the
      placebo arm. The arms hold different patients. The pairing of baseline and week 6 is already in the
      change column.
  two_group_test:
    decision: Test family for two groups
    value: t-test
    source: >-
      Statistical analysis section, "the independent t-test". The quantile regression in Table 4 is a
      sensitivity analysis.
  equal_variance:
    decision: Equal variances for an unpaired test
    value: true
    source: >-
      Not stated in the paper. The paper used Stata 16.1, whose ttest command assumes equal variances by
      default. The Student test reproduces the printed upper bound for 25(OH)D (26.4). The Welch test gives 26.5.
  alternative:
    decision: Sidedness
    value: two-sided
    source: Sample size calculation section, "a 2-sided significance level of 5%".
