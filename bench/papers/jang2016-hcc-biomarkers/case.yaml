kind: research paper
short: Jang 2016
field: Statistics
program: pROC (R), through the proc adapter
citation:
  authors: Jang ES, Jeong S-H, Kim J-W, Choi YS, Leissner P, Brechot C
  title: >-
    Diagnostic performance of alpha-fetoprotein, protein induced by vitamin K absence, osteopontin, Dickkopf-1 and its
    combinations for hepatocellular carcinoma
  venue: PLOS ONE 11(3):e0151069
  year: 2016
  doi: 10.1371/journal.pone.0151069
related:
  - text: "Data: Jang ES et al. Data from: Diagnostic performance of alpha-fetoprotein, PIVKA-II, osteopontin, Dickkopf-1 and its combinations for hepatocellular carcinoma. Dryad, CC0. The benchmark downloads the copy on Zenodo, record 4952129."
    url: https://zenodo.org/records/4952129
measured: >-
  A case-control study of 208 patients with hepatocellular carcinoma and 193 patients with liver cirrhosis. The study
  measured serum AFP, PIVKA-II, osteopontin and Dickkopf-1, and reports the AUC of each marker with a 95% confidence
  interval (DeLong, pROC in R), and the sensitivity and specificity at fixed cut-offs.
instruction: >-
  Give the AUC of each of the four markers with a 95% confidence interval, and the sensitivity and specificity at the
  cut-offs AFP 20 ng/mL, PIVKA-II 10 ng/mL, OPN 100 ng/mL and DKK-1 500 pg/mL.
instruction_basis: >-
  The abstract and the Results section, "Diagnostic performance of each biomarker". The paper gives the AUC with its
  95% CI for each marker, HCC against cirrhosis, and the sensitivity and specificity at these cut-offs.
answers:
  positive_class:
    decision: Outcome value of the patients with the disease
    value: "1"
    source: The readme of the data and the group sizes. HCC_studyGr has 208 rows with 1 (HCC) and 193 with 0 (cirrhosis).
  direction:
    decision: Direction
    value: higher
    source: All four markers are higher in HCC (Results, median levels, p < 0.001).
  threshold_rule:
    decision: Rule for the best threshold
    value: closest.topleft
    source: Methods, "the level showing the minimum distance to the top-left corner of each ROC curve". The request uses the published cut-offs.
  auc_ci_method:
    decision: Confidence interval of the AUC
    value: delong
    source: Methods, the DeLong method in the pROC package.
  prevalence:
    decision: Prevalence for PPV and NPV
    value: sample
    source: The request asks for no PPV or NPV.
  alpha:
    decision: Significance level
    value: 0.05
    source: The paper gives 95% confidence intervals.
