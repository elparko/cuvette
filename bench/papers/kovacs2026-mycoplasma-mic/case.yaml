data:
  source: >-
    Supplementary Table 1 of the paper, sheet 1. fetch.sh downloads the workbook from the Springer static content server and
    writes mycoplasma_mics.csv: the strain, the species and the MIC of nine drugs, with ASCII limit signs.
  url: https://www.nature.com/articles/s41598-026-39804-w
  license: CC BY 4.0
  size: 23 KB Excel workbook with 110 strains
