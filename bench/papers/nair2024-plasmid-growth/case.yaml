data:
  source: >-
    figshare record 10.6084/m9.figshare.25400194, file Bioscreen_data.xlsx, sheet STR-R. fetch.sh writes strr_od.csv
    (time in hours and the OD600 of 84 wells, W01 to W84, in the order of the sheet) and strr_design.csv (the block, the
    host and the plasmid of each well). Figure_1_2.xlsx goes to the reference folder.
  url: https://figshare.com/articles/dataset/25400194
  license: CC BY 4.0, from the figshare record. The paper is CC BY 4.0.
  size: 939 KB Excel workbook with 3 sheets. strr_od.csv has 541 readings of 84 wells.
