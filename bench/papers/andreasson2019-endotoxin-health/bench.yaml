adapters: [biostats]
prompt: |
  In a randomized, double-blind experiment, 52 healthy adults got an injection of endotoxin (lipopolysaccharide, LPS, 0.6 ng/kg) or placebo. They rated their current health (1 very poor to 7 excellent) before the injection, at 90 minutes and at 270 minutes. The file {data}/andreasson2019-endotoxin-health/endotoxin_exp2_current.csv has one row for each rating, with the columns id (the subject), time (1 baseline, 2 at 90 minutes, 3 at 270 minutes), lps (1 LPS, 0 placebo) and current. Did LPS make current health worse, compared with placebo, at 90 and at 270 minutes? Fit a model with condition, time and their interaction, and give me each coefficient. The file {data}/andreasson2019-endotoxin-health/endotoxin_exp2_general.csv has the general health rating (1 very poor to 5 very good) at 90 minutes, one row for each subject. Is general health worse after LPS than after placebo? Give me the p-value. Write every number in your final answer text.
answers:
  replicate: "repeated measures on the same subjects (model the subject)"
  alpha: 0.05
  model_formula: "current ~ C(lps) * C(time)"
  random_effects: "1"
  reml: false
  paired: false
  two_group_test: wilcoxon
  equal_variance: false
  alternative: two-sided
allow: all
data:
  - andreasson2019-endotoxin-health/endotoxin_exp2_current.csv
  - andreasson2019-endotoxin-health/endotoxin_exp2_general.csv
items:
  - {key: n_ratings, description: "Current health ratings in the model", value: 151, exact: true, in_answer: false, tool: fit_mixed_model}
  - {key: n_subjects, description: "Subjects in the model", value: 52, exact: true, in_answer: false, tool: fit_mixed_model}
  - {key: intercept, description: "Intercept (placebo at baseline)", value: 6.238, tolerance: 0.005, tool: fit_mixed_model}
  - {key: coef_lps, description: "LPS at baseline", value: 0.020, tolerance: 0.005, tool: fit_mixed_model}
  - {key: coef_time2, description: "Time 90 minutes, placebo", value: -0.619, tolerance: 0.005, tool: fit_mixed_model}
  - {key: coef_time3, description: "Time 270 minutes, placebo", value: -0.218, tolerance: 0.005, tool: fit_mixed_model}
  - {key: coef_lps_time2, description: "LPS by 90 minutes interaction", value: -1.786, tolerance: 0.005, tool: fit_mixed_model}
  - {key: coef_lps_time3, description: "LPS by 270 minutes interaction", value: -0.906, tolerance: 0.005, tool: fit_mixed_model}
  - {key: se_lps_time2, description: "SE of the LPS by 90 minutes interaction, random intercept, ML", value: 0.3157, tolerance: 0.001, in_answer: false, tool: fit_mixed_model}
  - {key: se_lps_time2_ols_trap, description: "SE of the LPS by 90 minutes interaction, rows as independent (trap)", value: 0.4456, tolerance: 0.001, in_answer: false, trap: true}
  - {key: mannwhitney_p, description: "Mann-Whitney p, general health at 90 minutes", value: 0.00416, tolerance: 0.0005, tool: compare_two_groups}
  - {key: t_p_general_trap, description: "Welch t-test p, general health (trap result)", value: 0.00109, tolerance: 0.0002, in_answer: false, trap: true}
