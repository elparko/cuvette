tool: lifelines (CoxPHFitter, KaplanMeierFitter)
adapter_kind: python
data:
  - /Volumes/T7/guided-analysis/data/rossi1980-recidivism/rossi.csv
decisions:
  covariates: "fin, age, race, wexp, mar, paro, prio"
  ties: efron
  alpha: 0.05
  strata: none
  replication_unit: "man (432 rows, one per man)"
expected:
  - {description: "subjects", value: 432, tolerance: 0, source: "data"}
  - {description: "events (arrests)", value: 114, tolerance: 0, source: "data"}
  - {description: "Cox coefficient fin", value: -0.3794, tolerance: 0.0005, source: "lifelines docs, -0.38 to two digits; four digits computed with lifelines 0.30.3"}
  - {description: "Cox coefficient age", value: -0.0574, tolerance: 0.0005, source: "lifelines docs, -0.06 to two digits; four digits computed"}
  - {description: "Cox coefficient prio", value: 0.0915, tolerance: 0.0005, source: "lifelines docs, 0.09 to two digits; four digits computed"}
  - {description: "hazard ratio fin", value: 0.684, tolerance: 0.002, source: "computed"}
  - {description: "p for fin", value: 0.0474, tolerance: 0.001, source: "computed"}
  - {description: "concordance", value: 0.64, tolerance: 0.005, source: "lifelines docs, 0.64; computed 0.6403"}
  - {description: "log-rank chi-square by fin", value: 3.838, tolerance: 0.01, source: "computed"}
  - {description: "log-rank p by fin", value: 0.0501, tolerance: 0.001, source: "computed"}
  - {description: "proportional hazards test p for age (fails)", value: 0.0007, tolerance: 0.0005, source: "computed, lifelines proportional_hazard_test with rank transform"}
notes: |
  Values were computed by running the code. They were not read from the 1980 book.
  Trap: the log-rank test by fin alone is borderline (p = 0.0501). The adjusted Cox model gives p = 0.047. Both sit near alpha 0.05. The answer must not call one result a sure effect.
  Trap: the age covariate breaks the proportional hazards assumption (p = 0.0007). The answer must report it.
  Trap: censored men (arrest = 0) are not events.
