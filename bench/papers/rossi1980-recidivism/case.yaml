kind: tool tutorial or test suite
short: Rossi 1980
field: Statistics
program: lifelines (Python), through the biostats adapter
citation:
  authors: Rossi PH, Berk RA, Lenihan KJ
  title: "Money, Work, and Crime: Experimental Evidence"
  venue: Academic Press, New York (book)
  year: 1980
  url: https://vincentarelbundock.github.io/Rdatasets/doc/carData/Rossi.html
related:
  - text: >-
      lifelines documentation, section on survival regression. It fits a Cox model to these data and prints
      the summary. Source of the subject count, the event count and the concordance.
    url: https://lifelines.readthedocs.io/en/latest/Survival%20Regression.html
  - text: >-
      lifelines documentation, notebook on the proportional hazards assumption. It tests each covariate on
      these data. Source of the proportional hazards test p-value for age.
    url: https://lifelines.readthedocs.io/en/latest/jupyter_notebooks/Proportional%20hazard%20assumption.html
  - text: >-
      Fox J, Weisberg S. Cox Proportional-Hazards Regression for Survival Data in R. Appendix to An R
      Companion to Applied Regression, 3rd edition, revision of 2023-01-31. Section 3.2 fits the same Cox
      model with R survival and prints the coefficients to four decimals. Source of the Cox coefficients,
      the hazard ratio and the p-value for fin.
    url: https://www.john-fox.ca/Companion/appendices/Appendix-Cox-Regression.pdf
measured: >-
  The study followed 432 men for one year after their release from Maryland state prisons in the 1970s.
  Half the men got financial aid by random assignment. The study measured the time to the first re-arrest.
  The lifelines documentation fits a Cox proportional hazards model to these data with seven background
  covariates. The question is if financial aid lowers the hazard of re-arrest.
instruction: >-
  I followed 432 men for a year after release from prison. Some got financial aid. Does financial aid reduce
  re-arrest? Give me the effect size with a confidence interval and a p-value, adjusted for age, race, work
  experience, marriage, parole and prior convictions. Tell me how well the model separates early from late
  arrests, and if the model assumptions hold.
instruction_basis: >-
  The survival regression section of the lifelines documentation, which fits a Cox model with all covariates.
  The question about the assumptions comes from the lifelines notebook on the proportional hazards test.
answers:
  replicate:
    decision: Unit of replication
    value: the man, one row for each man
    source: The data have one row for each of the 432 men.
  alpha:
    decision: Significance level
    value: 0.05
    source: Not in the documentation as a choice. The lifelines summary uses 95 percent confidence intervals by default.
  cox_covariates:
    decision: Covariates in the Cox model
    value: fin, age, race, wexp, mar, paro, prio
    source: Survival regression section. The example fits all the columns except the time and the event.
  ties:
    decision: Method for tied event times
    value: Efron
    source: Not shown as a choice in the example. The CoxPHFitter class of lifelines handles ties with the Efron method.
  cox_strata:
    decision: Strata in the Cox model
    value: none
    source: >-
      Survival regression section. The main model has no strata. The notebook on the proportional hazards
      assumption shows strata as one fix when a covariate fails the test.
items:
  subjects:
    source: tutorial
    where: Survival regression section, the Cox model summary. The number of observations is 432.
  events:
    source: tutorial
    where: Survival regression section, the Cox model summary. The number of events is 114.
  coef_fin:
    source: published
    where: >-
      Fox J, Weisberg S. Cox Proportional-Hazards Regression for Survival Data in R, an appendix to An R
      Companion to Applied Regression, 3rd edition (Sage 2019), revision of 2023-01-31, Section 3.2,
      summary(mod.allison). It prints -0.3794 for finyes. The lifelines documentation gives a rounded value
      only (-0.38).
    check: R survival 3.8.6 coxph with Efron ties gives -0.3794 (check_cox.R).
  coef_age:
    source: published
    where: >-
      Fox and Weisberg, Cox regression appendix (revision of 2023-01-31), Section 3.2, summary(mod.allison).
      It prints -0.0574 for age.
    check: R survival 3.8.6 coxph gives -0.0574 (check_cox.R).
  coef_prio:
    source: published
    where: >-
      Fox and Weisberg, Cox regression appendix (revision of 2023-01-31), Section 3.2, summary(mod.allison).
      It prints 0.0915 for prio.
    check: R survival 3.8.6 coxph gives 0.0915 (check_cox.R).
  hazard_ratio_fin:
    source: published
    where: >-
      Fox and Weisberg, Cox regression appendix (revision of 2023-01-31), Section 3.2, summary(mod.allison).
      It prints exp(coef) 0.6843 for finyes, with a 95% interval of 0.470 to 0.996.
    check: R survival 3.8.6 coxph gives 0.6843 (check_cox.R).
  p_fin:
    source: published
    where: >-
      Fox and Weisberg, Cox regression appendix (revision of 2023-01-31), Section 3.2, summary(mod.allison).
      It prints Pr(>|z|) 0.0474 for finyes.
    check: R survival 3.8.6 coxph gives 0.0474 (check_cox.R).
  concordance:
    source: tutorial
    where: >-
      Survival regression section, the Cox model summary. The concordance is 0.64. The benchmark run gives
      0.6403.
    check: R survival 3.8.6 coxph gives 0.6403 (check_cox.R). Fox and Weisberg (Section 3.2) also print 0.64.
  logrank_chi2_fin:
    source: computed
    tool: lifelines 0.30.3 logrank_test
    where: Not in the documentation. The benchmark authors compared the two aid groups with a log-rank test.
    independence: independent
    check: R survival 3.8.6 survdiff gives 3.8376 (check_cox.R).
  logrank_p_fin:
    source: computed
    tool: lifelines 0.30.3 logrank_test
    where: Not in the documentation. The p-value is 0.0501, just above 0.05.
    independence: independent
    check: R survival 3.8.6 survdiff gives a chi-square of 3.8376 and p 0.0501 (check_cox.R).
  ph_test_p_age:
    source: tutorial
    where: >-
      lifelines documentation, notebook Testing the proportional hazard assumptions (read on 2026-10-08).
      check_assumptions on this model prints a rank-transform test statistic of 11.45 for age and the advice
      text 'p-value is 0.0007'. The standalone proportional_hazard_test with time_transform='rank' prints
      11.453 and a rounded p of 0.001.
    check: >-
      A hand calculation in R of the Grambsch and Therneau (1994) approximation, from the scaled Schoenfeld
      residuals of survival 3.8.6, gives a chi-square of 11.157 and p 0.00084 (check_cox.R). The cox.zph test
      of survival 3.x is a different test. It gives p 0.0145 with the km transform and p 0.34 with the rank
      transform.
data:
  source: Dataset rossi from the lifelines package (load_rossi). The same data are carData::Rossi in R.
  url: https://raw.githubusercontent.com/CamDavidsonPilon/lifelines/master/lifelines/datasets/rossi.csv
  license: >-
    The lifelines package is under the MIT License. The data come from a published 1980 study and have no
    names or identifiers.
  size: 8.7 KB, 432 rows, 9 columns
