notes: |
  The printed values are in "All plates analysis.csv" of the OSF registration (Figure 5F-G). The summary table goes to the reference folder.
  All ten 10 µl plates reproduce from the first read. At 20 µl, plates 2, 4, 6, 7, 8, 9 and 10 reproduce.
  Plate 1, 20 µl: the printed mean is 1327 (computed 1337.4); the printed Z' 0.73 is close to the computed 0.736, so it is not an item.
  Plates 3 and 5, 20 µl: the printed means (1434 and 1629) are not the means of the five positive wells (1728.8 and 1689.6). The Z' values (0.65 and 0.83) do not reproduce. They are reference items.
  Z' does not change with a blank subtraction, because the blank shifts both means by the same amount.
