kind: research paper
short: Cooley 2020
field: Plate assay quality (Z' factor)
program: drc adapter, normalize_plate (R arithmetic). The paper used Excel.
citation:
  authors: Cooley R, Kara N, Hui NS, Tart J, Roustan C, George R, Hancock DC, Binkowski BF, Wood KV, Ismail M, Downward J
  title: Development of a cell-free split-luciferase biochemical assay as a tool for screening for inhibitors of challenging protein-protein interaction targets
  venue: Wellcome Open Research 5:20
  year: 2020
  doi: 10.12688/wellcomeopenres.15675.1
related:
  - text: "Data: OSF registration MGKQV, CC BY 4.0. fetch.sh downloads the ten plate files of Figure 5F-G and the summary table."
    doi: 10.17605/OSF.IO/MGKQV
measured: >-
  The study built a cell-free split-luciferase assay for the KRAS and RAF-RBD interaction. To test the plate-to-plate
  quality, ten 384-well plates each had five positive wells (SmKRAS with LgRBD) and five negative wells (SmKRAS with the
  LgRBD-DM mutant that does not bind) at 10 µl and at 20 µl reaction volume. The Z' factor of each plate and volume is in
  Figure 5F-G and in the summary table on OSF.
instruction: >-
  For each plate and each volume, give the mean and the SD of the positive and the negative wells and the Z' factor.
instruction_basis: Figure 5F-G of the paper and the file "All plates analysis.csv" of the OSF data.
answers:
  normalization:
    decision: Normalization of the plate signal
    value: percent_activity
    source: Not in the paper. The normalization does not change Z'.
  zprime_stat:
    decision: Statistics for the Z' factor
    value: mean_sd
    source: The summary table gives the mean and the SD of each control and Z' = 1 - 3 (SD_pos + SD_neg) / |mean_pos - mean_neg|.
  exclude_wells:
    decision: Wells that you exclude as outliers
    value: none
    source: The summary table uses all five wells of each control for the 10 µl plates.
  response_level:
    decision: Response level of an absolute IC50
    value: 50
    source: Not in the paper. The analysis reports no absolute IC50, so the tool ignores this value.
  lod_sd:
    decision: LOD as the blank mean plus k standard deviations
    value: 3
    source: Not in the paper. The adapter default; no item uses an LOD.
  recovery_limit_pct:
    decision: Accepted bias of a back-calculated standard (percent)
    value: 20
    source: Not in the paper. The adapter default; no item uses a recovery limit.
  cv_limit_pct:
    decision: Highest accepted CV of replicate wells (percent)
    value: 20
    source: Not in the paper. The adapter default; no item uses a CV limit.
  "*":
    decision: Free questions of the model
    value: Use the values in the decision record.
    source: Not in the paper. The benchmark answers each free question with the values above.
