tool: PSPP (or scipy / statsmodels / R)
adapter_kind: files
data:
  - /Volumes/T7/guided-analysis/data/student1908-sleep/sleep.csv
decisions:
  test: "paired t-test, pairing by ID"
  sidedness: two-sided
  alpha: 0.05
  confidence_level: 0.95
expected:
  - {description: "mean paired difference, group 2 minus group 1", value: 1.58, tolerance: 0.005, source: "computed"}
  - {description: "paired t statistic (absolute value)", value: 4.0621, tolerance: 0.001, source: "computed with scipy"}
  - {description: "degrees of freedom", value: 9, tolerance: 0, source: "computed"}
  - {description: "paired two-sided p", value: 0.002833, tolerance: 0.0001, source: "computed with scipy"}
  - {description: "95% CI lower bound", value: 0.700, tolerance: 0.005, source: "computed"}
  - {description: "95% CI upper bound", value: 2.460, tolerance: 0.005, source: "computed"}
  - {description: "unpaired Welch p (trap result)", value: 0.07939, tolerance: 0.0005, source: "computed"}
notes: |
  Values are computed, not read from the 1908 paper.
  Trap: an unpaired test gives p near 0.079 and a different conclusion. The agent must pair by ID.
  The sign of t depends on the order of the groups.
  Student's 1908 probability value was not read.
