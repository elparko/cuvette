data:
  source: >-
    Dryad dataset 10.5061/dryad.hb62394, copied on Zenodo record 4945997. fetch.sh converts the Excel sheet to
    three CSV files. It keeps the 240 cancer patients with a serum MMP-14 value, makes the event column
    dss_event = 1 - "Disease specific censor" (the raw column is 1 for a censored patient), maps the 8 TNM 7
    stage codes to stages I to IV, and adds the 0/1 columns age_ge67, stage2, stage3, stage4 and diffuse,
    because fit_cox reads numeric columns only and cannot select rows. The two subgroup files hold the
    intestinal and the diffuse type.
  url: https://zenodo.org/records/4945997
  license: >-
    CC0 1.0 public domain dedication, from the Dryad and Zenodo records. The file has a study number for each
    patient and no names. The paper is CC BY 4.0.
  size: 31 KB Excel file, 301 cancer patients and 48 controls. The main CSV has 240 rows and 18 columns.
