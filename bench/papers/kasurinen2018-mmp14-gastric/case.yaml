kind: research paper
short: Kasurinen 2018
field: Statistics
program: lifelines and statsmodels (Python), through the biostats adapter
citation:
  authors: Kasurinen A, Tervahartiala T, Laitinen A, Kokkola A, Sorsa T, Böckelman C, Haglund C
  title: High serum MMP-14 predicts worse survival in gastric cancer
  venue: PLOS ONE 13(12):e0208800
  year: 2018
  doi: 10.1371/journal.pone.0208800
related:
  - text: "Data: Kasurinen A et al. Data from: High serum MMP-14 predicts worse survival in gastric cancer. Dryad (2018), CC0. The benchmark downloads the copy on Zenodo, record 4945997."
    doi: 10.5061/dryad.hb62394
measured: >-
  The study measured serum MMP-14 (matrix metalloproteinase-14) before surgery in 240 patients with gastric
  adenocarcinoma at Helsinki University Hospital, 2000 to 2009. A cut-off of 0.073 ng/ml from a ROC (receiver
  operating characteristic) analysis splits the patients into a low and a high group. The outcome is
  disease-specific survival from the date of surgery. The paper compares the groups with Kaplan-Meier curves and
  the log-rank test, and fits Cox models without and with adjustment for age, stage and Lauren type.
instruction: >-
  Do patients with a high serum MMP-14 have worse disease-specific survival? Give the 5-year survival in each
  group with the log-rank p. Give the hazard ratio for a high MMP-14, unadjusted and adjusted for age 67 or
  more, stage and Lauren type. Give the unadjusted hazard ratio in the intestinal type and in the diffuse type.
instruction_basis: >-
  The abstract, the Survival analyses section, Table 2 (unadjusted and adjusted Cox models) and Table 3 (Cox
  models in subgroups). The paper uses the age split at 67 years and stage as a category with stage I as the
  reference.
answers:
  replicate:
    decision: Unit of replication
    value: the patient, one row for each patient
    source: Patients section. Each of the 240 patients has one serum sample and one follow-up.
  alpha:
    decision: Significance level
    value: 0.05
    source: Statistical analyses section. "We considered a p-value of less than 0.05 as statistically significant."
  cox_covariates:
    decision: Covariates in the Cox model
    value: none fixed. The prompt names the covariates of each model.
    source: >-
      Statistical analyses section and Table 2. The adjusted model has age, stage (a category), Lauren type and
      serum MMP-14. The unadjusted models have serum MMP-14 only. The answer is empty because the harness
      applies one value of this decision to every fit_cox call. A fixed value would turn the unadjusted model
      into the adjusted one.
  ties:
    decision: Method for tied event times
    value: Breslow
    source: >-
      Not in the paper. The paper used SPSS 24, and the SPSS Cox procedure uses the Breslow method. Efron ties
      change the hazard ratios in the third or fourth digit only.
  cox_strata:
    decision: Strata in the Cox model
    value: none
    source: Statistical analyses section. The paper fits no stratified model.
