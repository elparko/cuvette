notes: |
  compref is the reference matrix of the flowCore tests for compdata. The tool matches 10 of the 12 off-diagonal coefficients to 1e-6 and the others to 0.0004
  (FL1-H into FL3-H: 0.032409 against 0.032084) and 0.0001 (FL2-H into FL4-H: 0.002740 against 0.002633).
  Trap: without the log_decades conversion the same method gives coefficients that are 3 to 100 times too large (0.72 for FL1-H into FL2-H).
  Trap: the 99th percentile of the unstained control as the positive cutoff changes the FL3-H row by up to 0.008.
