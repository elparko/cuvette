data:
  source: >-
    The data set compdata of flowCore 2.24.0 (extdata/compdata/data/060909.001 to 060909.005). fetch.sh copies the files from the
    installed package and keeps the reference matrix compref in the reference folder.
  url: https://bioconductor.org/packages/flowCore
  license: Artistic-2.0, the license of flowCore
  size: 660 KB for 5 FCS files with 7500 to 10000 events
