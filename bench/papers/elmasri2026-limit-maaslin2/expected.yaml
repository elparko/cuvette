tool: microbiome (MaAsLin 2 in R)
adapter_kind: script
data:
  - /Volumes/T7/guided-analysis/data/elmasri2026-limit-maaslin2/otutable.csv
  - /Volumes/T7/guided-analysis/data/elmasri2026-limit-maaslin2/metadata.csv
decisions:
  sample_filter: "birth_type=natural"
  min_prevalence: 0.05
  da_method: maaslin2
  fixed_effects: "gestational_age, GWG, age_mother, pre_pregnancy_BMI"
  reference: "GWG, adequate"
  da_normalization: TSS
  da_transform: LOG
  standardize: true
  fdr: 0.05
expected:
  - {description: "Meconium samples in the study", value: 168, tolerance: 0, source: "El Masri 2026, Methods: 168 meconium samples"}
  - {description: "Samples in the model after the filter for vaginal delivery and the removal of missing values", value: 132, tolerance: 0, source: "El Masri 2026, Results: 7 of the 132 study participants; check_limit_maaslin.py"}
  - {description: "Associations with q at or below 0.05", value: 1, tolerance: 0, source: "El Masri 2026, Results: a single significant association; check_limit_maaslin.py"}
  - {description: "Adjusted p value (q) of the most significant OTU", value: 0.043, tolerance: 0.0005, source: "El Masri 2026, Results: q = 0.043; check_limit_maaslin.py gives 0.042647"}
  - {description: "Samples that contain the most significant OTU", value: 7, tolerance: 0, source: "El Masri 2026, Results: 7 of the 132; check_limit_maaslin.py"}
  - {description: "OTUs tested after the prevalence limit (not printed in the paper)", value: 65, tolerance: 0, source: "check_limit_maaslin.py: 65 OTUs, 325 tests"}
  - {description: "p value of the Kruskal-Wallis test of Shannon diversity by GWG category", value: 0.9917, tolerance: 0.005, source: "computed: check_limit_diversity.py; the paper says no difference (Figure 2e)"}
  - {description: "PERMANOVA R2 of GWG (Bray-Curtis, relative abundances)", value: 0.0104, tolerance: 0.0005, source: "computed: check_limit_diversity.py; the paper says no effect"}
  - {description: "PERMANOVA F of GWG", value: 0.678, tolerance: 0.005, source: "computed: check_limit_diversity.py"}
  - {description: "PERMANOVA p of GWG, 999 permutations", value: 0.91, tolerance: 0.06, source: "computed: check_limit_diversity.py, numpy seed 1 gives 0.910; the p value changes with the seed"}
notes: |
  Trap: the model must use only the vaginal births (birth_type natural) and must drop the samples with missing values. Without the filter the count is not 132.
  Trap: the prevalence limit decides how many OTUs are tested, and so the adjusted p value. The paper removes features in fewer than 5 percent of the samples.
  Trap: GWG needs the reference level adequate. Another reference changes the GWG rows and the number of tests.
