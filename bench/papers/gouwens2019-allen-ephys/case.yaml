data:
  source: >-
    Allen Cell Types Database NWB files of the cells 567987585, 595511209 and 563220277. fetch.sh downloads them from
    api.brain-map.org (16 to 21 MB each) and checks the SHA-256 of each one.
  url: https://celltypes.brain-map.org/
  license: Allen Institute Terms of Use (citation required). The benchmark downloads the files and does not copy them into the repository.
  size: 55 MB
notes: >-
  The feature values come from the Cell Types Database, which is the data release of the paper. The adapter reproduces the rheobase,
  the F-I slope, the input resistance and the upstroke to downstroke ratio of each cell to 6 or more digits, because it follows the ipfx
  definitions. The membrane time constant differs by 0.4 to 6 percent. Cell 563220277 has no time constant fit for one sweep.
