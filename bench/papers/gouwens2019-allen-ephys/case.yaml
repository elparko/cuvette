kind: research paper
short: Gouwens 2019
field: Electrophysiology
program: pyABF, h5py and SciPy (Python), through the patch-clamp adapter
citation:
  authors: Gouwens NW, Sorensen SA, Berg J, Lee C, Jarsky T, Ting J, et al.
  title: Classification of electrophysiological and morphological neuron types in the mouse visual cortex
  venue: Nature Neuroscience 22(7):1182-1195
  year: 2019
  doi: 10.1038/s41593-019-0417-0
related:
  - text: "Data: Allen Cell Types Database, cell electrophysiology recordings (NWB files) and the feature table of each cell, api.brain-map.org. Allen Institute Terms of Use."
    url: https://celltypes.brain-map.org/
measured: >-
  Whole-cell current-clamp recordings of mouse visual cortex neurons. The paper defines each electrophysiological feature (rheobase,
  F-I slope, input resistance, membrane time constant, sag, spike shape) and classifies the cells. The Cell Types Database publishes
  the value of each feature for each cell. The article prints distributions, not the value of one cell.
instruction: >-
  For three cells, give the rheobase, the F-I slope, the input resistance, the membrane time constant and the upstroke to downstroke
  ratio of the first spike at rheobase, from the Long Square sweeps.
instruction_basis: >-
  The Methods of the paper and the Allen Institute electrophysiology white paper: the feature definitions of the ipfx package. The
  database fields are ef__threshold_i_long_square, ef__f_i_curve_slope, ef__ri, ef__tau and ef__upstroke_downstroke_ratio_long_square.
answers:
  spike_threshold_method:
    decision: Definition of the spike threshold
    value: dvdt_fraction_of_upstroke
    source: The Allen Institute definition (ipfx spike_detector.refine_threshold_indexes, 5 percent of the mean upstroke).
  dvdt_cutoff_mv_per_ms:
    decision: Spike threshold cutoff for dV/dt
    value: 20
    source: The ipfx default of dv_cutoff, 20 mV per ms.
  min_peak_mv:
    decision: Lowest spike peak
    value: -30
    source: The ipfx default of min_peak, -30 mV.
  baseline_window:
    decision: Baseline window before the step
    value: "0.92,1.02"
    source: The 0.1 s before the step, which starts at 1.02 s (the ipfx baseline interval).
  sweeps:
    decision: Sweeps to include
    value: all
    source: The request limits the sweeps to the Long Square label.
  ljp_mv:
    decision: Liquid junction potential correction
    value: 0
    source: The database values are not corrected, so the benchmark does not correct.
  input_resistance_measure:
    decision: Deflection that gives the input resistance
    value: peak
    source: ipfx subthresh_features.input_resistance uses the peak deflection.
  '*':
    decision: Other questions of the agent
    value: Use the values in the decision record.
    source: Not in the paper. The benchmark answers each free question with this text.
