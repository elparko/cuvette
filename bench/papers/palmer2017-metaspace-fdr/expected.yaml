tool: METASPACE (metaspace2020 python client or web app)
adapter_kind: python
data:
  - /Volumes/T7/guided-analysis/data/palmer2017-metaspace-fdr/MBa2s1.zip
  - /Volumes/T7/guided-analysis/data/palmer2017-metaspace-fdr/MBa2s2.zip
  - /Volumes/T7/guided-analysis/data/palmer2017-metaspace-fdr/MBa2s3.zip
  - /Volumes/T7/guided-analysis/data/palmer2017-metaspace-fdr/MTBLS313_m_MTBLS313_imagingms_metabolite_profiling_mass_spectrometry_v2_maf.tsv
  - /Volumes/T7/guided-analysis/data/palmer2017-metaspace-fdr/sim001_twosquares.zip
decisions:
  database: "HMDB (version 2.5 in the paper)"
  adducts: "+H, +Na, +K"
  fdr_level: 0.1
  mz_tolerance_ppm: 2.5
  replication_unit: "tissue section; 3 serial sections of animal a2"
  image_preprocessing: "hot-spot removal at 99th percentile, then 3x3 median filter"
  resolving_power: "130000 at m/z 400"
expected:
  - {description: "sum formulas annotated in all 3 serial sections of animal a2", value: 51, tolerance: 8, source: "paper Fig 2e; also computed from the MTBLS313 MAF (exactly 51). Tolerance is wide because today's engine differs from pySM"}
  - {description: "total sum formulas annotated, all datasets", value: 103, tolerance: 20, source: "paper main text; MTBLS313 MAF has 103 unique formulas"}
  - {description: "annotations validated by LC-MS/MS", value: 16, tolerance: 0, source: "paper main text (no LC-MS/MS data downloaded)"}
  - {description: "exact-mass filter lowest FDR for 10 annotations", value: 0.25, tolerance: 0, source: "paper main text, Fig 2h"}
  - {description: "dominant lipid classes", value: "PC, PE, SM, PA", tolerance: null, source: "paper Supp Note 1 Table S5"}
  - {description: "unique formulas in a2s1+a2s2+a2s3 (computed from MAF)", value: 66, tolerance: 0, source: "computed from MAF"}
  - {description: "simulated data: formulas from HMDB in truth", value: 300, tolerance: 0, source: "paper Supp Note 1 section 1.2; MTBLS317 MAF has 300 rows"}
notes: |
  Needs a METASPACE account and API key to upload imzML. Without a key the agent can only read the MAF tables.
  Paper's "51 of 73" is only half reproduced: 51 matches the MAF, 73 does not (MAF union is 66 for s1-s3, 76 for s1-s5). Do not require 73.
  Today's METASPACE engine, databases and scoring differ from pySM 2016. Treat counts as approximate.
  The zip files hold one imzML + ibd pair each (MBa2s1 holds Brain02_Bregma1-42_01). Names do not say a2s1; mapping is by order and is an inference.
  Mouse data MBa* columns in the MAF are empty; the a1s*/a2s* columns carry the annotations.
  Trap: scientist must choose the FDR level; 0.5 or no FDR filter would give hundreds of false hits.
  Trap: FDR depends on the database and adduct list; changing them changes the count.
  License: both MTBLS313 and MTBLS317 investigation files state "EMBL-EBI Terms of Use".
