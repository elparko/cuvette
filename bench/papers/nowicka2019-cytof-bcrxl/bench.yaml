adapters: [cytof]
prompt: |
  I have mass cytometry data of peripheral blood cells from 8 healthy donors. Each donor has two FCS files: one unstimulated (Reference) and one stimulated through the B cell receptor (BCR-XL). The 16 files are in {data}/nowicka2019-cytof-bcrxl/fcs . The sample table is {data}/nowicka2019-cytof-bcrxl/sample_table.csv (columns sample_id, condition and patient_id). The last channel of each file, population_id, holds the cell type from the published analysis: 1 B-cells IgM-, 2 B-cells IgM+, 3 CD4 T-cells, 4 CD8 T-cells, 5 DC, 6 monocytes, 7 NK cells, 8 surface-negative cells. The 10 lineage markers are CD3, CD45, CD4, CD20, CD33, CD123, CD14, IgM, HLA-DR and CD7. Cluster the cells with the lineage markers. Then count the cells of each cell type (population_id) in each sample, and test each cell type for a difference in frequency between BCR-XL and Reference, with each donor compared with itself. Tell me the number of cells in the file of donor 2 with BCR-XL and in the file of donor 1 Reference. Tell me the percent of NK cells and of CD4 T-cells in the Reference file of donor 1. Tell me the p value of the NK cells and of the B-cells IgM-, the adjusted p value of the CD8 T-cells, and how many cell types differ. Also tell me how many cell types differ if the test ignores the donor pairing, and the p value of the B-cells IgM+ in that test. Write every number in the answer text.
setup: {}
answers:
  question: "Does the frequency of any cell type change after B cell receptor stimulation?"
  replicate: "samples from different donors (one FCS file for each donor and condition)"
  markers: "CD3,CD45,CD4,CD20,CD33,CD123,CD14,IgM,HLA-DR,CD7"
  cofactor: 5
  grid_x: 10
  grid_y: 10
  n_metaclusters: 20
  seed: 1234
  population_column: label
  condition: condition
  reference: Reference
  pair_by: patient_id
  da_method: glmm
  fdr: 0.05
  exclusions: none
allow: all
timeout_s: 1800
data: [nowicka2019-cytof-bcrxl/fcs, nowicka2019-cytof-bcrxl/sample_table.csv]
items:
  - {key: cells_donor2_bcrxl, description: "Cells in the file of donor 2 with BCR-XL", value: 16675, exact: true, tool: population_frequencies}
  - {key: cells_donor1_reference, description: "Cells in the file of donor 1 Reference", value: 2739, exact: true, tool: population_frequencies}
  - {key: nk_percent_donor1_reference, description: "Percent of NK cells in the Reference file of donor 1", value: 14.3, tolerance: 0.05, tool: population_frequencies}
  - {key: cd4_percent_donor1_reference, description: "Percent of CD4 T-cells in the Reference file of donor 1", value: 44.7, tolerance: 0.05, tool: population_frequencies}
  - {key: p_nk_paired, description: "p value of the NK cells, paired model", value: 4.5e-13, tolerance: 1.0e-14, tool: differential_abundance}
  - {key: p_bcells_igm_neg_paired, description: "p value of the B-cells IgM-, paired model", value: 2.2e-11, tolerance: 1.0e-12, tool: differential_abundance}
  - {key: padj_cd8_paired, description: "Adjusted p value of the CD8 T-cells, paired model", value: 0.0019, tolerance: 0.0001, tool: differential_abundance}
  - {key: n_different_paired, description: "Cell types with adjusted p at or below 0.05, paired model", value: 6, exact: true, tool: differential_abundance}
  - {key: n_different_unpaired, description: "Cell types with adjusted p at or below 0.05, model without the pairing", value: 3, exact: true, tool: differential_abundance, from_comparison: true}
  - {key: p_bcells_igm_pos_unpaired, description: "p value of the B-cells IgM+, model without the pairing", value: 0.0135, tolerance: 0.0005, tool: differential_abundance, from_comparison: true}
