notes: |
  The paper used BioTek Gen5 3.16 with a 4PL fit for each run. Gen5 fits the mean OD of the duplicate standards and back-calculates the mean OD of each sample, with no blank subtraction. With these settings, SciPy gives the Gen5 concentration of each of the 89 dilution values in the workbook to five digits (check.py, check.out).
  The nominal values in the CSV are the printed Table 1 values (0.060, 0.030 and 0.015 for dilutions 8 to 10, not 0.0605, 0.03025 and 0.015125). The printed recoveries of dilutions 9 and 10 match only with these rounded values.
  Two printed values do not reproduce: the recovery of dilution 8 (92.0; computed 92.99 with nominal 0.060 and 92.22 with 0.0605) and the CV of the LPC concentration (20.09; computed 20.03). They are reference items.
  The workbook goes to the reference folder, because it holds the Gen5 concentrations. The data folder holds only the CSV of the optical densities.
  Trap: blank subtraction or a fit to each replicate well changes the concentrations in the second or third digit.
