tool: drc (R), fit_standard_curve of the drc adapter
adapter_kind: script
data:
  - /Volumes/T7/guided-analysis/data/yun2026-lasv-elisa/lasv_elisa_runs.csv
decisions:
  curve_model: 4PL
  weighting: none
  blank: "none (Gen5 fitted the raw OD)"
  average_replicates: "signal (Gen5 fits the mean OD of the duplicate standards and back-calculates the mean OD of each sample)"
  exclude_wells: "R7-LPC-2, R9-LPC-1 (masked in Gen5 by the authors)"
  range_rule: "recovery 75 to 125 percent and CV below 25 percent for the OD and the concentration"
