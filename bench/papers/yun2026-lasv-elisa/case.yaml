data:
  source: >-
    S1 Data of the article, sheet "Table 1 dynamic range". fetch.sh writes one row for each well: the run, a well name
    (R<run>-<sample>-<replicate>), the type, the sample, the standard concentration, the nominal value of the dilutions
    and controls from Table 1, the OD and the masked flag. The Gen5 concentrations stay in the workbook in the reference folder.
  url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0340568
  license: CC BY 4.0, the license of the article and its supplement. The data have no personal information.
  size: 184 KB Excel workbook with 16 sheets. The CSV has 477 rows and 8 columns.
