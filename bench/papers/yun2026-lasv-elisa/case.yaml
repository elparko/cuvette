kind: research paper
short: Yun 2026
field: Immunoassay (ELISA)
program: drc (R), through the drc adapter. The paper used BioTek Gen5 3.16.
citation:
  authors: Yun H, Sigei F, Appiah NYA, Quaye CNO, Yankey CAB, Kyei-Baafour E, Hayes P, Marini A, Bailer RT, Zaric M, Kusi KA
  title: Development and qualification of an enzyme-linked immunosorbent assay to detect human serum immunoglobulin G reactive to multiple lineages of Lassa virus nucleoprotein
  venue: PLOS ONE 21(7):e0340568
  year: 2026
  doi: 10.1371/journal.pone.0340568
related:
  - text: "Data: S1 Data (Excel workbook) of the article, CC BY 4.0. fetch.sh downloads it from the PLOS supplement link."
    url: https://journals.plos.org/plosone/article/file?type=supplementary&id=10.1371/journal.pone.0340568.s010
measured: >-
  The study qualified an indirect ELISA for human serum IgG against Lassa virus nucleoprotein, calibrated to the
  First WHO International Standard in IU/mL. For the dynamic range, nine runs each had a ten-point standard curve in
  duplicate, four blank wells, high and low positive controls (HPC, LPC) and a negative control in triplicate, and a
  ten-point two-fold dilution series of a reference serum pool in duplicate. Gen5 fitted a 4PL curve for each run and
  back-calculated each dilution and control. Table 1 gives the mean OD, the mean interpolated concentration, their CV over
  the nine runs and the recovery against the nominal value.
instruction: >-
  Fit a 4PL standard curve for each run and back-calculate the dilutions and the controls. Give the mean OD and the mean
  concentration over the runs with their CV, and the recovery for each dilution and each positive control. Give the LLOQ
  and the ULOQ from the dilutions with a recovery of 75 to 125 percent and a CV below 25 percent.
instruction_basis: >-
  Methods (ELISA procedure: 4PL standard curves in Gen5 3.16), Results (Anti-LASV-NP IgG ELISA dynamic range and positive
  controls: the LLOQ and ULOQ rule and values), and Table 1.
answers:
  curve_model:
    decision: Standard curve model
    value: 4PL
    source: Methods. "extrapolated by four-parameter logistic (4PL) standard curves using Biotek GEN5 version 3.16".
  weighting:
    decision: Weighting of the standard curve fit
    value: none
    source: Not in the paper. Gen5 fits without weighting by default. With no weighting, SciPy gives the Gen5 values in the workbook to five digits (check.out).
  blank:
    decision: Blank correction
    value: none
    source: Not in the paper. With no blank subtraction, SciPy gives the Gen5 values to five digits (check.out). With blank subtraction they differ.
  average_replicates:
    decision: Average the replicate wells before the fit
    value: signal
    source: The workbook gives a mean OD for each standard and sample and one Gen5 concentration for each mean OD. A fit to the mean OD gives the Gen5 values (check.out).
  lod_sd:
    decision: LOD as the blank mean plus k standard deviations
    value: 3
    source: Not used for the items. The paper gives a cutoff OD from healthy volunteers, not an LOD.
  recovery_limit_pct:
    decision: Accepted bias of a back-calculated standard (percent)
    value: 25
    source: Results. "within the 75–125% recovery range".
  cv_limit_pct:
    decision: Highest accepted CV of replicate wells (percent)
    value: 25
    source: Results. "remained precise with coefficients of variation (CV) <25%".
  exclude_wells:
    decision: Wells that you exclude as outliers
    value: R7-LPC-2, R9-LPC-1
    source: S1 Data. The two OD values have a trailing asterisk (masked in Gen5), and the printed mean OD of the LPC leaves them out.
  response_level:
    decision: Response level of an absolute IC50
    value: 50
    source: Not in the paper. The analysis reports no absolute IC50, so the tool ignores this value.
  "*":
    decision: Free questions of the model
    value: Use the values in the decision record.
    source: Not in the paper. The benchmark answers each free question with the values above.
