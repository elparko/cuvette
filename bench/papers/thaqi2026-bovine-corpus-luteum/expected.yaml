tool: limma (R), prepare_protein_table and test_differential_proteins of the limma-proteomics adapter
adapter_kind: script
data:
- /Volumes/T7/guided-analysis/data/thaqi2026-bovine-corpus-luteum/RAW_P337_02B_proteinGroups.txt
decisions:
  exclude_flags: Only identified by site, Reverse, Potential contaminant
  min_peptides: 2
  exclude_samples: none
  min_valid: 6
  valid_rule: at least one group
  normalization: quantile
  imputation: downshift normal
  impute_shift: 1.8
  impute_width: 0.3
  impute_scope: all samples
  step_order: impute first
  impute_seed: 1
  variance_model: robust
  fdr: 0.05
  min_abs_log2fc: 1
  '*': Use the values in the decision record.
