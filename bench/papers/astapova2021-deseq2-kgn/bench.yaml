adapters: [deseq2]
prompt: |
  Does dihydrotestosterone (DHT) change gene expression in KGN human granulosa cells? I serum-starved the cells and treated them with 25 nM DHT or with ethanol vehicle for 12 hours. I did five independent experiments on different dates. Each experiment gave one DHT culture and one vehicle culture. The count table is {data}/astapova2021-deseq2-kgn/kgn_counts.csv (gene-level featureCounts, one column for each sample) and the sample table is {data}/astapova2021-deseq2-kgn/kgn_samples.csv (columns treatment and experiment). Tell me how many genes are differentially expressed, how many go up and how many go down with DHT, and give a table of the top 20 genes with fold change and adjusted p value. Write every number in the answer text.
answers:
  question: "Does dihydrotestosterone change gene expression in KGN granulosa cells, and in which genes?"
  replicate: "donors or animals (several libraries for each one)"
  design: "~ experiment + treatment"
  variable: treatment
  reference_level: VEH
  test_level: DHT
  min_count: 0
  min_samples: 1
  alpha: 0.05
  lfc_threshold: 0
  exclusions: none
allow: all
timeout_s: 1800
data: [astapova2021-deseq2-kgn/kgn_counts.csv, astapova2021-deseq2-kgn/kgn_samples.csv]
items:
  # Source: Astapova 2021, Results section "Androgen-induced Androgen Receptor Transcriptional Activity Is
  # Limited in Granulosa Cells" and Figure 1A: 173 genes, 125 up and 48 down, paired comparison, DESeq2 1.22.1,
  # threshold 0.05. check_deseq2.R (DESeq2 1.52.0, R 4.6.1) on the GEO count file gives 173, 125 and 48
  # exactly with ~ experiment + treatment, no pre-filter and padj < 0.05. Output: check_deseq2.out.
  # Tolerance 2: room for numerical changes between DESeq2 releases. The design without the experiment term
  # gives 2 genes, far outside it.
  - {key: significant_padj_005, description: "Genes with padj < 0.05, DHT vs vehicle, paired design", value: 173, tolerance: 2}
  - {key: up_padj_005, description: "Genes up with DHT at padj < 0.05", value: 125, tolerance: 2}
  - {key: down_padj_005, description: "Genes down with DHT at padj < 0.05", value: 48, tolerance: 2}
  - {key: genes_in_table, description: "Genes in the count table", value: 59087, exact: true, in_answer: false}
  # Discussion: "Without the pair factor, only 2 genes were differentially expressed". check_deseq2.R gives 2.
  - {key: significant_without_pairing, description: "Genes with padj < 0.05 with the design ~ treatment (pairing left out)", value: 2, tolerance: 0.5, in_answer: false, trap: true}
