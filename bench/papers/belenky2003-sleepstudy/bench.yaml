adapters: [biostats]
prompt: |
  Eighteen people were limited to 3 hours of sleep for 10 days. The file {data}/belenky2003-sleepstudy/sleepstudy.csv has their reaction time (Reaction, in ms) for each day (Days 0 to 9), with a Subject column. How much slower do they get each day? Give me the change per day with a standard error and a confidence interval. People differ in how fast they start and how fast they slow down, so take that into account. Write every number in your final answer text.
answers:
  replicate: "repeated measures on the same subjects (model the subject)"
  alpha: 0.05
  model_formula: "Reaction ~ Days"
  random_effects: "~Days"
  reml: true
  standard_errors: cluster
allow: all
data: [belenky2003-sleepstudy/sleepstudy.csv]
items:
  - {key: days_slope, description: "Days slope in ms per day", value: 10.467, tolerance: 0.01}
  - {key: intercept, description: "Intercept in ms", value: 251.405, tolerance: 0.01, in_answer: false}
  - {key: se_days_random_slope, description: "SE of Days, random slope model", value: 1.546, tolerance: 0.01}
  - {key: se_days_random_intercept_trap, description: "SE of Days, random intercept only (trap)", value: 0.804, tolerance: 0.01, in_answer: false, trap: true}
  - {key: se_days_ols_trap, description: "SE of Days, OLS (trap)", value: 1.238, tolerance: 0.01, in_answer: false, trap: true}
  - {key: intercept_variance, description: "Subject intercept variance, slope model", value: 612.10, tolerance: 0.5, in_answer: false}
  - {key: slope_variance, description: "Slope variance", value: 35.07, tolerance: 0.1, in_answer: false}
  - {key: residual_variance, description: "Residual variance, slope model", value: 654.94, tolerance: 0.5, in_answer: false}
