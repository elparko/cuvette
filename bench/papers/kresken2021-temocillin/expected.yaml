notes: |
  The paper used the EUCAST breakpoints of January 2021 (version 11.0) with broth microdilution. AMR 3.0.1 has this table as EUCAST 2021.
  Piperacillin/tazobactam: S at 8 mg/L or less, R above 8 mg/L for Enterobacterales. Temocillin: S at 0.001 or less, R above 16, so I covers 0.002 to 16.
  The paper reports temocillin as susceptible when the MIC is 16 mg/L or less. That is S and I together, so the decision susceptible_definition must be "S and I".
  Trap: with "S only", the percent susceptible of temocillin is 0 for every group.
  MIC50 and MIC90 are the values at rank ceil(0.5 n) and ceil(0.9 n) of the sorted MICs. check.py gives all 24 printed values from the data.
  The data file stores a limit such as "1 or less" as the number 1. The paper prints "<=1" for these MIC50 values and ">=128" for one MIC90.
