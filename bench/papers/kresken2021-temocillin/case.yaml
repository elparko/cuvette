data:
  source: >-
    Zenodo record 6575080, file Data_MICs_PEG_2016_17_temocillin_data_set_11062021.xlsx (mirror of Dryad 10.5061/dryad.931zcrjkc).
    fetch.sh writes temocillin_mics.csv: the isolate, the species, the group by third-generation cephalosporin resistance
    (cefotaxime MIC above 2 or ceftazidime MIC above 4 mg/L) and the MIC of five drugs, named with the drug name.
  url: https://zenodo.org/records/6575080
  license: CC0 for the data. The paper is CC BY 4.0.
  size: 19 KB Excel workbook with 109 isolates
