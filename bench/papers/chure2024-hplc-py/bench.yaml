adapters: [chromatography]
prompt: |
  I have an HPLC run exported from the instrument: {data}/chure2024-hplc-py/sample.txt. It is a Shimadzu LabSolutions text export. The trace starts at line 84, with the columns "R.Time (min)" and "Intensity", separated by commas. The detector signal drifts, so correct the baseline. A peak is about 5 minutes wide at the base. Only the part from 10 to 20 minutes holds the peaks of interest.

  1. How many peaks are in that window? Give me the retention time and the area of each one.
  2. For the first peak, also give me the fitted amplitude, the scale and the skew.

  I also have a lactose calibration in {data}/chure2024-hplc-py/lactose/: four standards named lactose_mM_0.5.csv, lactose_mM_1.csv, lactose_mM_3.csv and lactose_mM_6.csv, with the concentration in mM in the file name, and one unknown sample, lactose_mM_2.csv. Each file has the columns time and signal. Each trace holds one peak. Integrate them with the same settings as the run above, and over the whole trace.

  3. Integrate the lactose peak in each standard, fit a calibration curve with an intercept, and give me the slope, the intercept and R squared.
  4. Give me the concentration of the unknown sample in mM.

  Write every number in your final answer text.
answers:
  baseline: snip
  peak_width: 5
  prominence: 0.01
  through_origin: false
  weighting: none
allow: all
timeout_s: 1800
data:
  - chure2024-hplc-py/sample.txt
  - chure2024-hplc-py/lactose/lactose_mM_0.5.csv
  - chure2024-hplc-py/lactose/lactose_mM_1.csv
  - chure2024-hplc-py/lactose/lactose_mM_3.csv
  - chure2024-hplc-py/lactose/lactose_mM_6.csv
  - chure2024-hplc-py/lactose/lactose_mM_2.csv
items:
  - {key: n_peaks, description: "Number of peaks between 10 and 20 minutes", value: 6, exact: true}
  - {key: peak1_retention_time, description: "Retention time of the first peak, in minutes", value: 10.90, tolerance: 0.005}
  - {key: peak1_area, description: "Area of the first peak", value: 2.8e6, tolerance: 0.05e6}
  - {key: peak1_amplitude, description: "Fitted amplitude of the first peak", value: 2.3e4, tolerance: 0.05e4}
  - {key: peak1_scale, description: "Fitted scale of the first peak", value: 0.16, tolerance: 0.005}
  - {key: peak1_skew, description: "Fitted skew of the first peak", value: 0.70, tolerance: 0.01}
  - {key: peak3_retention_time, description: "Retention time of the third peak, in minutes", value: 14.45, tolerance: 0.005}
  - {key: peak1_area_exact, description: "Area of the first peak, full precision", value: 2805655.43, tolerance: 300, in_answer: false}
  - {key: calibration_slope, description: "Calibration slope, area per mM", value: 156586.74, tolerance: 160}
  - {key: calibration_intercept, description: "Calibration intercept, in area units", value: 14624.94, tolerance: 150}
  - {key: calibration_r_squared, description: "R squared of the calibration", value: 0.99887, tolerance: 0.00005}
  - {key: unknown_concentration, description: "Concentration of the unknown lactose sample, in mM", value: 1.8994, tolerance: 0.005}
  - {key: n_peaks_no_baseline_trap, description: "Number of peaks with no baseline correction (trap result)", value: 7, exact: true, in_answer: false, trap: true}
