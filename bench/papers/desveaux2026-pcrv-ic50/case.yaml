kind: research paper
short: Desveaux 2026
field: Dose-response (cell assays)
program: drc (R), through the drc adapter. The paper used R 4.3.2 with drc.
citation:
  authors: Desveaux JM, Faudry E, Contreras-Martel C, Cretin F, Dergan-Dylon LS, Amen A, Bally I, Tardivy-Casemajor V, Chenavier F, Fouquenet D, Caspar Y, Attree I, Dessen A, Poignard P
  title: Neutralizing human monoclonal antibodies that target the PcrV component of the type III secretion system of Pseudomonas aeruginosa act through distinct mechanisms
  venue: eLife 14:RP105195
  year: 2026
  doi: 10.7554/eLife.105195
related:
  - text: "Data: Figure 6 source data 1 of the article (Excel), CC BY 4.0. fetch.sh downloads it from the eLife CDN."
    url: https://cdn.elifesciences.org/articles/105195/elife-105195-fig6-data1-v1.xlsx
measured: >-
  The study isolated human monoclonal antibodies against PcrV and compared them with MEDI3902 and 30-B8. The injection
  assay measures ExoS-Bla injection into A549 cells; the cytotoxicity assay measures macrophage death. Each assay has three
  experiments with three technical replicates, from 0.001 or 0.01 to 100 µg/mL. The response is normalized to the
  no-antibody and the non-infected controls. drc fits a three-parameter log-logistic curve and gives the IC50.
instruction: >-
  Fit a three-parameter log-logistic curve to the normalized response for each antibody in the injection assay, for P3D6
  and 30-B8 in the cytotoxicity assay, and for 30-B8 against each PcrV variant. Give each IC50 with a 95% confidence interval.
instruction_basis: >-
  Methods (statistical analysis: drc, three-parameter log-logistic model), Results (IC50 values of Figure 6A and Figure 4B),
  and the legend of Figure 6 supplement 1 (IC50 values of 30-B8 against the variants).
answers:
  dr_model:
    decision: Dose-response model
    value: 3PL
    source: Methods. "Dose-response fitting was performed using the drc package based on a three-parameter log-logistic model."
  ic50_type:
    decision: Relative or absolute IC50
    value: relative
    source: Not in the paper. drc ED(fit, 50) gives the relative IC50 by default. With a lower limit of 0 the relative IC50 is the dose at half of the fitted top.
  ci_method:
    decision: Confidence interval of the IC50
    value: delta
    source: Not in the paper. The drc default for ED().
  weighting:
    decision: Weighting of the fit
    value: none
    source: Not in the paper. The drc default.
  "*":
    decision: Free questions of the model
    value: Use the values in the decision record.
    source: Not in the paper. The benchmark answers each free question with the values above.
