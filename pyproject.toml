[project]
name = "guided-analysis"
version = "0.0.1"
description = "An AI agent that analyzes data in existing science software while the scientist owns the method decisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guided_analysis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
