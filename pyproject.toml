[project]
name = "guided-analysis"
version = "0.1.0"
description = "An AI agent that analyzes data in existing science software while the scientist owns the method decisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "mcp>=2.2,<3",
    "anthropic>=1.12",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ga = "guided_analysis.cli:main"

[project.entry-points."guided_analysis.adapters"]
imagej = "guided_analysis.catalog.imagej:ADAPTER_DIR"
smile-msi = "guided_analysis.catalog.smile_msi:ADAPTER_DIR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guided_analysis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
